name: 视觉回归验收

# ---------------------------------------------------------------------------
# v0.0.6：独立完整视觉验收工作流
#
# 任务书 §九 要求：
#   - 普通 PR：TypeScript / 单元测试 / E2E / API 契约 / 核心视觉回归 / 构建与安全
#   - 独立完整视觉工作流：所有 7 个视口 × 3 个浏览器 × 组件几何对比
#     + 截图基线差异 + 失败截图与 Trace 上传 + 控制台错误收集 + 溢出检测
#   - 视觉工作流**不得依赖开发机的历史缓存**
#   - 明确区分「实际回归失败」「原站不可达」「基线缺失」
#   - 关键视觉测试失败**不得伪装成 success**
#   - **不得**通过降低阈值 / 删除失败截图 / 自动更新基线强行通过
#
# 设计要点：
#   1. **每次都是全新环境**：全新 service container + 全新数据库 +
#      全新 build + 全新基线对比 —— 不复用任何缓存。
#   2. **基线缺失 = 明确失败**（exit 2 / 标记 missing-baseline），
#      不静默通过、不自动重建基线。
#   3. **溢出检测**独立成一项，任一组合溢出即失败。
#   4. 失败时上传 **截图 + components.json + 控制台错误** 作为 artifact。
#   5. 原站可达性单独探测（不影响本站回归结论，但会如实标注）。
# ---------------------------------------------------------------------------

on:
  # 完整视觉回归只在 **master 与 feat/fix 分支** 上跑（PR 上跑核心子集，
  # 完整 63 组合留给本工作流，避免每次 PR 都跑 20 分钟）
  push:
    branches: [master, 'feat/**', 'fix/**']
  pull_request:
    branches: [master]
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'tools/visual/**'
      - 'scripts/seed.ts'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: '人工审查后显式更新视觉基线（默认否）'
        type: boolean
        default: false

# 同一分支的新推送取消旧的运行
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.4'
  APP_RUNTIME_ENV: test
  TEST_ENV_ISOLATED: '1'
  DISABLE_CAPTCHA: '1'
  ENABLE_DEBUG_ENDPOINTS: '1'
  DEBUG_ENDPOINT_TOKEN: ci-debug-token-not-for-production
  APP_URL: http://localhost:3010
  NEXT_PUBLIC_APP_URL: http://localhost:3010
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_EMAIL: admin@ci.local
  SEED_ADMIN_PASSWORD: ci-admin-password-12345
  SEED_DEMO_USERS: '1'
  SEED_DEMO_PASSWORD: ci-demo-password-12345
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
  RATE_LIMIT_LOGIN_MAX: '10'
  RATE_LIMIT_POST_MAX: '5'
  RATE_LIMIT_REPLY_MAX: '20'
  RATE_LIMIT_WINDOW_SECONDS: '60'
  # ⚠️ 必须显式注入 —— service container 不会自动注入到 job 的 env。
  #    缺失时 drizzle-kit migrate 会**静默失败**（无错误信息，只有 exit 1），
  #    这与 ci.yml 里各步骤显式设置 DATABASE_URL 的做法一致。
  DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_visual
  REDIS_URL: redis://:ci-redis-password-not-real@localhost:6379
  REDIS_PASSWORD: ci-redis-password-not-real

jobs:
  visual:
    name: 组件级视觉回归（7 视口 × 3 浏览器 × 3 页面）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      exit_code: ${{ steps.regression.outputs.exit_code }}
      origin_status: ${{ steps.origin.outputs.origin_status }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ci-postgres-password-not-real
          POSTGRES_DB: v2ex_visual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2ex -d v2ex_visual"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ci-redis-password-not-real
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci-redis-password-not-real ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Playwright 浏览器（3 引擎）
        # ⚠️ 必须装**三个**引擎：只跑 Chromium 发现不了 Firefox 的
        #    table 扩展行为（V5-17 的 23px 溢出就是只在 Firefox 复现的）。
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 探测原站可达性（如实标注，不影响本站结论）
        # 任务书 §六：原站不可达时**优先完成本站自身视觉回归**，
        # 且**不得**把本站回归通过冒充成与原站一致。
        id: origin
        run: |
          set +e
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 https://www.v2ex.com/ 2>/dev/null)
          RC=$?
          if [ "$RC" = "0" ] && [ "$CODE" = "200" ]; then
            echo "origin_status=reachable" >> "$GITHUB_OUTPUT"
            echo "原站可达（HTTP $CODE）—— 双站对照可在人工审查阶段进行"
          else
            echo "origin_status=unreachable" >> "$GITHUB_OUTPUT"
            echo "::warning::原站不可达（curl rc=$RC http=$CODE）—— 本次仅完成**本站自身**视觉回归，**不构成**与原站视觉一致的结论"
          fi

      - name: 迁移
        run: |
          set -euo pipefail
          echo "::group::迁移前自检"
          echo "DATABASE_URL=${DATABASE_URL%%:*}://***@${DATABASE_URL##*@}"
          npx drizzle-kit migrate
          echo "::endgroup::"

      - name: seed（确定性数据）
        env:
          SEED_TIME_ANCHOR: '2026-11-06T04:00:00.000Z'
        run: npx tsx scripts/seed.ts

      - name: 构建
        run: npx next build

      - name: 启动应用
        run: |
          npx next start -p 3010 > /tmp/visual-server.log 2>&1 &
          echo $! > /tmp/visual-server.pid
          for i in $(seq 1 60); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3010/ 2>/dev/null || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 1
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::应用未就绪"; tail -30 /tmp/visual-server.log; exit 1
          fi

      - name: 视觉回归（与基线对比）
        id: regression
        run: |
          set +e
          # ⚠️ **不**允许在 CI 里自动更新基线 —— 基线更新必须人工审查。
          #    只有显式勾选 workflow_dispatch 的 update_baseline 才允许。
          ARGS=(--base http://localhost:3010 --compare-baseline)
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            echo "::warning::本次运行显式请求更新基线（人工审查责任在发起人）"
            ARGS=(--base http://localhost:3010 --save-baseline)
          fi
          node tools/visual/regression.mjs "${ARGS[@]}" 2>&1 | tee /tmp/visual-regression.log
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit 0   # 判定放到下一步，让三类失败能**分别**报告

      - name: 判定结果（区分三类失败）
        # ⚠️ 任务书 §九：明确区分「实际回归失败 / 原站不可达 / 基线缺失」，
        #    且**关键视觉测试失败不得伪装成 success**。
        run: |
          set +e
          RC=${{ steps.regression.outputs.exit_code }}
          MISSING=$(grep -c "基线不存在" /tmp/visual-regression.log || true)
          OVERFLOW=$(grep -cE "溢出 [0-9]+px" /tmp/visual-regression.log || true)
          # ⚠️ 工具输出用的是**全角冒号**（「回归项合计：N」）——
          #    用半角去 grep 会永远匹配不到 ⇒ 恒为 0 ⇒ 失败被吞掉。
          #    这里只取「回归项合计」后面的**数字**，不依赖冒号全半角。
          REGRESS=$(grep -oE "回归项合计.{0,2}[0-9]+" /tmp/visual-regression.log | grep -oE "[0-9]+$" || echo 0)
          INCONSISTENT=$(grep -oE "不一致组件合计.{0,2}[0-9]+" /tmp/visual-regression.log | grep -oE "[0-9]+$" || echo 0)

          echo "退出码=$RC  回归项=$REGRESS  跨浏览器不一致=$INCONSISTENT  溢出项=$OVERFLOW  基线缺失=$MISSING"

          if [ "$MISSING" != "0" ]; then
            echo "::error::视觉基线缺失 —— 不得静默通过。请人工审查后显式重跑（workflow_dispatch + update_baseline=true）"
            exit 1
          fi
          if [ "$OVERFLOW" != "0" ]; then
            echo "::error::检测到横向溢出（$OVERFLOW 处）—— 移动端布局被破坏"
            exit 1
          fi
          if [ "$RC" != "0" ] || [ "$REGRESS" != "0" ]; then
            echo "::error::视觉回归失败：$REGRESS 个组件变化（详见上方日志与 artifact）"
            exit 1
          fi
          if [ "$INCONSISTENT" != "0" ]; then
            echo "::error::同视口下跨浏览器存在 $INCONSISTENT 项不一致 —— 跨浏览器一致性未达标"
            exit 1
          fi
          echo "✅ 视觉回归通过：63 组合零回归项、零横向溢出、三引擎一致"

      - name: 上传视觉证据（截图 + 测量数据 + 控制台错误）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-evidence-${{ github.run_id }}
          path: |
            docs/evidence/visual/runs/
            /tmp/visual-regression.log
            /tmp/visual-server.log
          retention-days: 14
          if-no-files-found: warn
