# ---------------------------------------------------------------------------
# gitleaks 配置（v0.0.9 新增）
#
# ## 为什么需要这个文件
#
# v0.0.9 发布干跑实测（run 42373086097）发现：gitleaks 的 `generic-api-key`
# 规则命中了 **3 处 E2E 测试固件口令**：
#
#   e2e/v005-password-reset-flow.spec.ts:235  'BrandNewPass98765'
#   e2e/v008-smtp-stability.spec.ts:137       'StabOld12345'
#   e2e/v008-smtp-stability.spec.ts:181       'StabNew98765'
#
# 这些**不是**真实凭据 —— 它们是「密码重置流程」测试里用来验证
# 「旧口令失效 / 新口令生效」的**测试输入**。
# 但它们是硬编码的**高熵字符串**，且紧邻 `Password =` 关键字
# ⇒ 命中 `generic-api-key`（该规则看的是「赋值目标名 + 高熵值」，
# 而不是「这个值是不是真的密钥」）。
#
# v0.0.4 的干跑是 0 泄漏 —— 因为那时还没有 `v008-smtp-stability.spec.ts`，
# 而 v005 用的口令熵值更低。
#
# ## 处理原则：**按值精确放行，不按路径放行**
#
# ❌ 不按路径放行（`paths = ['e2e/.*']`）——
#    那等于**给整个 e2e 目录开免检**：将来有人在 e2e 里写真实密钥也不会被发现。
#
# ✅ 按**精确的字符串值**放行 —— 只豁免这 3 个已知的测试固件口令，
#    任何**其它**高熵字符串（包括同目录的新增）仍会被检出。
#
# ## 维护纪律
#
# 新增放行条目时**必须**同时说明：
#   ① 为什么它不是真实凭据；
#   ② 它对应哪个测试场景。
# 绝不能为了让流水线变绿而随手加一条。
# ---------------------------------------------------------------------------

title = "V2EX Clone gitleaks 配置"

# 复用 gitleaks 官方默认规则集（不做任何规则删减或降级）。
# 本文件只**追加** allowlist，不修改任何检测规则。
[extend]
useDefault = true

[[allowlists]]
description = """
E2E 测试固件口令（非真实凭据）。

`generic-api-key` 规则命中「赋值目标名含 Password + 值熵 > 3.5」，
与该值是否为真实密钥无关。这 3 个字符串是**密码重置流程测试的输入**：
  - BrandNewPass98765 —— 「用令牌改密」后的新口令（验证旧口令失效）
  - StabOld12345      —— SMTP 稳定性套件的初始注册口令
  - StabNew98765      —— SMTP 稳定性套件改密后的新口令

它们只在 CI 的隔离测试环境里使用，不指向任何真实系统。
按**精确值**放行（而非按路径），保证 e2e 目录里的其它高熵字符串仍会被检出。

⚠️ 正则只匹配**值本身**（不含引号）——
   gitleaks 的 allowlist regexes 作用于 `Secret` 字段（被脱敏的原始值），
   若写成 `['"]xxx['"]` 会因值里没有引号而**不匹配**，导致放行失效
   （实测踩到：run 42373509878 仍报 3 处泄漏）。
"""
regexes = [
  '''BrandNewPass98765''',
  '''StabOld12345''',
  '''StabNew98765''',
]

# 第二道保险：stopwords 作用于**密钥值本身**。
#
# gitleaks 的 `stopwords` 是「值里含这些词就判定为非密钥」。
# 这里用**完整值**作为 stopword（而非通用词）——
# 效果与上面的 regexes 相同，但走的是另一条判定路径，
# 避免「某个 gitleaks 版本对 allowlist regexes 的匹配字段有差异」导致失效。
#
# ⚠️ 同样按**精确值**，不用通用词（如 "test"）——
#    通用词会把所有含该词的真实密钥都放过。
stopwords = [
  "BrandNewPass98765",
  "StabOld12345",
  "StabNew98765",
]
