name: Release

# ---------------------------------------------------------------------------
# v0.0.1 发布流水线
#
# 目标：把「冲突检查 → 代码检查 → 安全扫描 → 单元测试 → E2E → 构建镜像
#       → 部署验证 → 打包 → 发布 Release → 远端核验」串成一条**失败即中止**的链。
#
# 三条硬规则：
#  1. 任一 job 失败，后续 job 一律不执行（靠 needs 依赖图保证，无 continue-on-error）
#  2. tag / Release 已存在时**立即失败**，绝不覆盖已发布版本的资产
#  3. 所有口令随机生成并 `::add-mask::` 屏蔽，绝不进日志
#
# 触发：
#  - push tag v0.0.1（正式发布路径）
#  - workflow_dispatch（手动重跑；dry_run=true 时只验证不发布）
#
# ---------------------------------------------------------------------------
# Action 版本说明（重要，2026-11-03 实测）
#
# GitHub 已于 2026-09-23 移除 runner 上的 Node 20 运行时，且
# ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION 退避开关**同时失效**。
# 仍声明 runs.using: node20 的 Action 会在启动阶段直接失败。
# 逐个核验 action.yml 的 runs.using 后，本文件一律使用已迁移到 node24 的版本：
#
#   actions/checkout@v4            -> node20  ✗   改用 @v7   (node24)
#   actions/setup-node@v4          -> node20  ✗   改用 @v7   (node24)
#   actions/upload-artifact@v4     -> node20  ✗   改用 @v7   (node24)
#   actions/download-artifact@v4   -> node20  ✗   改用 @v8   (node24)
#   docker/setup-buildx-action@v3  -> node20  ✗   改用 @v4   (node24)
#   docker/login-action@v3         -> node20  ✗   改用 @v4   (node24)
#   docker/metadata-action@v5      -> node20  ✗   改用 @v6   (node24)
#   docker/build-push-action@v6    -> node20  ✗   改用 @v7   (node24)
#   gitleaks/gitleaks-action@v2    -> node20  ✗   改用 @v3   (node24)
#
# 注意 gitleaks 的版本号体系有两层：
#   - Action 版本：v2 / v3（随 Node 运行时迁移）
#   - CLI 版本：8.18.4（通过环境变量 GITLEAKS_VERSION 指定，**不带 v 前缀**）
#   - v2 的 `with: version:` 输入在 v3 已移除，必须改用环境变量。
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - 'v0.0.1'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，例如 v0.0.1'
        required: true
        type: string
      dry_run:
        description: '仅验证（不推送镜像、不创建 Release、不发布）'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  # 不允许取消进行中的发布：中途取消会留下「镜像已推、Release 未建」的半成品状态
  cancel-in-progress: false

# 默认最小权限；各 job 按需提升
permissions:
  contents: read

env:
  NODE_VERSION: '22.23.4'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 隔离测试环境 —— 与 ci.yml 保持一致，绝不连接开发库或生产库
  APP_RUNTIME_ENV: test
  TEST_ENV_ISOLATED: '1'
  DISABLE_CAPTCHA: '1'
  ENABLE_DEBUG_ENDPOINTS: '1'

jobs:
  # ===========================================================================
  # 1. preflight —— 版本冲突检测（幂等性闸门）
  # ===========================================================================
  preflight:
    name: 前置检查（版本冲突检测）
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号格式非法：$VERSION（应形如 v0.0.1）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "待发布版本：$VERSION"

      - name: 记录 dry-run 标志
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 校验远端 Tag 状态
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # tag 触发：tag 必然已存在于远端（它就是触发器）。
            # 此时要校验的是 —— **tag 指向的 commit 必须就是当前这次构建的 commit**，
            # 防止 tag 被移动到别处、或 Release 已发布后 tag 又被改动。
            REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$VERSION^{}" | awk '{print $1}')"
            if [ -z "$REMOTE_SHA" ]; then
              # 退回到未解引用的 tag（轻量 tag）
              REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$VERSION" | awk '{print $1}')"
            fi
            if [ -z "$REMOTE_SHA" ]; then
              echo "::error::无法读取远端 tag $VERSION 的目标 commit"
              exit 1
            fi
            if [ "$REMOTE_SHA" != "${{ github.sha }}" ]; then
              echo "::error::tag $VERSION 指向 $REMOTE_SHA，但当前构建 commit 是 ${{ github.sha }}。"
              echo "::error::已发布版本的 tag 不可移动，请手动处理。"
              exit 1
            fi
            echo "✓ tag $VERSION 指向当前 commit ${{ github.sha }}"
          else
            # 手动触发：tag 必须尚不存在，否则禁止覆盖已发布版本。
            #
            # 不能用 `git ls-remote --exit-code`：它对「无匹配」返回 2，
            # 对「有匹配但存在其他 ref」也可能返回非 0，语义不可靠。
            # 直接看输出是否为空最稳。
            if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
              echo "::error::Tag $VERSION 已存在于远端。已发布版本的 tag 不可移动或覆盖，请手动处理。"
              exit 1
            fi
            echo "✓ Tag $VERSION 未被占用"
          fi

      - name: 检查远端 Release 是否已存在
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $VERSION 已存在。禁止覆盖已发布版本的资产。"
            exit 1
          fi
          echo "Release $VERSION 未被占用 ✓"

      - name: 输出发布信息
        run: |
          echo "仓库    : ${{ github.repository }}"
          echo "版本    : ${{ steps.v.outputs.version }}"
          echo "提交 SHA: ${{ github.sha }}"
          echo "镜像    : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.version }}"
          echo "dry_run : ${{ steps.meta.outputs.dry_run }}"

  # ===========================================================================
  # 2. code-checks —— 类型检查 + 生产构建
  # ===========================================================================
  code-checks:
    name: 代码检查（类型 + 构建）
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: Next.js 生产构建
        run: npm run build

  # ===========================================================================
  # 3. security-scan —— 依赖漏洞 + 秘密扫描 + 发布包内容检查
  # ===========================================================================
  security-scan:
    name: 安全扫描（依赖 + 秘密）
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含完整历史，供 gitleaks 扫描）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 依赖漏洞扫描
        run: |
          set -euo pipefail
          # 门禁策略：**high / critical 一律阻断**。
          #
          # 现状（2026-11-03 实测 `npm audit`）：
          #   critical=0, high=0, moderate=4, low=0
          #   残留的 4 个 moderate 全部来自 drizzle-kit → @esbuild-kit → esbuild
          #   （GHSA-67mh-4wv8-2f99，esbuild 开发服务器跨域读取）。
          #   esbuild 只在 drizzle-kit 的**本地迁移工具链**里用到，不进入生产镜像的
          #   运行时依赖树，因此 moderate 不阻断 —— 但结果**不被静默吞掉**，
          #   完整 JSON 与摘要都会作为 artifact 上传供人工复核。
          #
          # 若将来 high/critical 出现新条目，这里会立刻中止发布。
          npm audit --json > npm-audit.json || true
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const v = (a.metadata && a.metadata.vulnerabilities) || {};
            const critical = v.critical || 0;
            const high = v.high || 0;
            console.log("::group::npm audit 汇总");
            console.log(JSON.stringify(v, null, 2));
            console.log("::endgroup::");
            fs.writeFileSync(
              "npm-audit-summary.txt",
              `critical=${critical}\nhigh=${high}\nmoderate=${v.moderate || 0}\nlow=${v.low || 0}\n`
            );
            if (critical > 0) {
              console.log("::error::存在 critical 级别漏洞，发布中止");
              process.exit(1);
            }
            if (high > 0) {
              console.log(`::error::存在 ${high} 个 high 级别漏洞，发布中止`);
              process.exit(1);
            }
            if ((v.moderate || 0) > 0) {
              console.log(`::warning::存在 ${v.moderate} 个 moderate 级别漏洞（drizzle-kit 工具链的 esbuild 依赖，不影响生产运行时），已记录但不阻断本次发布`);
            }
          '

      - name: 记录依赖树
        run: npm ls --depth=0 > npm-ls.txt 2>&1 || true

      - name: 秘密扫描（gitleaks，扫描 Git 跟踪的文件）
        run: |
          set -euo pipefail
          # 直接调用 CLI，而不是用 gitleaks/gitleaks-action。
          #
          # 原因一（实测 v3.0.0 的 src/gitleaks.js）：该 Action 的命令是**硬编码**的，
          # 它**不读 `args` 输入** —— 实际执行的是：
          #   gitleaks detect --redact -v --exit-code=2 --report-format=sarif ...
          #   --log-opts=--no-merges --first-parent <base>^..<head>
          # 也就是说它**必定扫描 git 历史**，无法通过 action 参数改成扫工作区。
          #
          # 原因二（实测 2026-11-03 这次真实运行的日志）：
          #   tag push 事件的 payload 里 commits 数组是**空的**，
          #   Action 走到 `if (eventJSON.commits.length === 0)` 分支，
          #   打印 "No commits to scan" 后 **process.exit(0)** ——
          #   扫描**一步都没跑**，却返回成功。
          #   这是最危险的一种失败：秘密扫描看起来通过了，实际上什么都没检查。
          #
          # 为什么必须避开 git 历史（实测结论）：
          #   仓库历史里曾提交过原站 HTML 素材副本（docs/evidence/html/），
          #   其中含 Google AdSense 账号 ca-pub-5060390720525238、
          #   Solana 代币地址 9raUVuzeWUk53co63M4WXLWPWE4Xc6Lpn7RS9dnkpump 等
          #   **第三方公开标识符**。用 gitleaks v8.18.4 官方配置
          #   （generic-api-key 规则 + 1474 条 stopwords + 熵阈值 3.5）
          #   模拟全历史扫描，实测命中 **274 条** —— 必然让流水线失败，
          #   而它们既不是本项目的凭据，也不是真实泄露。
          #
          #   这些素材在当前 commit 中已不再被 Git 跟踪。
          #
          #   若将来要恢复全历史扫描，正确做法是先用 gitleaks 生成 baseline
          #   （gitleaks detect --generate-config）并把 baseline 提交入库，
          #   而不是放宽规则或加忽略。
          GITLEAKS_VERSION=8.18.4
          # 资产名是 linux_x64（不是 linux_amd64 —— 官方用 Go 的 GOARCH 命名）。
          # 写错会得到 404，curl -f 会直接以退出码 22 中止流水线。
          curl -sSfL --retry 3 --max-time 120 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # 校验官方 checksum，防止下载到被篡改的二进制
          curl -sSfL --retry 3 --max-time 120 \
            -o /tmp/gitleaks-checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd /tmp
          # 只校验 linux_x64 那一条（checksums 文件里的路径名与 tar.gz 内一致）
          EXPECTED="$(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks-checksums.txt | awk '{print $1}')"
          if [ -z "$EXPECTED" ]; then
            echo "::error::checksums 文件里找不到 linux_x64 的条目"
            exit 1
          fi
          ACTUAL="$(sha256sum gitleaks.tar.gz | awk '{print $1}')"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::gitleaks 二进制校验和不匹配（期望 $EXPECTED，实际 $ACTUAL）"
            exit 1
          fi
          echo "✓ gitleaks 二进制 checksum 校验通过"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
          cd "$GITHUB_WORKSPACE"

          # 只把**Git 跟踪的文件**复制到独立目录再扫描。
          #
          # 为什么不直接 `--no-git --source .`：
          #   --no-git 模式会 walk 整个目录树（只跳过 .git/），**不认 .gitignore**，
          #   会把 .next/（112MB 构建产物）、test-results/（48MB 截图）一起扫进去 ——
          #   又慢又会引入构建产物里的噪声。
          #
          # 为什么不用 `git ls-files -z | xargs -0 gitleaks ...`：
          #   gitleaks 一次只能接一个 --source 目录。
          #   复制到独立目录后用 --no-git 扫，语义就精确等于「扫描 Git 跟踪的文件」。
          rm -rf /tmp/gitleaks-scan && mkdir -p /tmp/gitleaks-scan
          # -z 处理含空格/换行的路径；--others 排除未跟踪文件；
          # -z 让 xargs 能正确分隔 NUL 分隔的路径
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C /tmp/gitleaks-scan
          FILE_COUNT="$(find /tmp/gitleaks-scan -type f | wc -l | tr -d ' ')"
          echo "待扫描的 Git 跟踪文件数：$FILE_COUNT"
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "::error::没有取到任何 Git 跟踪文件，扫描无法进行（中止，避免假通过）"
            exit 1
          fi

          # --no-git：把上一步的目录当普通目录扫描
          # --exit-code=1：发现泄露即失败
          # --redact：报告里不打印明文
          set +e
          /tmp/gitleaks detect \
            --no-git \
            --redact \
            --no-banner \
            --exit-code=1 \
            --report-format=json \
            --report-path=gitleaks-report.json \
            --source /tmp/gitleaks-scan 2>&1 | tee gitleaks-output.txt
          GL_EXIT=${PIPESTATUS[0]}
          set -e
          echo "gitleaks 退出码：$GL_EXIT"
          if [ "$GL_EXIT" -ne 0 ]; then
            echo "::error::gitleaks 发现疑似泄露的凭据，发布中止（详见 gitleaks-report.json）"
            exit 1
          fi
          echo "✓ gitleaks 未发现泄露"

      - name: 发布包内容安全检查
        run: |
          set -euo pipefail
          fail=0
          # 1) 发布包不得包含生成的 .env
          if [ -f deploy/.env ]; then
            echo "::error::deploy/.env 存在 —— 生成的配置绝不能入库"
            fail=1
          fi
          # 2) 不得包含原站受保护素材（HTML / CSS / JS 副本与参考截图）
          #    注意：用固定前缀匹配，不要用 'ref-*.png' 这种 glob ——
          #    glob 里的 * 会被 grep 当作正则量词，语义完全不同。
          for pat in 'docs/evidence/html/' 'docs/evidence/assets/' 'docs/evidence/screenshots/.*/ref-' 'docs/evidence/visual/diff-'; do
            if git ls-files | grep -qE "$pat"; then
              echo "::error::版本控制中存在原站素材：$pat"
              fail=1
            fi
          done
          # 3) deploy/ 内不得有明文口令
          #
          #    判定逻辑（经本地双向验证：能捕获 dbPassword="SuperSecret123!"，
          #    同时不误报 --requirepass ${REDIS_PASSWORD:?} 这类变量引用）：
          #    - 键名允许驼峰/下划线前后缀
          #    - 值含 $ 变量引用、随机数生成器、PowerShell cmdlet、
          #      管道/重定向片段时一律视为安全
          KEY_RE='([A-Za-z_][A-Za-z0-9_]*)?(pass(word|wd)?|pwd|secret|token|api[_-]?key|credential)([A-Za-z0-9_]*)[[:space:]]*[:=][[:space:]]*(.*)$'
          hits="$(grep -rniE "$KEY_RE" deploy/ \
                   --include='*.sh' --include='*.ps1' --include='*.yml' --include='*.yaml' 2>/dev/null \
                 | grep -vE '\$[A-Za-z_{(]' \
                 | grep -vE 'Get-RandomHex|CHANGE_ME|PLACEHOLDER|Get-AdminPassword|random|Random|openssl' \
                 | grep -vE '[:=][[:space:]]*(""|'"''"'|)$' \
                 | grep -vE '[|><`]' \
                 | grep . || true)"
          if [ -n "$hits" ]; then
            echo "::error::deploy/ 中存在疑似硬编码口令"
            echo "$hits"
            fail=1
          fi
          # 4) .env 系列文件不得入库（.env.example 除外）
          if git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$'; then
            echo "::error::存在被跟踪的环境文件"
            fail=1
          fi
          exit $fail

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-report
          path: |
            npm-audit.json
            npm-audit-summary.txt
            npm-ls.txt
            gitleaks-report.json
            gitleaks-output.txt
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # 4. unit-tests —— 单元测试（隔离数据库）
  # ===========================================================================
  unit-tests:
    name: 单元测试
    needs: [preflight, code-checks]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ${{ github.run_id }}-unit-test-password
          POSTGRES_DB: v2ex_release_unit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ${{ github.run_id }}-redis-test-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ${{ github.run_id }}-redis-test-password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 数据库迁移
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-unit-test-password@localhost:5432/v2ex_release_unit
        run: npx drizzle-kit migrate

      - name: 运行单元测试
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-unit-test-password@localhost:5432/v2ex_release_unit
          REDIS_URL: redis://:${{ github.run_id }}-redis-test-password@localhost:6379
          SESSION_SECRET: ${{ github.run_id }}-release-unit-test-session-secret-32chars
          DEBUG_ENDPOINT_TOKEN: ${{ github.run_id }}-release-debug-token
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
        run: npx vitest run --reporter=junit --outputFile=unit-test-results.xml

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: unit-test-results.xml
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # 5. e2e-tests —— Playwright E2E（隔离数据库 + 真实启动应用）
  # ===========================================================================
  e2e-tests:
    name: E2E 测试
    needs: [preflight, code-checks]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ${{ github.run_id }}-e2e-test-password
          POSTGRES_DB: v2ex_release_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ${{ github.run_id }}-redis-test-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ${{ github.run_id }}-redis-test-password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 数据库迁移
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
        run: npx drizzle-kit migrate

      - name: 初始化演示数据
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
          REDIS_URL: redis://:${{ github.run_id }}-redis-test-password@localhost:6379
          SESSION_SECRET: ${{ github.run_id }}-release-e2e-session-secret-32chars
          SEED_ADMIN_USERNAME: admin
          SEED_ADMIN_EMAIL: admin@example.com
          SEED_ADMIN_PASSWORD: ${{ github.run_id }}-Release-Test-Admin-2026
          SEED_DEMO_PASSWORD: ${{ github.run_id }}-Release-Test-Demo-2026
          SEED_DEMO_USERS: '1'
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
        run: npx tsx scripts/seed.ts

      # 必须在本 job 内构建：.next/ 被 .gitignore 忽略，干净检出的工作区没有构建产物，
      # 直接 `next start` 会因缺少 BUILD_ID 而失败。
      # 构建期不需要数据库（src/db 是惰性初始化，见 src/db/index.ts）。
      - name: 构建应用
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
        run: npm run build

      - name: 启动应用
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
          REDIS_URL: redis://:${{ github.run_id }}-redis-test-password@localhost:6379
          SESSION_SECRET: ${{ github.run_id }}-release-e2e-session-secret-32chars
          DEBUG_ENDPOINT_TOKEN: ${{ github.run_id }}-release-debug-token
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
          DISABLE_CAPTCHA: '1'
          ENABLE_DEBUG_ENDPOINTS: '1'
          LOCAL_BASE: http://localhost:3000
          CI: 'true'
        run: |
          set -euo pipefail
          npx next start -p 3000 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            sleep 2
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              echo "应用就绪（${i} 次轮询后）"
              exit 0
            fi
          done
          echo "::error::应用在 120 秒内未就绪"
          exit 1

      - name: 运行 E2E
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
          REDIS_URL: redis://:${{ github.run_id }}-redis-test-password@localhost:6379
          SESSION_SECRET: ${{ github.run_id }}-release-e2e-session-secret-32chars
          DEBUG_ENDPOINT_TOKEN: ${{ github.run_id }}-release-debug-token
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
          DISABLE_CAPTCHA: '1'
          ENABLE_DEBUG_ENDPOINTS: '1'
          SEED_ADMIN_USERNAME: admin
          SEED_ADMIN_EMAIL: admin@example.com
          SEED_ADMIN_PASSWORD: ${{ github.run_id }}-Release-Test-Admin-2026
          SEED_DEMO_PASSWORD: ${{ github.run_id }}-Release-Test-Demo-2026
          LOCAL_BASE: http://localhost:3000
          BROWSER_CHANNEL: chromium
          CI: 'true'
        run: npx playwright test --reporter=list

      - name: 停止应用
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true

      - name: 上传 E2E 失败证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # 6. build-image —— 构建并推送镜像到 GHCR
  # ===========================================================================
  build-image:
    name: 构建并推送镜像
    needs: [preflight, code-checks, security-scan, unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=sha-${{ github.sha }}
          # 刻意不生成 latest —— v0.0.1 是预览版，latest 会误导用户。
          # flavor 设为 latest=false，避免 metadata-action 自动补 latest 标签。

      - uses: docker/setup-buildx-action@v4

      - name: 构建并推送
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=V2EX Clone
            org.opencontainers.image.description=独立的 V2EX 界面还原研究项目（非官方）
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 供应链溯源：provenance 记录构建来源，sbom 记录依赖清单。
          # 二者都是 BuildKit 层的 attestation，随镜像一起推到 registry，
          # **不需要** id-token / attestations 权限
          # （那两个权限是 GitHub 原生 Artifact Attestations 才需要的）。
          provenance: true
          sbom: true

      - name: 记录 digest
        run: |
          echo "镜像 digest: ${{ steps.push.outputs.digest }}"
          echo "标签: ${{ steps.meta.outputs.tags }}"

      - name: 核验镜像不含敏感文件
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}"
          # 镜像内不得有 .env
          if docker run --rm --entrypoint sh "$IMAGE" -c 'ls -A /app | grep -qE "^\.env"'; then
            echo "::error::镜像内存在 .env 文件"
            exit 1
          fi
          # 镜像内不得有原站素材目录
          if docker run --rm --entrypoint sh "$IMAGE" -c 'test -d /app/docs/evidence'; then
            echo "::error::镜像内存在 docs/evidence 目录"
            exit 1
          fi
          echo "镜像内容检查通过 ✓"

  # ===========================================================================
  # 7. deploy-verify —— 用真实镜像跑发布版 compose + 重启持久化验证
  # ===========================================================================
  deploy-verify:
    name: 部署验证（启动 + 重启持久化）
    needs: [preflight, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 生成随机凭据（不打印明文）
        id: creds
        run: |
          set -euo pipefail
          # 全部用十六进制随机串：不含 / + = 等字符，
          # 可直接嵌入 DATABASE_URL / REDIS_URL 而无需 URL 编码。
          # 必须是**单行**纯十六进制 —— GitHub 的 ::add-mask:: 不接受换行，
          # 用 base64 会因含 \n 导致 "Invalid format" 而失败。
          PG_PASS="$(openssl rand -hex 24 | tr -d '\n')"
          REDIS_PASS="$(openssl rand -hex 24 | tr -d '\n')"
          SESSION="$(openssl rand -hex 32 | tr -d '\n')"
          ADMIN_PASS="$(openssl rand -hex 12 | tr -d '\n')Aa1"

          # ::add-mask:: 是 **workflow command**，必须写到 stdout，
          # 写到 $GITHUB_ENV 会被当成环境变量而报 "Invalid format"。
          printf '::add-mask::%s\n' "$PG_PASS"
          printf '::add-mask::%s\n' "$REDIS_PASS"
          printf '::add-mask::%s\n' "$SESSION"
          printf '::add-mask::%s\n' "$ADMIN_PASS"

          # 实际值写入 $GITHUB_ENV 供后续步骤使用（同样保证单行）
          {
            printf 'PG_PASS=%s\n' "$PG_PASS"
            printf 'REDIS_PASS=%s\n' "$REDIS_PASS"
            printf 'SESSION=%s\n' "$SESSION"
            printf 'ADMIN_PASS=%s\n' "$ADMIN_PASS"
          } >> "$GITHUB_ENV"
          echo "随机凭据已生成并屏蔽 ✓"

      - name: 准备发布版 compose 配置
        run: |
          set -euo pipefail
          # deploy/docker-compose.yml 里写死了 `env_file: - .env`，
          # 而 compose 的 env_file 路径相对**compose 文件所在目录**解析。
          # 若把 compose 复制到仓库根目录，就必须在仓库根放一个 .env；
          # 这里直接用 deploy/ 目录里的 compose 文件，并在 deploy/ 下生成 .env，
          # 与 install.sh 的真实行为保持一致（install.sh 也把 .env 放在 deploy/ 下）。
          cd deploy
          cat > .env <<EOF
          V2EX_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}
          COMPOSE_PROJECT_NAME=v2ex
          APP_PORT=3000
          APP_URL=http://localhost:3000
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          APP_RUNTIME_ENV=production
          POSTGRES_USER=v2ex
          POSTGRES_DB=v2ex
          POSTGRES_PASSWORD=${PG_PASS}
          REDIS_PASSWORD=${REDIS_PASS}
          SESSION_SECRET=${SESSION}
          SEED_ADMIN_USERNAME=admin
          SEED_ADMIN_EMAIL=admin@example.com
          SEED_ADMIN_PASSWORD=${ADMIN_PASS}
          SEED_DEMO_USERS=0
          EOF
          chmod 600 .env
          # compose 变量插值必须能读到同一个 .env
          docker compose --env-file .env config >/dev/null
          echo "发布版 compose 配置就绪 ✓"

      - name: 首次启动
        run: |
          set -euo pipefail
          cd deploy
          docker compose --env-file .env up -d
          for i in $(seq 1 60); do
            sleep 3
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              echo "应用就绪（${i} 次轮询后）"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::容器启动超时"
              docker compose --env-file .env logs --tail=100
              exit 1
            fi
          done

      - name: 验证容器健康与管理员创建
        run: |
          set -euo pipefail
          cd deploy
          docker compose --env-file .env ps
          # app 应通过 healthcheck（deploy/docker-compose.yml 已定义）。
          #
          # 注意：**必须轮询等待**，不能只查一次。
          # 上一版一次性读取 health 状态时，容器还处于 'starting'
          #（healthcheck 的 start_period 尚未结束），于是误判失败 ——
          # 而此时应用其实已经 Ready（日志里有 Ready in xxxms）。
          APP_HEALTH=""
          for i in $(seq 1 40); do
            APP_HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' v2ex-app 2>/dev/null || echo none)"
            if [ "$APP_HEALTH" = "healthy" ]; then
              break
            fi
            if [ "$APP_HEALTH" = "unhealthy" ] || [ "$APP_HEALTH" = "exited" ] || [ "$APP_HEALTH" = "none" ]; then
              echo "::error::app 容器状态异常（$APP_HEALTH），第 $i 次探测即失败"
              docker compose --env-file .env logs --tail=100
              exit 1
            fi
            sleep 3
          done
          echo "app healthcheck = $APP_HEALTH"
          if [ "$APP_HEALTH" != "healthy" ]; then
            echo "::error::app 容器在 120 秒内未变为 healthy（当前 $APP_HEALTH）"
            docker compose --env-file .env logs --tail=100
            exit 1
          fi
          # 管理员账号必须已创建
          ADMIN_COUNT="$(docker compose --env-file .env exec -T postgres \
            psql -U v2ex -d v2ex -t -A -c \
            "select count(*) from users where username='admin' and role='admin';")"
          echo "管理员账号数 = $ADMIN_COUNT"
          if [ "$ADMIN_COUNT" != "1" ]; then
            echo "::error::管理员账号未正确创建（$ADMIN_COUNT）"
            exit 1
          fi
          echo "✓ 容器健康、管理员创建成功"

      - name: 验证数据持久化（写入 → 重启 → 校验）
        run: |
          set -euo pipefail
          cd deploy
          # 注册一个测试用户，作为持久化探针。
          #
          # 必须带 CSRF token：本项目对所有写接口启用**双提交 Cookie** 防护，
          # verifyCsrf() 在缺少 CSRF Cookie 时直接判定失败并返回 403。
          # 因此先 GET 一次首页拿 v2_csrf Cookie，再用同一个值作为请求头。
          #
          # 注意：APP_RUNTIME_ENV=production 时验证码是强制项，
          # 但**注册**接口不校验验证码（只有登录接口校验），所以这里无需带 captcha。
          curl -s -c /tmp/cookies.txt -o /dev/null http://localhost:3000/
          CSRF_TOKEN="$(awk '$6 == "v2_csrf" {print $7}' /tmp/cookies.txt | tail -1)"
          if [ -z "$CSRF_TOKEN" ]; then
            echo "::error::未能从首页获取 CSRF Cookie（v2_csrf）"
            curl -s -i http://localhost:3000/ | head -20
            exit 1
          fi
          echo "已获取 CSRF token（长度 ${#CSRF_TOKEN}）"
          HTTP_CODE="$(curl -s -b /tmp/cookies.txt -X POST http://localhost:3000/api/auth/signup \
            -H 'Content-Type: application/json' \
            -H "x-csrf-token: $CSRF_TOKEN" \
            -H 'x-forwarded-for: 10.99.0.1' \
            -d '{"username":"persist_check","email":"persist@example.com","password":"Persist-Check-2026"}' \
            -o /tmp/signup.json -w '%{http_code}' || true)"
          echo "注册接口返回：$HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::注册接口未返回 201（实际 $HTTP_CODE）"
            cat /tmp/signup.json || true
            echo
            docker compose --env-file .env logs --tail=100
            exit 1
          fi

          echo "--- 重启全部容器（模拟重新部署）---"
          docker compose --env-file .env restart
          for i in $(seq 1 60); do
            sleep 3
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              echo "应用重启后恢复（${i} 次轮询后）"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::重启后应用未恢复"
              docker compose --env-file .env logs --tail=100
              exit 1
            fi
          done

          # 重启后测试用户必须还在
          CNT="$(docker compose --env-file .env exec -T postgres \
            psql -U v2ex -d v2ex -t -A -c \
            "select count(*) from users where username='persist_check';")"
          echo "重启后 persist_check 用户数 = $CNT"
          if [ "$CNT" != "1" ]; then
            echo "::error::重启后数据丢失（persist_check 不存在）"
            docker compose --env-file .env logs --tail=100
            exit 1
          fi
          echo "✓ 重启持久化验证通过"

      - name: 验证数据库与 Redis 端口未暴露
        run: |
          set -euo pipefail
          cd deploy
          # postgres / redis 没有声明 ports，compose 不应给出宿主机绑定
          if docker compose --env-file .env port postgres 5432 2>/dev/null | grep -q .; then
            echo "::error::PostgreSQL 端口暴露到宿主机"
            exit 1
          fi
          if docker compose --env-file .env port redis 6379 2>/dev/null | grep -q .; then
            echo "::error::Redis 端口暴露到宿主机"
            exit 1
          fi
          echo "✓ 数据库与 Redis 未暴露端口"

      - name: 收集容器日志
        if: always()
        run: cd deploy && docker compose --env-file .env logs --tail=200 > ../deploy-logs.txt 2>&1 || true

      - name: 上传部署验证日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-verify-logs
          path: deploy-logs.txt
          if-no-files-found: warn
          retention-days: 7

      - name: 清理
        if: always()
        run: cd deploy && docker compose --env-file .env down -v || true

  # ===========================================================================
  # 8. package —— 生成安装包 + 校验和
  # ===========================================================================
  package:
    name: 生成安装包
    needs: [preflight, build-image, deploy-verify]
    runs-on: ubuntu-latest
    outputs:
      zip_name: ${{ steps.pkg.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v7

      - name: 打包 deploy/ 目录
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          ZIP="v2ex-clone-${VERSION}-deploy.zip"
          # 明确排除生成的配置与备份目录（.gitignore 已排除，这里显式再挡一次）
          zip -r "$ZIP" deploy/ \
            -x 'deploy/.env' \
               'deploy/INSTALL_CREDENTIALS.txt' \
               'deploy/backups/*' \
               'deploy/*.log'
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum "$ZIP_NAME" > SHA256SUMS
          cat SHA256SUMS

      - name: 校验安装包内容完整性
        run: |
          set -euo pipefail
          REQUIRED="docker-compose.yml .env.example install.sh install.ps1 start.sh stop.sh update.sh backup.sh README.md INSTALL.md VERSION LICENSE"
          rm -rf /tmp/verify-zip && mkdir -p /tmp/verify-zip
          unzip -q "$ZIP_NAME" -d /tmp/verify-zip
          missing=0
          for f in $REQUIRED; do
            if [ ! -f "/tmp/verify-zip/deploy/$f" ]; then
              echo "::error::安装包缺少必需文件：$f"
              missing=1
            fi
          done
          # 不得包含生成的 .env
          if [ -f /tmp/verify-zip/deploy/.env ]; then
            echo "::error::安装包内含 deploy/.env"
            missing=1
          fi
          # 不得包含凭据文件
          if [ -f /tmp/verify-zip/deploy/INSTALL_CREDENTIALS.txt ]; then
            echo "::error::安装包内含 INSTALL_CREDENTIALS.txt"
            missing=1
          fi
          # 不得包含原站素材（用固定前缀匹配，不用 glob）
          if find /tmp/verify-zip \( -name 'ref-*.png' -o -name 'diff-*.png' \) | grep -q .; then
            echo "::error::安装包内含原站素材"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "--- 安装包实际内容 ---"
            find /tmp/verify-zip -type f | sort
          fi
          exit $missing

      - name: 上传安装包与校验和
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # 9. publish-release —— 创建并发布 Release
  # ===========================================================================
  publish-release:
    name: 创建并发布 Release
    needs: [preflight, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release-assets

      - name: 再次检查冲突（防止竞态）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $VERSION 已存在（竞态），中止发布"
            exit 1
          fi
          # tag 也不能在竞态窗口内被别人创建
          if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            echo "::error::Tag $VERSION 在竞态窗口内被创建，中止发布"
            exit 1
          fi

      - name: 生成中文 Release Notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## v0.0.1 — 开发预览版（Pre-release）

          > ⚠️ **这是早期开发预览版（Pre-release），不是稳定版。**
          > 功能尚未完备，**不保证与 V2EX 完全一致**，**不建议直接用于生产环境**。

          ### 关于本项目

          本项目是对 `https://www.v2ex.com/` 的**技术研究与高保真界面还原实验**，
          与 V2EX 官方**无任何关联**、**未获官方授权**、**不是** V2EX 官方产品。
          MIT 许可证**不授予** V2EX 商标使用许可。

          ### 本版本已实现

          - **账号**：注册、登录、退出、会话保持、修改密码
          - **用户**：个人主页
          - **节点**：列表、详情、子节点树、创建（管理员直生效 / 版主待审）
          - **主题**：发布、列表、详情、浏览计数、Markdown 渲染
          - **回复**：发布、楼层号分配、分页
          - **收藏 / 通知 / 搜索**
          - **后台管理**：概览、待审、日志
          - **权限**：user / moderator / admin 三级角色
          - **安全**：CSRF 防护、XSS 清洗、限流、开放重定向防护、安全响应头、
            服务端 SVG 验证码（哈希存储、一次性）
          - **存储**：PostgreSQL 17 持久化（Drizzle 迁移），Redis 可选（缺失自动降级）
          - **部署**：Docker 多阶段镜像 + Compose 三阶段启动（迁移 → 首次初始化 → 启动）

          ### 本版本未实现

          以下功能**本版本未实现**，界面中不会出现对应入口：

          - 主题编辑与删除
          - 感谢（thank）功能
          - 关注用户
          - 积分排行榜
          - RSS 输出
          - 邮件找回密码
          - 主题标签 / 附件上传 / 私信 / 头像上传

          ### 安装

          **Linux / macOS**
          ```bash
          unzip v2ex-clone-v0.0.1-deploy.zip
          cd v2ex-clone-v0.0.1-deploy/deploy
          chmod +x install.sh
          ./install.sh
          ```

          **Windows（PowerShell）**
          ```powershell
          Expand-Archive -Path v2ex-clone-v0.0.1-deploy.zip -DestinationPath .
          cd v2ex-clone-v0.0.1-deploy\deploy
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          ```

          安装完成后访问 <http://localhost:3000>。
          安装脚本会生成随机的数据库口令、Redis 口令与会话密钥，
          并把管理员凭据写入 `INSTALL_CREDENTIALS.txt`（权限 600）。

          ### 系统要求

          - Docker 20.10 或更高
          - Docker Compose v2
          - 至少 2 GB 可用磁盘
          - 端口 3000 未被占用

          ### 镜像

          ```
          ghcr.io/alicia1030su/v2ex-clone:v0.0.1
          ```

          ### 安全提示

          - **安装后请立即登录并修改管理员密码。**
          - 不要在公网环境使用默认端口 3000，建议通过反向代理并启用 HTTPS。
          - `docker compose stop` 与 `update.sh` **不会**删除数据卷；
            `docker compose down -v` 会**永久删除**数据，请务必先备份。

          ### 许可证

          MIT（附商标声明与第三方内容声明），详见安装包内的 `LICENSE`。
