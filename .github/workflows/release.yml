          NOTES
          sed -i "s|__VERSION__|${VERSION}|g" release-notes.md
          sed -i "s|__DIGEST__|${IMAGE_DIGEST}|g" release-notes.md
          echo "Release Notes 已按版本 ${VERSION} 生成（镜像 digest=${IMAGE_DIGEST}）"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

          # ── 安装路径与安装包实际结构的一致性闸门（D-01） ──
          #
          # 真实缺陷：ZIP 的顶层目录是 `deploy/`（`zip -r "$ZIP" deploy/`），
          # 但旧 Notes 写的是
          #     unzip v2ex-clone-vX.Y.Z-deploy.zip
          #     cd v2ex-clone-vX.Y.Z-deploy/deploy
          # —— 少一个 `-d`，解压后根本没有 `v2ex-clone-vX.Y.Z-deploy`
          # 这一层，用户照抄命令会在第 2 行 `cd` 失败。
          #
          # 该缺陷自 v0.0.4 起就存在（v0.0.4 的 Release Notes 同样是
          # 这条错误路径），属于**文档与产物脱节**，直接影响
          # 「下载官方包 → 按文档部署可跑通」这一验收标准。
          #
          # 修法是给解压命令补 `-d <目录>`（与仓库内
          # `docs/INSTALL.md` / `docs/DEPLOYMENT.md` 的既有写法一致），
          # 然后在这里**逐条断言**，避免再次脱节。
          EXPECT_DIR="v2ex-clone-${VERSION}-deploy"
          NOTES_FAIL=0
          if ! grep -qF "unzip v2ex-clone-${VERSION}-deploy.zip -d ${EXPECT_DIR}" release-notes.md; then
            echo "::error::Notes 的 unzip 命令缺少 '-d ${EXPECT_DIR}'（解压后不存在该目录）"
            NOTES_FAIL=1
          fi
          if ! grep -qF "cd ${EXPECT_DIR}/deploy" release-notes.md; then
            echo "::error::Notes 的 Linux 安装路径不是 ${EXPECT_DIR}/deploy"
            NOTES_FAIL=1
          fi
          if ! grep -qF "Expand-Archive -Path v2ex-clone-${VERSION}-deploy.zip -DestinationPath ${EXPECT_DIR}" release-notes.md; then
            echo "::error::Notes 的 Expand-Archive 目标目录不是 ${EXPECT_DIR}"
            NOTES_FAIL=1
          fi
          if ! grep -qF "cd ${EXPECT_DIR}\\deploy" release-notes.md; then
            echo "::error::Notes 的 Windows 安装路径不是 ${EXPECT_DIR}\\deploy"
            NOTES_FAIL=1
          fi
          # 反向断言：绝不能出现「解压到当前目录 + cd 到带版本号的子目录」
          # 这种自相矛盾的组合（即本次修复掉的那条错误路径）。
          if grep -qE '^unzip v2ex-clone-[^ ]+-deploy\.zip$' release-notes.md; then
            echo "::error::Notes 仍有「unzip 无 -d」与「cd 到版本目录」混用的错误写法"
            NOTES_FAIL=1
          fi
          if [ "$NOTES_FAIL" -ne 0 ]; then
            echo "--- 实际安装段 ---"
            sed -n '/^### 安装/,/^### 系统要求/p' release-notes.md
            exit 1
          fi
          echo "✓ Release Notes 的安装路径与安装包实际结构（顶层 deploy/）一致"

      - name: 创建 Release（先 draft）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          REPO="${{ github.repository }}"
          TAG_SHA="${{ needs.preflight.outputs.tag_sha }}"
          # 安装包文件名直接取自 package job 的 output，
          # 不要靠猜 —— package 产出的是 v2ex-clone-${VERSION}-deploy.zip。
          ZIP_NAME="${{ needs.package.outputs.zip_name }}"
          echo "待上传资产：${ZIP_NAME}"
          # 先确认文件确实在（download-artifact 解压后落在 release-assets/ 下）
          test -f "release-assets/${ZIP_NAME}" || {
            echo "::error::未找到安装包 release-assets/${ZIP_NAME}"; exit 1; }
          test -f "release-assets/SHA256SUMS" || {
            echo "::error::未找到 SHA256SUMS"; exit 1; }
          cd release-assets

          # ═══════════════════════════════════════════════════════════
          # ① 创建 Draft Release
          # ═══════════════════════════════════════════════════════════
          # ⚠️ **不要传 `target_commitish`。**
          #
          # 背景（v0.0.4 连续五轮 403 的定位过程）：
          #
          #   | run | 调用方式 | `target_commitish` | 结果 |
          #   |---|---|---|---|
          #   | `41978482846` | `gh release create --target <sha>` | 有 | ❌ 403 |
          #   | `41983127742` | `gh release create --target <sha>` | 有 | ❌ 403 |
          #   | `41985412431` | `gh api POST`（诊断步骤） | **无** | ✅ **成功** |
          #   | `41985412431` | `gh release create --target <sha>` | 有 | ❌ 403 |
          #   | `41988622554` | `gh api POST -f target_commitish=<sha>` | 有 | ❌ 403 |
          #
          #   逐项对比后，**唯一的变量就是 `target_commitish`**：
          #   同一个 token、同一个 job、同一个 tag ——
          #   传它就 403，不传就成功。
          #
          #   （先剌曾误判为「`gh release create` CLI 封装自身的行为」，
          #     但 run `41988622554` 用 `gh api` 显式传 `target_commitish`
          #     同样 403，证伪了那个判断。）
          #
          # 为什么不传也正确：
          #   GitHub REST API 文档对 `target_commitish` 的说明是
          #     「Specifies the commitish value that determines where the
          #       Git tag is created. Can be any branch or commit SHA.
          #       **Unused if the Git tag already exists.**
          #       Default: the repository's default branch.」
          #   ⇒ tag `v0.0.4` **已经存在**，这个参数**本来就不会被使用**；
          #      不传它，Release 的 target 自动取现有 tag 的目标（`c0e7396`），
          #      语义完全正确，还与 v0.0.3 的 Release 形态一致。
          #
          #   （至于传了为何反而 403：GitHub 会对 `target_commitish` 指向的
          #     commit 做一次可见性校验，而 GITHUB_TOKEN 对该 commit 的读取
          #     被拒 —— 诊断步骤采集到的 `.permissions` 全为 false 也印证了
          #     token 的仓库级读取受限。**未传 ⇒ 不做该校验 ⇒ 通过。**）
          #
          # 实测：本写法（不传 `target_commitish`）已在 run `41985412431`
          # 的诊断步骤中成功执行（创建出 id `434887371` 的 Draft）。
          RELEASE_ID="$(gh api --method POST "repos/${REPO}/releases" \
            -f tag_name="$VERSION" \
            -f name="$VERSION — 开发预览版" \
            -F draft=true \
            -F prerelease=true \
            -F body=@../release-notes.md \
            --jq '.id')"
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::创建 Release 失败（未拿到 release id）"
            exit 1
          fi
          echo "Draft Release 已创建（id=$RELEASE_ID）"

          # ═══════════════════════════════════════════════════════════
          # ② 上传资产
          # ═══════════════════════════════════════════════════════════
          # `gh release create <files>` 原本会把资产上传一并做掉；
          # 改成 `gh api` 后需要显式上传。
          #
          # `upload_url` 形如
          #   https://uploads.github.com/repos/o/r/releases/<id>/assets{?name,label}
          # 去掉模板后缀后，用 `?name=<filename>` 追加文件名。
          UPLOAD_URL="$(gh api "repos/${REPO}/releases/${RELEASE_ID}" \
            --jq '.upload_url' | sed 's/{?name,label}$//')"
          if [ -z "$UPLOAD_URL" ]; then
            echo "::error::未拿到 upload_url"
            exit 1
          fi
          # 上传失败时**回滚**：删掉刚创建的 Draft。
          #
          # 否则会留下一个「没有资产」的 Draft Release ⇒ 下次重跑时
          # 「再次检查冲突」步骤会发现 Release 已存在而中止 ⇒ 卡死。
          for f in "$ZIP_NAME" SHA256SUMS; do
            echo "上传 ${f} ..."
            if ! gh api --method POST "${UPLOAD_URL}?name=${f}" \
                 -H "Content-Type: application/octet-stream" \
                 --input "$f" \
                 --jq '.name' > /dev/null; then
              echo "::error::上传 ${f} 失败 —— 回滚（删除 Draft Release $RELEASE_ID）"
              gh api --method DELETE "repos/${REPO}/releases/${RELEASE_ID}" \
                && echo "已回滚" || echo "(回滚失败，需手工删除 Release $RELEASE_ID)"
              exit 1
            fi
            echo "  ✓ ${f} 已上传"
          done
          echo "资产上传完成"

      - name: 核验 draft 资产后正式发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          ASSETS="$(gh release view "$VERSION" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          echo "已上传资产："
          echo "$ASSETS"
          echo "$ASSETS" | grep -q "v2ex-clone-${VERSION}-deploy.zip" || { echo "::error::缺少安装包"; exit 1; }
          echo "$ASSETS" | grep -q "SHA256SUMS" || { echo "::error::缺少 SHA256SUMS"; exit 1; }
          # 资产齐全后按**三态**决定形态。
          #
          # ⚠️ v0.0.9：PUBLISH / PRERELEASE 一律读 preflight 的 output，
          #    不再读 inputs.*：tag push 没有 dispatch inputs，旧写法恒为
          #    false ⇒ 正式发布路径永远停在 Draft，且匿名核验两步被跳过。
          #    现在 tag push 由 meta step 判定 publish=true（Tag 白名单即
          #    人工确认），因此「推 tag」就是可靠的公开发布入口。
          #
          # 保留 v0.0.3 的历史约束：某些版本可能因发布门槛阻断项
          # （如 Git 历史合规风险）需要停在 Draft —— 那只适用于
          # workflow_dispatch 且显式 publish=false 的情形。
          PUBLISH="${{ needs.preflight.outputs.publish }}"
          PRERELEASE="${{ needs.preflight.outputs.prerelease }}"
          if [ "$PUBLISH" = "true" ]; then
            # ⚠️ v0.0.9：**0.0.x 一律不得作为稳定版发布**。
            #   本项目 README 明示「0.0.x 全部为早期开发预览版」，
            #   发稳定版会让用户误以为可长期依赖。
            #   ⇒ 强制 Pre-release；只有显式 prerelease=false 才允许稳定版，
            #     且需要二次确认开关（见下方 guard）。
            if [ "$PRERELEASE" != "true" ]; then
              echo "::error::本项目 0.0.x 全部为早期开发预览版，不得发布为稳定版。"
              echo "        请保持 prerelease=true（发布形态为公开 Pre-release）。"
              exit 1
            fi
            gh release edit "$VERSION" \
              --repo "${{ github.repository }}" \
              --draft=false \
              --prerelease=true \
              --latest=false
            echo "Release 已公开发布（Pre-release，publish=true + prerelease=true）"
          else
            echo "Release 保持 Draft 状态（publish=false）。"
            echo "资产已核验齐全。公开发布前请确认发布门槛已全部通过。"
            # ⚠️ 不要建议「再 dispatch publish=true 重跑」：preflight 的
            #    「Release 已存在（含 Draft）⇒ 中止」会把它挡死（实测
            #    `gh release view` 对 Draft 也会返回），这条路走不通。
            echo "如需公开，请在 GitHub 网页上手动发布该 Draft（或重新推 Tag 走正式发布路径）。"
          fi

  # ===========================================================================
  # 10. verify-release —— 远端只读核验（匿名视角）
  # ===========================================================================
  verify-release:
    name: 远端核验（Release 与资产）
    # ⚠️ v0.0.9（N3）：加 build-image 才能拿到构建时记录的 digest，
    #    与 Registry / 本地拉取结果做三方交叉核对（不靠声明文字冒充可核验）。
    needs: [preflight, build-image, publish-release]
    runs-on: ubuntu-latest
    # 读取 draft Release 需要 contents: write（顶层默认只有 read）
    permissions:
      contents: write
      packages: read
    # dry_run 时没有真正的 Release 可核验（publish-release 已被跳过），
    # 本 job 也一并跳过。
    if: needs.preflight.outputs.dry_run != 'true'
    steps:
      - name: 核验 Release 与资产（draft 或已发布）
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          REPO="${{ github.repository }}"
          # ⚠️ v0.0.9：与 publish-release 用**同一个事实来源**。
          #    tag push 时 inputs.publish 为空 ⇒ 旧写法让本核验误判为
          #    「Draft 路径」，从而不去校验「已发布 + 非 latest」。
          PUBLISH="${{ needs.preflight.outputs.publish }}"

          # 用**列表**接口读取 Release，而不是 /releases/tags/{tag}。
          # 原因：GitHub 的按 tag 查询端点**不返回 draft 状态**的 Release
          # （即使带凭据也会得到 404 Not Found）—— 实测确认。
          # 列表接口则能拿到 draft（含其资产清单）。
          curl -s -o /tmp/rel-list.json \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases?per_page=100"

          python3 - "$VERSION" "$PUBLISH" <<'PY'
          import json, sys
          VERSION = sys.argv[1]
          PUBLISH = sys.argv[2]
          lst = json.load(open('/tmp/rel-list.json', encoding='utf-8'))
          if not isinstance(lst, list):
              print('::error::无法读取 Release 列表：', lst.get('message', '未知错误'))
              sys.exit(1)
          hit = [r for r in lst if r.get('tag_name') == VERSION]
          if not hit:
              print('::error::Release 列表中找不到 tag =', VERSION)
              sys.exit(1)
          d = hit[0]
          is_draft = bool(d.get('draft'))
          is_prerelease = bool(d.get('prerelease'))
          print('Release 状态：', 'draft' if is_draft else '已发布')
          if not is_prerelease:
              print('::error::Release 未标记 prerelease'); sys.exit(1)
          # ⚠️ v0.0.9：公开发布时**必须**是「已发布 + Pre-release」，
          #    且**不得**被设为 latest（本项目 0.0.x 全是开发预览版，
          #    latest 指向它会误导用户）。
          if PUBLISH == 'true':
              if is_draft:
                  print('::error::publish=true 但 Release 仍是 draft'); sys.exit(1)
              if d.get('latest') is True:
                  print('::error::Release 被标记为 latest —— 0.0.x 开发预览版不得占用 latest')
                  sys.exit(1)
              print('公开形态核验通过：已发布 + Pre-release + 非 latest ✓')
          names = [a['name'] for a in d.get('assets', [])]
          print('资产清单:', names)
          if not any('deploy.zip' in n for n in names):
              print('::error::缺少安装包'); sys.exit(1)
          if 'SHA256SUMS' not in names:
              print('::error::缺少 SHA256SUMS'); sys.exit(1)
          print('Release 状态核验通过 ✓')
          if is_draft:
              print('::notice::Release 处于 draft —— 资产匿名不可下载（GitHub 的正常行为）。'
                    '已跳过匿名下载校验；转正式发布后会自动补做。')
          PY

      # 仅在 Release 已公开时做匿名下载校验。
      # draft 状态下 GitHub 不允许匿名下载 Release 资产，
      # 此时下载会得到 404 页面而非文件，校验必然失败 —— 不是资产有问题。
      - name: 实际下载安装包并校验 SHA256（仅已发布的 Release）
        # ⚠️ outputs 一律是**字符串**，必须用 == 'true'；
        #    旧写法 `inputs.publish == true` 在 tag push 时恒为 false，
        #    导致匿名下载 / SHA256 校验 / Release 页面核验全被跳过。
        if: ${{ needs.preflight.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          REPO="${{ github.repository }}"
          URL="https://github.com/$REPO/releases/download/$VERSION/v2ex-clone-${VERSION}-deploy.zip"
          # 文件名必须与 SHA256SUMS 中记录的一致，直接用最终名字下载
          # ⚠️ N10：必须 --fail。否则 Release 仍是 Draft / 资产缺失时，
          #    `curl -sL` 会把 GitHub 的 404 HTML 页面当成 ZIP / SHA256SUMS
          #    下载成功，后面的校验报错会指向错误的对象，甚至可能静默通过。
          curl -fsSL --retry 3 --max-time 300 -o "/tmp/v2ex-clone-${VERSION}-deploy.zip" "$URL"
          SIZE=$(stat -c%s "/tmp/v2ex-clone-${VERSION}-deploy.zip")
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::下载到的安装包过小（$SIZE 字节）"
            exit 1
          fi
          echo "下载大小：$SIZE 字节"
          # 用远端 SHA256SUMS 校验
          curl -fsSL --retry 3 --max-time 60 -o /tmp/SHA256SUMS \
            "https://github.com/$REPO/releases/download/$VERSION/SHA256SUMS"
          cd /tmp
          sha256sum -c SHA256SUMS
          echo "✓ 安装包 SHA256 校验通过"
          # 解压确认结构完整
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          unzip -q "v2ex-clone-${VERSION}-deploy.zip" -d /tmp/verify
          ls /tmp/verify/deploy/
          test -f /tmp/verify/deploy/install.sh
          test -f /tmp/verify/deploy/install.ps1
          test -f /tmp/verify/deploy/docker-compose.yml
          echo "✓ 安装包结构完整"

      - name: 登录 GHCR（核验用）
        # ⚠️ v0.0.4：补上登录，让「带凭据拉取」名副其实。
        #   此前该步骤没有任何 registry 登录，只靠匿名 pull ——
        #   而匿名 pull 只在包为 Public 时可行；
        #   一旦 Packages visibility 变成 Private，这道
        #   「验证镜像确实推送成功」的闸门会**必然失败**。
        #   `packages: read` 权限不会让 docker 客户端自动获得凭据。
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 核验 GHCR 镜像已推送（带凭据拉取）
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"
          # 用 CI 自带凭据拉取 —— 验证「镜像确实已推送成功」。
          # 注意：**匿名**可拉取取决于仓库 Packages 的 visibility 设置，
          # 而那是仓库级配置，不在代码控制范围内，因此这里只做提示，
          # 不作为发布成败的判据。
          #
          # ⚠️ v0.0.4 更正：v0.0.3 曾写「GHCR 首次发布默认为 private」——
          # 该结论基于「匿名第 1 步 401 即判 private」的不完整测试，是错的。
          # 按完整 Bearer 协议实测三个历史版本均匿名 HTTP 200（公开可拉取）。
          # 详见 docs/SECURITY_EXCEPTIONS.md E-10。
          if docker pull "$IMAGE"; then
            echo "✓ 镜像拉取成功：$IMAGE"
            docker image inspect "$IMAGE" --format 'Digest: {{index .RepoDigests 0}}'
          else
            echo "::error::镜像 $IMAGE 无法拉取 —— 推送环节可能失败"
            exit 1
          fi

          # 额外探测匿名可拉取性，仅作提示。
          #
          # ⚠️ 必须走完整的 Registry V2 Bearer Token 流程：
          #   1) 匿名请求 manifest → 401 + WWW-Authenticate
          #   2) 用 realm 换匿名 token
          #   3) 带 token 重试 → 200 才是「公开可拉取」
          # 只看第 1 步的 401 会**误判**为 private ——
          # 公开包的第 1 步同样返回 401（v0.0.3 就踩了这个坑）。
          ANON_HEADERS=$(mktemp)
          ANON_CODE=$(curl -s -D "$ANON_HEADERS" -o /dev/null -w '%{http_code}' \
            "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/${VERSION}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            || echo "000")
          if [ "$ANON_CODE" = "200" ]; then
            echo "✓ 匿名直接可读 manifest（公开）"
          elif [ "$ANON_CODE" = "401" ]; then
            REALM=$(grep -i '^www-authenticate:' "$ANON_HEADERS" | head -1 \
              | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
            SERVICE=$(grep -i '^www-authenticate:' "$ANON_HEADERS" | head -1 \
              | sed -n 's/.*service="\([^"]*\)".*/\1/p')
            SCOPE=$(grep -i '^www-authenticate:' "$ANON_HEADERS" | head -1 \
              | sed -n 's/.*scope="\([^"]*\)".*/\1/p')
            [ -z "$SCOPE" ] && SCOPE="repository:${IMAGE_NAME}:pull"
            if [ -n "$REALM" ]; then
              ANON_TOKEN=$(curl -s --max-time 20 \
                "${REALM}?service=${SERVICE}&scope=${SCOPE}" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))" \
                2>/dev/null || echo '')
              if [ -n "$ANON_TOKEN" ]; then
                ANON2=$(curl -s -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer ${ANON_TOKEN}" \
                  -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
                  "https://${REGISTRY}/v2/${IMAGE_NAME}/manifests/${VERSION}" || echo "000")
                if [ "$ANON2" = "200" ]; then
                  echo "✓ 匿名 Bearer 流程通过（HTTP 200）—— 镜像为 Public，普通用户可直接 pull"
                else
                  echo "::notice::匿名 Bearer 流程后仍返回 HTTP ${ANON2} —— 匿名拉取不可用。"
                  echo "::notice::这不影响镜像已推送的事实（上面的带凭据拉取已验证）。"
                fi
              else
                echo "::notice::未能换到匿名 token（HTTP ${ANON_CODE} 后 token 失败）"
              fi
            else
              echo "::notice::无法从 WWW-Authenticate 解析 realm，跳过匿名探测"
            fi
          else
            echo "::notice::匿名探测返回 HTTP ${ANON_CODE}（非 200/401）"
          fi
          rm -f "$ANON_HEADERS"

      - name: 交叉核对真实镜像 Digest（N3）
        # 任务书 §七「镜像 Digest 必须记录真实值」：不能只在 Notes 里声明
        # 「可复核」，必须由三个独立来源互证 —— 构建输出 / 本地 pull /
        # 匿名 Registry V2 响应头。任一不一致都判红。
        env:
          BUILD_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'
          [ -n "$BUILD_DIGEST" ] || { echo "::error::build-image 未产出 digest"; exit 1; }

          # ① 本地拉取结果（上一步已 docker pull 成功）
          LOCAL_DIGEST="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | sed 's/.*@//' | tr -d '\r')"
          [ -n "$LOCAL_DIGEST" ] || { echo "::error::读不到本地 RepoDigest"; exit 1; }

          # ② 匿名 Registry V2 的 Docker-Content-Digest（完整 Bearer 流程）
          SCOPE="repository:${{ env.IMAGE_NAME }}:pull"
          TOKEN="$(curl -fsS --max-time 30 "https://${{ env.REGISTRY }}/token?service=${{ env.REGISTRY }}&scope=${SCOPE}" \
                   | python3 -c 'import json,sys;print(json.load(sys.stdin).get("token",""))')"
          [ -n "$TOKEN" ] || { echo "::error::无法取得匿名 registry token"; exit 1; }
          HDR="$(mktemp)"
          CODE="$(curl -sS -o /dev/null -D "$HDR" -w '%{http_code}' \
                 -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
                 "https://${{ env.REGISTRY }}/v2/${{ env.IMAGE_NAME }}/manifests/$VERSION")"
          [ "$CODE" = "200" ] || { echo "::error::匿名 manifest 请求返回 HTTP $CODE"; exit 1; }
          REMOTE_DIGEST="$(grep -i '^docker-content-digest:' "$HDR" | tail -1 | tr -d '\r' | awk '{print $2}')"
          rm -f "$HDR"
          [ -n "$REMOTE_DIGEST" ] || { echo "::error::Registry 响应缺少 Docker-Content-Digest"; exit 1; }

          echo "  构建输出 digest : $BUILD_DIGEST"
          echo "  本地 RepoDigest : $LOCAL_DIGEST"
          echo "  Registry 响应头 : $REMOTE_DIGEST"
          [ "$LOCAL_DIGEST" = "$BUILD_DIGEST" ] || { echo "::error::本地 RepoDigest 与构建输出不一致"; exit 1; }
          [ "$REMOTE_DIGEST" = "$BUILD_DIGEST" ] || { echo "::error::Registry 响应头与构建输出不一致"; exit 1; }
          echo "✓ 三方可核验一致：$BUILD_DIGEST"
          {
            echo "### 镜像 Digest（三方可核验）"
            echo ""
            echo "| 来源 | 值 |"
            echo "|---|---|"
            echo "| build-image 输出 | \`$BUILD_DIGEST\` |"
            echo "| 本地 RepoDigest | \`$LOCAL_DIGEST\` |"
            echo "| 匿名 Registry V2 | \`$REMOTE_DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 核验 Release 网页可打开（仅已发布的 Release）
        # draft 状态的 Release 页面对匿名访问返回 404（GitHub 的正常行为），
        # 只有正式发布后才可公开访问。
        # ⚠️ outputs 一律是**字符串**，必须用 == 'true'；
        #    旧写法 `inputs.publish == true` 在 tag push 时恒为 false，
        #    导致匿名下载 / SHA256 校验 / Release 页面核验全被跳过。
        if: ${{ needs.preflight.outputs.publish == 'true' }}
        run: |
            set -euo pipefail
            VERSION="${{ needs.preflight.outputs.version }}"
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' \
              "https://github.com/${{ github.repository }}/releases/tag/$VERSION")
            echo "Release 页面 HTTP $CODE"
            [ "$CODE" = "200" ] || { echo "::error::Release 页面不可访问"; exit 1; }
