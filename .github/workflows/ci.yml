name: CI

# ---------------------------------------------------------------------------
# 持续集成（P0-5）
#
# 目标：
#  1. 在**干净克隆**的环境里验证类型检查 / 构建 / 迁移 / 单元测试 / E2E
#  2. **真实构建并启动** Docker 镜像（不只做配置检查）
#  3. 使用**隔离的** PostgreSQL 与 Redis 服务容器 —— 绝不连接开发库或生产库
#
# 隔离保证：
#  - PostgreSQL 是 GitHub Actions 的 service container，跑在 runner 的
#    独立网络里，与任何外部数据库无连接。
#  - 测试库名统一为 v2ex_ci；单元测试的专用库为 v2ex_seedtest。
#  - CI 中不注入任何真实凭据 —— 全部是临时生成的随机值。
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master, 'fix/**', 'feat/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支的新推送取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.4'
  # ---- 隔离测试环境 ----
  APP_RUNTIME_ENV: test
  TEST_ENV_ISOLATED: '1'
  DISABLE_CAPTCHA: '1'
  ENABLE_DEBUG_ENDPOINTS: '1'
  DEBUG_ENDPOINT_TOKEN: ci-debug-token-not-for-production
  # ---- 临时凭据（每次运行随机，无任何真实价值）----
  POSTGRES_USER: v2ex
  POSTGRES_PASSWORD: ci-postgres-password-not-real
  POSTGRES_DB: v2ex_ci
  REDIS_PASSWORD: ci-redis-password-not-real
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_EMAIL: admin@ci.local
  SEED_ADMIN_PASSWORD: ci-admin-password-12345
  SEED_DEMO_USERS: '1'
  SEED_DEMO_PASSWORD: ci-demo-password-12345
  # ---- 限流参数 ----
  #
  # 这里**必须用与生产一致的默认值**，不能为了「让测试快点跑完」而调高。
  # 有两条 E2E 用例专门验证限流生效：
  #   - e2e/auth.spec.ts「登录限流生效」：连续 15 次错误登录必须出现 429
  #   - e2e/topic.spec.ts「回复限流生效」：连续 30 次回复必须出现 429
  # 把阈值调高会让这两条用例永远等不到 429 而失败。
  # 测试之间的配额干扰由 clearRateLimits（调试端点）在每个用例前清理。
  RATE_LIMIT_LOGIN_MAX: '10'
  RATE_LIMIT_POST_MAX: '5'
  RATE_LIMIT_REPLY_MAX: '20'
  RATE_LIMIT_WINDOW_SECONDS: '60'
  RATE_LIMIT_REPLY_WINDOW_SECONDS: '120'
  RATE_LIMIT_CREATE_NODE_MAX: '10'
  RATE_LIMIT_CREATE_NODE_WINDOW_SECONDS: '60'
  # 注册限流：注册用例会连续创建多个账号，IP 维度的阈值必须够高，
  # 否则正常注册也会被 429 拦下（账号维度阈值保持默认，用于验证双维度限流）。
  RATE_LIMIT_REGISTER_MAX: '5'
  RATE_LIMIT_REGISTER_IP_MAX: '200'
  RATE_LIMIT_REGISTER_WINDOW_SECONDS: '300'

jobs:
  # -------------------------------------------------------------------------
  # 1. 静态检查 + 单元测试
  # -------------------------------------------------------------------------
  unit:
    name: 类型检查 / 单元测试
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ci-postgres-password-not-real
          POSTGRES_DB: v2ex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2ex -d v2ex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ci-redis-password-not-real
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci-redis-password-not-real ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 单元测试
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
          REDIS_URL: redis://:ci-redis-password-not-real@localhost:6379
        run: npx vitest run

  # -------------------------------------------------------------------------
  # 2. E2E（真实启动应用 + Playwright）
  # -------------------------------------------------------------------------
  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ci-postgres-password-not-real
          POSTGRES_DB: v2ex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2ex -d v2ex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ci-redis-password-not-real
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci-redis-password-not-real ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 数据库迁移
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
        run: npx drizzle-kit migrate

      - name: 种子数据
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
        run: npx tsx scripts/seed.ts

      - name: 构建
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
        run: npx next build

      - name: 启动应用
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
          REDIS_URL: redis://:ci-redis-password-not-real@localhost:6379
        run: |
          npx next start -p 3000 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null --max-time 5 http://localhost:3000/ 2>/dev/null; then
              echo "server ready"; break
            fi
            sleep 1
          done
          curl -sS -o /dev/null --max-time 10 http://localhost:3000/ || {
            echo "server failed to start"; exit 1; }

      - name: E2E 测试
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
          REDIS_URL: redis://:ci-redis-password-not-real@localhost:6379
          LOCAL_BASE: http://localhost:3000
          BROWSER_CHANNEL: chromium
        run: npx playwright test --reporter=list

      - name: 停止应用
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # -------------------------------------------------------------------------
  # 3. Docker 镜像真实构建 + 启动验证（P0-2 / P0-3 / P0-4）
  # -------------------------------------------------------------------------
  docker:
    name: Docker 构建与启动验证
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 构建镜像
        run: docker build -t v2ex-clone:ci .

      - name: 验证镜像内 public/ 存在（P0-4）
        run: |
          set -e
          docker run --rm --entrypoint sh v2ex-clone:ci -c \
            'test -d /app/public && echo "OK: /app/public exists"'
          # 干净克隆必须有 public/ —— 若缺失，COPY 会在构建阶段就失败
          docker run --rm --entrypoint sh v2ex-clone:ci -c \
            'ls -la /app/public'

      - name: 验证构建阶段不需要数据库（惰性初始化）
        run: |
          set -e
          # 构建期没有数据库。若 src/db/index.ts 在模块加载时就建连接池，
          # 这里会失败并报 DATABASE_URL is not set。
          docker build \
            --build-arg NODE_ENV=production \
            --target builder \
            -t v2ex-clone:builder-ci .
          echo "OK: builder 阶段在无数据库环境下构建成功"

      - name: 验证 compose 配置不暴露数据库端口（P0-3）
        run: |
          set -e
          # 用 docker compose config 渲染最终配置（不启动容器）
          cat > .env.ci <<'EOF'
          POSTGRES_USER=v2ex
          POSTGRES_PASSWORD=ci-postgres-password-not-real
          POSTGRES_DB=v2ex_ci
          REDIS_PASSWORD=ci-redis-password-not-real
          SESSION_SECRET=ci-only-session-secret-0123456789abcdef0123456789abcdef
          SEED_ADMIN_PASSWORD=ci-admin-password-12345
          EOF
          docker compose --env-file .env.ci config > /tmp/compose-rendered.yml
          echo "--- postgres/redis 是否暴露端口 ---"
          # postgres 与 redis 服务段内不应出现 "published"
          if grep -A 20 '^  postgres:' /tmp/compose-rendered.yml | grep -q 'published:'; then
            echo "✗ postgres 不应向宿主机暴露端口"; exit 1
          fi
          if grep -A 20 '^  redis:' /tmp/compose-rendered.yml | grep -q 'published:'; then
            echo "✗ redis 不应向宿主机暴露端口"; exit 1
          fi
          echo "OK: 默认配置未暴露数据库端口"

      - name: compose 真实启动 + 健康检查 + 重启不污染数据（P0-2）
        run: |
          set -e
          cat > .env.ci <<'EOF'
          POSTGRES_USER=v2ex
          POSTGRES_PASSWORD=ci-postgres-password-not-real
          POSTGRES_DB=v2ex_ci
          REDIS_PASSWORD=ci-redis-password-not-real
          SESSION_SECRET=ci-only-session-secret-0123456789abcdef0123456789abcdef
          SEED_ADMIN_PASSWORD=ci-admin-password-12345
          APP_PORT=3000
          APP_URL=http://localhost:3000
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          EOF
          docker compose --env-file .env.ci up -d --build

          echo "--- 等待应用就绪 ---"
          for i in $(seq 1 90); do
            if curl -sS -o /dev/null --max-time 5 http://localhost:3000/ 2>/dev/null; then
              echo "app ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -sS -o /dev/null --max-time 10 http://localhost:3000/ || {
            echo "--- compose logs ---"; docker compose --env-file .env.ci logs --tail 80; exit 1; }

          echo "--- 记录首次初始化后的数据状态 ---"
          ADMIN_HASH=$(docker compose --env-file .env.ci exec -T postgres \
            psql -U v2ex -d v2ex_ci -t -A -c \
            "select password_hash from users where username='admin'")
          TOPIC_COUNT=$(docker compose --env-file .env.ci exec -T postgres \
            psql -U v2ex -d v2ex_ci -t -A -c "select count(*) from topics")
          echo "topic_count=${TOPIC_COUNT}"

          echo "--- 重启容器（模拟重新部署）---"
          docker compose --env-file .env.ci restart app
          for i in $(seq 1 90); do
            if curl -sS -o /dev/null --max-time 5 http://localhost:3000/ 2>/dev/null; then
              echo "app ready after restart"; break
            fi
            sleep 1
          done
          curl -sS -o /dev/null --max-time 10 http://localhost:3000/ || {
            echo "--- compose logs ---"; docker compose --env-file .env.ci logs --tail 80; exit 1; }

          echo "--- 验证重新部署后数据未被污染 ---"
          ADMIN_HASH_AFTER=$(docker compose --env-file .env.ci exec -T postgres \
            psql -U v2ex -d v2ex_ci -t -A -c \
            "select password_hash from users where username='admin'")
          TOPIC_COUNT_AFTER=$(docker compose --env-file .env.ci exec -T postgres \
            psql -U v2ex -d v2ex_ci -t -A -c "select count(*) from topics")

          if [ "$ADMIN_HASH" != "$ADMIN_HASH_AFTER" ]; then
            echo "✗ 管理员口令在重新部署后被重置了 —— seed 仍在覆盖已有账号"; exit 1
          fi
          if [ "$TOPIC_COUNT" != "$TOPIC_COUNT_AFTER" ]; then
            echo "✗ 主题数在重新部署后发生变化 ($TOPIC_COUNT -> $TOPIC_COUNT_AFTER)"; exit 1
          fi
          echo "OK: 重新部署未重置管理员口令，未污染用户数据"

      - name: compose 日志
        if: always()
        run: docker compose --env-file .env.ci logs --tail 100 || true

      - name: 停止并清理
        if: always()
        run: docker compose --env-file .env.ci down -v || true
