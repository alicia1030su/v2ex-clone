name: Docker/Redis 隔离验证

# ===========================================================================
# v0.0.4 —— R-16 / R-17 的**唯一**取证通道
#
# 背景（为什么必须单独建一个工作流）：
#   R-16（Docker 镜像构建 / Compose 启动 / PG-健康 / Redis-健康 / 数据卷持久化 /
#   容器重启 / 安装包实际部署 / 容器资源观察 / 镜像内容与权限检查）
#   与 R-17（Redis 故障恢复 / 缓存失效 / 内存观测）
#   在开发机（Windows，无 Docker）**无法实跑**。
#   GitHub Actions 的 ubuntu-latest runner 自带 Docker Engine + Compose v2，
#   是唯一能产出**真实运行证据**的地方。
#
# 与既有工作流的关系：
#   · ci.yml 的 `docker` job        —— 只做「构建 + compose 起来 + 重启不污染数据」
#   · install-verify.yml            —— 只做「安装脚本真实部署 + 持久化 + 口令不变」
#   · **本工作流**                   —— 把 R-16 的 9 项与 R-17 的 3 项
#                                     做成**逐项独立断言**，任何一项不达标就红灯，
#                                     并把每一项的原始输出落成 artifact。
#
# 硬性约束：
#   1. **绝不连接任何外部数据库**。PG / Redis 全部由本工作流自己用 compose 起，
#      数据落在 workflow 生命周期内的临时卷里，job 结束即销毁。
#   2. **绝不推送到 GHCR**。本工作流只 `docker build` / `docker load`，
#      不登录 registry、不 push。
#   3. 不创建 Tag、不创建 Release、不改仓库可见性。
#   4. 凭据全部是 workflow 内生成的随机值，`: `add-mask::` 屏蔽。
#
# Action 版本说明（与 ci.yml 保持一致）：
#   GitHub 已于 2026-09-23 移除 runner 上的 Node 20 运行时，
#   仍声明 runs.using: node20 的 Action 会在**启动阶段**直接失败。
#   本文件一律使用已迁移到 node24 的版本。
# ===========================================================================

on:
  push:
    branches: [master, 'fix/**', 'feat/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      # 允许只跑某几项，便于失败后定点重跑
      scenario:
        description: '要执行的情景（留空 = 全部）'
        required: false
        type: string
        default: ''

concurrency:
  group: docker-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.4'
  # ---- 隔离环境标识 ----
  APP_RUNTIME_ENV: test
  TEST_ENV_ISOLATED: '1'
  # ---- 随机凭据（无任何真实价值）----
  POSTGRES_USER: v2ex
  POSTGRES_PASSWORD: docker-verify-postgres-pw-not-real
  POSTGRES_DB: v2ex_dv
  REDIS_PASSWORD: docker-verify-redis-pw-not-real
  SESSION_SECRET: docker-verify-session-secret-0123456789abcdef0123456789
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_EMAIL: admin@docker-verify.local
  SEED_ADMIN_PASSWORD: docker-verify-admin-pw-12345
  APP_PORT: '3000'
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  # =========================================================================
  # 主作业：R-16 的 9 项 + R-17 的 3 项，逐项断言
  # =========================================================================
  verify:
    name: R-16/R-17 九项验证
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 环境信息
        run: |
          echo "  OS      : $(uname -a)"
          echo "  Docker  : $(docker --version)"
          echo "  Compose : $(docker compose version)"
          echo "  可用磁盘: $(df -h / | tail -1 | awk '{print $4}')"

      # ---------------------------------------------------------------------
      # 校验项 1/9 —— 镜像真实构建
      # ---------------------------------------------------------------------
      - name: '[1/9] 镜像真实构建'
        id: build
        run: |
          set -euo pipefail
          docker build -t v2ex-clone:dv .
          docker images v2ex-clone:dv --format '  {{.Repository}}:{{.Tag}}  {{.Size}}'
          echo "IMAGE_SIZE_BYTES=$(docker image inspect v2ex-clone:dv --format '{{.Size}}')" >> "$GITHUB_OUTPUT"
          echo "IMAGE_ID=$(docker image inspect v2ex-clone:dv --format '{{.Id}}')" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # 校验项 9/9 —— 镜像内容与权限检查
      #   · 非 root 用户运行
      #   · 镜像内不含 devDependencies（playwright / vitest / typescript）
      #   · 镜像内不含任何 .env / 凭据文件
      #   · entrypoint 三个必需运行时路径都在
      # ---------------------------------------------------------------------
      # ⚠️ v0.0.8 新增：运维体检脚本（deploy/health-check.sh）的**真实可用性**
      #   验证 —— 任务书 §六 要求「不能把文件存在当作功能可用」。
      - name: '运维体检脚本可用性（§六）'
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/deploy"
          echo "===== 语法检查 ====="
          bash -n health-check.sh && echo "  ✓ 语法 OK"

          echo "===== 复制到安装目录并试跑（真实 compose 栈）====="
          # 用仓库根 compose 起一套真实栈（与发布版同构）
          cd "${{ github.workspace }}"
          cat > .env.opscheck <<'EOF'
          POSTGRES_USER=v2ex
          POSTGRES_PASSWORD=ci-postgres-password-not-real
          POSTGRES_DB=v2ex_ops
          REDIS_PASSWORD=ci-redis-password-not-real
          SESSION_SECRET=ci-only-session-secret-0123456789abcdef0123456789abcdef
          SEED_ADMIN_PASSWORD=ci-admin-password-12345
          APP_PORT=3000
          APP_URL=http://localhost:3000
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          EOF
          docker compose --env-file .env.opscheck up -d --build
          for i in $(seq 1 90); do
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000/api/health/ready 2>/dev/null || echo 000)
            [ "$C" = "200" ] && break
            sleep 2
          done
          echo "  就绪探针 HTTP ${C}"

          echo "===== 在安装目录跑体检脚本 ====="
          mkdir -p /tmp/opsinst && cp -r deploy/. /tmp/opsinst/
          cd /tmp/opsinst
          cp "${{ github.workspace }}/.env.opscheck" .env
          chmod +x *.sh
          set +e
          ./health-check.sh 2>&1 | tee /tmp/health-check.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "  体检脚本退出码 = ${RC}"
          echo "===== 体检结论必须包含关键检查项 ====="
          for kw in "容器状态" "应用就绪" "依赖可用性" "磁盘空间" "备份"; do
            if grep -q "$kw" /tmp/health-check.log; then
              echo "  ✓ 含「$kw」"
            else
              echo "  ✗ 缺少「$kw」—— 体检脚本不完整"; exit 1
            fi
          done
          # 体检必须**识别出**「没有备份」这个事实（安装目录确实没有 backups/）
          if grep -q "没有任何备份文件" /tmp/health-check.log; then
            echo "  ✓ 正确报告「无备份」"
          else
            echo "  ⚠ 未报告「无备份」"
          fi
          rm -f .env.opscheck

      - name: '[9/9] 镜像内容与权限检查'
        run: |
          set -euo pipefail
          echo "===== 9a. 运行用户必须是非 root ====="
          RUN_UID=$(docker image inspect v2ex-clone:dv --format '{{.Config.User}}')
          echo "  Config.User = '${RUN_UID:-<空>}'"
          if [ -z "${RUN_UID}" ] || [ "${RUN_UID}" = "root" ] || [ "${RUN_UID}" = "0" ]; then
            echo "  ✗ 镜像以 root 运行（Config.User='${RUN_UID}'）——违反最小权限"; exit 1
          fi
          # 容器内实际 whoami 复核
          ACTUAL_USER=$(docker run --rm --entrypoint sh v2ex-clone:dv -c 'id -un')
          ACTUAL_UID=$(docker run --rm --entrypoint sh v2ex-clone:dv -c 'id -u')
          echo "  容器内实际用户 = ${ACTUAL_USER} (uid=${ACTUAL_UID})"
          if [ "${ACTUAL_UID}" = "0" ]; then
            echo "  ✗ 容器内进程 uid=0（root）"; exit 1
          fi
          echo "  ✓ 以非 root 用户运行"

          echo "===== 9b. 应用目录权限 ====="
          docker run --rm --entrypoint sh v2ex-clone:dv -c 'ls -ld /app /app/public /app/.next /app/node_modules'

          echo "===== 9c. 镜像内不得含 devDependencies ====="
          for pkg in playwright playwright-core vitest typescript @playwright/test pixelmatch pngjs @types/node; do
            if docker run --rm --entrypoint sh v2ex-clone:dv -c "test -e node_modules/$pkg"; then
              echo "  ✗ 镜像内检出 devDependency: $pkg"; FOUND_DEV=1
            else
              echo "  ✓ 不含 $pkg"
            fi
          done
          # entrypoint 的三个必需运行时路径必须在
          for p in node_modules/drizzle-kit/bin.cjs node_modules/tsx/dist/cli.mjs node_modules/next/dist/bin/next; do
            docker run --rm --entrypoint sh v2ex-clone:dv -c "test -f $p" \
              || { echo "  ✗ 缺少运行时必需文件: $p"; exit 1; }
            echo "  ✓ 存在 $p"
          done
          if [ "${FOUND_DEV:-0}" = "1" ]; then
            echo "  ✗ 镜像含 devDependencies —— 生产镜像不必要地膨胀且携带漏洞版本"; exit 1
          fi
          echo "  ✓ 镜像不含 devDependencies"

          echo "===== 9d. 镜像内不得含凭据 / 环境文件 ====="
          for f in .env .env.local .env.test .env.production INSTALL_CREDENTIALS.txt; do
            if docker run --rm --entrypoint sh v2ex-clone:dv -c "test -e /app/$f"; then
              echo "  ✗ 镜像内检出敏感文件: $f"; exit 1
            else
              echo "  ✓ 不含 $f"
            fi
          done
          # 全盘扫一遍常见密钥关键字（只查文件名与 .env 类内容，不打印内容）
          SECRET_HITS=$(docker run --rm --entrypoint sh v2ex-clone:dv -c \
            "find /app -maxdepth 2 -name '*.env*' -o -maxdepth 2 -name '*CREDENTIAL*' 2>/dev/null | head -20" || true)
          if [ -n "${SECRET_HITS}" ]; then
            echo "  ✗ 镜像内检出疑似凭据文件:"; echo "${SECRET_HITS}"; exit 1
          fi
          echo "  ✓ 无凭据文件"

          # -------------------------------------------------------------------
          # 9d-b. 镜像内**文件内容**不得含测试凭据字面量（v0.0.15 新增）
          #
          # ⚠️ 上面 9d 只查**文件名**（.env / *CREDENTIAL*），
          #    查不到「脚本源码里明文写着一串看起来像密钥的字符串」。
          #    v0.0.15 发布前核查就栽在这里：
          #      `.dockerignore` 无 scripts 规则 + runner 阶段整目录 COPY
          #      ⇒ scripts/ 45 个文件全进镜像，其中 8 个含
          #        `ci-only-session-secret-…` / `v2ex_test_password_local_only`
          #        / `ci-postgres-password-not-real` / `ci-redis-password-not-real`。
          #    它们不是生产凭据（install.sh 随机生成），但会误导审计、
          #    触发镜像扫描告警 —— 属于必须修的发行缺陷（BUG_REGISTER V15-11）。
          #
          #    这条是**容器内实测**，不是读源码字符串：
          #    直接在镜像里 grep，能证明「最终层真的没有」，而不只是
          #    「我改了 Dockerfile 所以应该没有」。
          #    只打印**文件名与命中数**，绝不打印内容（避免日志泄露）。
          # -------------------------------------------------------------------
          echo "===== 9d-b. 镜像文件内容不得含测试凭据字面量 ====="
          CRED_PATTERN='ci-only-session-secret|v2ex_test_password_local_only|ci-postgres-password-not-real|ci-redis-password-not-real|ci-only-session'
          if docker run --rm --entrypoint sh v2ex-clone:dv -c \
               "grep -rlE '${CRED_PATTERN}' /app/scripts /app/drizzle /app/src 2>/dev/null | head -20" \
               > /tmp/cred_hits.txt; then
            :
          fi
          if [ -s /tmp/cred_hits.txt ]; then
            echo "  ✗ 镜像内检出含测试凭据字面量的文件（只列路径，不打印内容）:"
            sed 's/^/    /' /tmp/cred_hits.txt
            echo "  ⇒ 这些文件只应在 CI / 发布机使用，必须从镜像中排除"
            exit 1
          fi
          echo "  ✓ 镜像内无测试凭据字面量"

          # -------------------------------------------------------------------
          # 9d-c. 镜像内 scripts 必须只有运行时白名单里的那几个
          #
          # 与 9d-b 互补：9d-b 查「有没有凭据」，这条查「有没有多余文件」。
          # 只查凭据的话，一个不含凭据的开发脚本仍会悄悄进镜像；
          # 只查白名单的话，白名单里的文件若被人加进凭据也查不出来。
          # 两条一起才闭合。
          # -------------------------------------------------------------------
          echo "===== 9d-c. 镜像内 scripts 必须是运行时白名单 ====="
          docker run --rm --entrypoint sh v2ex-clone:dv -c \
            'find /app/scripts -type f | sort' > /tmp/img_scripts.txt
          echo "  镜像内 scripts 文件清单："
          sed 's/^/    /' /tmp/img_scripts.txt
          EXPECTED_SCRIPTS='/app/scripts/admin-cli.ts
          /app/scripts/db-admin.mjs
          /app/scripts/docker-entrypoint.sh
          /app/scripts/seed.ts
          /app/scripts/wait-for-db.mjs'
          ACTUAL_COUNT=$(wc -l < /tmp/img_scripts.txt | tr -d ' ')
          if [ "${ACTUAL_COUNT}" != "5" ]; then
            echo "  ✗ 镜像内 scripts 文件数为 ${ACTUAL_COUNT}，期望 5"
            echo "  ⇒ 多余文件说明 .dockerignore 或 Dockerfile 白名单被放宽了"
            exit 1
          fi
          echo "  ✓ 镜像内 scripts 恰为 5 个运行时脚本"

          echo "===== 9e. 镜像内迁移物完整性 ====="
          docker run --rm --entrypoint sh v2ex-clone:dv -c 'ls -la /app/drizzle/ /app/drizzle/meta/'
          # ⚠️ 路径勘误（2026-11-04，CI 实测）：
          #   drizzle 的迁移 SQL 在 /app/drizzle/ 根目录，
          #   而 _journal.json 与 snapshot 在 /app/drizzle/meta/ 子目录。
          #   初版把两者混在同一列表里、用同一路径断言，
          #   导致 _journal.json 被误判为「镜像内缺少」而红灯 ——
          #   而实际上前面的 ls 输出已经证明它存在。
          #   这属于**验证脚本自身的路径错误**，不是产品缺陷。
          for f in 0000_init.sql 0001_striped_magdalene.sql 0002_v004_perf_indexes.sql; do
            docker run --rm --entrypoint sh v2ex-clone:dv -c "test -f /app/drizzle/$f" \
              || { echo "  ✗ 镜像内缺少迁移文件: /app/drizzle/$f"; exit 1; }
            echo "  ✓ /app/drizzle/$f 在镜像内"
          done
          # meta/ 子目录里的元数据文件（journal + 三个 snapshot）
          for f in _journal.json 0000_snapshot.json 0001_snapshot.json 0002_snapshot.json; do
            docker run --rm --entrypoint sh v2ex-clone:dv -c "test -f /app/drizzle/meta/$f" \
              || { echo "  ✗ 镜像内缺少迁移元数据: /app/drizzle/meta/$f"; exit 1; }
            echo "  ✓ /app/drizzle/meta/$f 在镜像内"
          done

          echo "===== 9f. 镜像体积 ====="
          docker images v2ex-clone:dv --format '  {{.Repository}}:{{.Tag}}  {{.Size}}'

      # ---------------------------------------------------------------------
      # 校验项 2/9 —— compose 启动 + PG/Redis 健康检查（校验项 3/9）
      # ---------------------------------------------------------------------
      - name: '[2/9][3/9] Compose 启动 + PG/Redis 健康检查'
        run: |
          set -euo pipefail
          cat > .env.dv <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          SESSION_SECRET=${SESSION_SECRET}
          SEED_ADMIN_USERNAME=${SEED_ADMIN_USERNAME}
          SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
          SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
          APP_PORT=${APP_PORT}
          APP_URL=${APP_URL}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          EOF
          # 根 compose 用本地构建（build: . / Dockerfile）
          docker compose --env-file .env.dv up -d --build

          echo "===== compose ps ====="
          docker compose --env-file .env.dv ps

          # ⚠️ 断言口径勘误（2026-11-04，CI 实测踩坑，run 41837202602）：
          #
          #   根目录 docker-compose.yml 的 **app 服务没有定义 healthcheck**
          #   （只有 deploy/docker-compose.yml 才有 —— 发行版需要给
          #    install.sh / start.sh / update.sh 等待就绪的信号）。
          #
          #   因此 `docker inspect --format '{{.State.Health.Status}}' v2ex-app`
          #   **永远返回 none**，初版断言「三个容器全部 healthy」会**恒假**：
          #   实测日志里 app 其实已完全就绪（三个 entrypoint 阶段全过、
          #   `✓ Ready in 414ms`），却因为读不到 health 状态而判失败。
          #
          #   正确口径：
          #     · postgres / redis —— 有 healthcheck，断言 State.Health.Status
          #     · app            —— 无 healthcheck，改用**容器状态 + HTTP 探活**判定
          #                          （HTTP 探活是更强的证据：它证明应用真的在服务）
          echo "===== 等待 PG/Redis healthy 且 app 容器 running + HTTP 200 ====="
          APP_CODE='000'
          for i in $(seq 1 60); do
            PG=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' v2ex-postgres 2>/dev/null || echo none)
            RD=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' v2ex-redis 2>/dev/null || echo none)
            APP_STATE=$(docker inspect --format '{{.State.Status}}' v2ex-app 2>/dev/null || echo none)
            APP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/ 2>/dev/null || echo 000)
            echo "  [${i}s] postgres=${PG} redis=${RD} app_state=${APP_STATE} http=${APP_CODE}"
            if [ "$PG" = "healthy" ] && [ "$RD" = "healthy" ] \
               && [ "$APP_STATE" = "running" ] && [ "$APP_CODE" = "200" ]; then
              echo "  ✓ PG/Redis healthy，app 容器 running 且 HTTP 200"; break
            fi
            if [ "$PG" = "unhealthy" ] || [ "$RD" = "unhealthy" ]; then
              echo "  ✗ 依赖容器 unhealthy"; docker compose --env-file .env.dv logs --tail 100; exit 1
            fi
            if [ "$APP_STATE" = "exited" ] || [ "$APP_STATE" = "dead" ]; then
              echo "  ✗ app 容器已退出（${APP_STATE}）"; docker compose --env-file .env.dv logs --tail 100; exit 1
            fi
            sleep 3
          done
          [ "${PG}" = "healthy" ] || { echo "  ✗ postgres 未达 healthy（${PG}）"; docker compose --env-file .env.dv logs --tail 100; exit 1; }
          [ "${RD}" = "healthy" ] || { echo "  ✗ redis 未达 healthy（${RD}）"; docker compose --env-file .env.dv logs --tail 100; exit 1; }
          [ "${APP_STATE}" = "running" ] || { echo "  ✗ app 容器未在 running（${APP_STATE}）"; docker compose --env-file .env.dv logs --tail 100; exit 1; }
          [ "${APP_CODE}" = "200" ] || { echo "  ✗ app HTTP 探活失败（${APP_CODE}）"; docker compose --env-file .env.dv logs --tail 100; exit 1; }
          echo "  ✓ 三个服务全部就绪（app 无 healthcheck，用容器状态 + HTTP 200 判定）"

          echo "===== PG 实查 ====="
          docker compose --env-file .env.dv exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c "select version();"
          echo "===== Redis 实查 ====="
          docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
          docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning info server | grep -E 'redis_version|uptime'

          echo "===== HTTP 探活 ====="
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)
          echo "  GET / → ${CODE}"
          [ "$CODE" = "200" ] || exit 1

          echo "===== 数据库端口不得对宿主机暴露 ====="
          docker compose --env-file .env.dv config > /tmp/compose-rendered.yml
          if grep -A 20 '^  postgres:' /tmp/compose-rendered.yml | grep -q 'published:'; then
            echo "  ✗ postgres 向宿主机暴露了端口"; exit 1
          fi
          if grep -A 20 '^  redis:' /tmp/compose-rendered.yml | grep -q 'published:'; then
            echo "  ✗ redis 向宿主机暴露了端口"; exit 1
          fi
          echo "  ✓ postgres / redis 均未暴露宿主机端口"

      # ---------------------------------------------------------------------
      # 校验项 4/9 —— 数据卷持久化（跨 restart + 跨 down/up 重建容器）
      # ---------------------------------------------------------------------
      - name: '[4/9] 数据卷持久化'
        run: |
          set -euo pipefail
          echo "===== 写入探针数据 ====="
          docker compose --env-file .env.dv exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (username, email, password_hash, role, balance)
          VALUES ('dv_probe', 'dv_probe@docker-verify.local', 'x', 'user', 100)
          ON CONFLICT DO NOTHING;
          SQL
          # Redis 也写一个键，验证 AOF 持久化
          docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning SET dv_probe_key dv_probe_value

          BEFORE_USERS=$(docker compose --env-file .env.dv exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c "select count(*) from users where username='dv_probe'")
          BEFORE_REDIS=$(docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning GET dv_probe_key)
          echo "  PG 探针用户数 = ${BEFORE_USERS}"
          echo "  Redis 探针键值 = ${BEFORE_REDIS}"

          echo "===== 容器整体 down（保留卷）后 up —— 数据必须仍在 ====="
          docker compose --env-file .env.dv down        # 注意：不加 -v，卷保留
          docker compose --env-file .env.dv up -d
          # app 无 healthcheck（根 compose 未定义）→ 用容器状态 + HTTP 200 判定
          APP_CODE='000'
          for i in $(seq 1 60); do
            APP_STATE=$(docker inspect --format '{{.State.Status}}' v2ex-app 2>/dev/null || echo none)
            APP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/ 2>/dev/null || echo 000)
            [ "$APP_STATE" = "running" ] && [ "$APP_CODE" = "200" ] && break
            sleep 3
          done
          echo "  app state = ${APP_STATE}  http = ${APP_CODE}"

          AFTER_USERS=$(docker compose --env-file .env.dv exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c "select count(*) from users where username='dv_probe'")
          AFTER_REDIS=$(docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning GET dv_probe_key)
          echo "  down/up 后 PG 探针用户数 = ${AFTER_USERS}"
          echo "  down/up 后 Redis 探针键值 = ${AFTER_REDIS}"

          [ "${BEFORE_USERS}" = "${AFTER_USERS}" ] || { echo "  ✗ PG 数据在 down/up 后丢失"; exit 1; }
          [ "${BEFORE_REDIS}" = "${AFTER_REDIS}" ] || { echo "  ✗ Redis 数据在 down/up 后丢失（AOF 未生效）"; exit 1; }
          [ "${AFTER_USERS}" != "0" ] || { echo "  ✗ 探针用户不存在 —— 持久化验证无效"; exit 1; }
          echo "  ✓ 数据卷持久化通过（PG 与 Redis 均保持）"

      # ---------------------------------------------------------------------
      # 校验项 5/9 —— 容器重启（不丢数据、不重置口令）
      # ---------------------------------------------------------------------
      - name: '[5/9] 容器重启（数据与口令不变）'
        run: |
          set -euo pipefail
          BEFORE_HASH=$(docker compose --env-file .env.dv exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c \
            "select password_hash from users where username='${SEED_ADMIN_USERNAME}'")
          BEFORE_TOPICS=$(docker compose --env-file .env.dv exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c "select count(*) from topics")
          echo "  重启前 主题数=${BEFORE_TOPICS}  管理员哈希前 16 位=${BEFORE_HASH:0:16}"

          docker compose --env-file .env.dv restart
          # app 无 healthcheck（根 compose 未定义）→ 用容器状态 + HTTP 200 判定
          APP_CODE='000'
          for i in $(seq 1 60); do
            APP_STATE=$(docker inspect --format '{{.State.Status}}' v2ex-app 2>/dev/null || echo none)
            APP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/ 2>/dev/null || echo 000)
            [ "$APP_STATE" = "running" ] && [ "$APP_CODE" = "200" ] && break
            sleep 3
          done
          echo "  重启后 app state = ${APP_STATE}  http = ${APP_CODE}"
          [ "${APP_STATE}" = "running" ] || { docker compose --env-file .env.dv logs --tail 100; exit 1; }
          [ "${APP_CODE}" = "200" ] || { docker compose --env-file .env.dv logs --tail 100; exit 1; }

          AFTER_HASH=$(docker compose --env-file .env.dv exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c \
            "select password_hash from users where username='${SEED_ADMIN_USERNAME}'")
          AFTER_TOPICS=$(docker compose --env-file .env.dv exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c "select count(*) from topics")
          echo "  重启后 主题数=${AFTER_TOPICS}  管理员哈希前 16 位=${AFTER_HASH:0:16}"

          [ -n "${BEFORE_HASH}" ] || { echo "  ✗ 管理员账号不存在，验证无效"; exit 1; }
          [ "${BEFORE_HASH}" = "${AFTER_HASH}" ] || { echo "  ✗ 管理员口令在重启后被重置 —— seed 仍在覆盖已有账号"; exit 1; }
          [ "${BEFORE_TOPICS}" = "${AFTER_TOPICS}" ] || { echo "  ✗ 主题数在重启后变化（${BEFORE_TOPICS} → ${AFTER_TOPICS}）—— seed 污染了数据"; exit 1; }
          echo "  ✓ 重启未重置管理员口令、未污染用户数据"

      # ---------------------------------------------------------------------
      # 校验项 7/9 —— 安装包实际部署（用 release 产出的 tar.gz 真装一遍）
      # ---------------------------------------------------------------------
      - name: '[7/9] 安装包实际部署'
        run: |
          set -euo pipefail
          echo "===== 打包 release 目录 ====="
          mkdir -p /tmp/dist
          tar -czf /tmp/dist/v2ex-clone-deploy.tar.gz -C deploy .
          tar -tzf /tmp/dist/v2ex-clone-deploy.tar.gz | head -30

          echo "===== 解包到全新目录模拟用户安装 ====="
          rm -rf /tmp/inst && mkdir -p /tmp/inst
          tar -xzf /tmp/dist/v2ex-clone-deploy.tar.gz -C /tmp/inst
          cd /tmp/inst
          ls -la
          for f in *.sh; do bash -n "$f" || { echo "  ✗ bash -n 失败: $f"; exit 1; }; done
          echo "  ✓ 所有 shell 脚本语法通过"

          # ⚠️ 必须先停掉根 compose 的容器（2026-11-04 复核发现，否则本步必红）：
          #
          #   1) **端口冲突** —— 根 compose 的 app 映射到宿主机 ${APP_PORT:-3000}，
          #      而 install.sh 第 163 行有硬性端口占用检查：
          #          if port_in_use "$APP_PORT"; then die "端口 ... 已被占用。"
          #      不停掉就直接 `die`。
          #   2) **容器名冲突** —— 两份 compose 都硬编码了
          #      container_name: v2ex-postgres / v2ex-redis / v2ex-app，
          #      同时存在会让 compose up 直接失败。
          #
          #   停掉根 compose（**保留卷**，不影响前面几项已取证的数据卷状态）。
          echo "===== 停掉根 compose 容器（避免端口/容器名冲突）====="
          cd "$GITHUB_WORKSPACE"
          docker compose --env-file .env.dv stop
          docker compose --env-file .env.dv rm -f
          echo "  ✓ 根 compose 容器已停止"

          cd /tmp/inst
          # **不预置 .env** —— 让 install.sh 走完整的「首次安装」路径：
          #   从 .env.example 生成 .env + 四枚随机口令 + INSTALL_CREDENTIALS.txt。
          #
          # 为什么删掉原来的预置块（2026-11-05 修复，真实 CI 抓到的）：
          #   原做法预置一个只含 APP_PORT/APP_URL/V2EX_IMAGE 的 .env，
          #   install.sh 的幂等分支「沿用现有配置」随后校验四枚口令非空 →
          #   POSTGRES_PASSWORD 为空 → die（安装直接失败）。
          #   且幂等分支**不会创建** INSTALL_CREDENTIALS.txt，
          #   后面「凭据文件缺失」检查注定红灯。
          #   预置 .env 等于把真实用户旅程（首次安装）换成了半成品升级路径。
          #
          # 端口说明：首次安装路径用 .env.example 的默认 3000。
          # 上一步已停掉根 compose 容器（端口与容器名均已释放），不存在冲突；
          # 安装容器随后也会被 down 掉，根 compose 再恢复到 3000，全程串行无冲突。

          # ⚠️ 清空本 job 的 env 覆盖（2026-11-05 修复，真实 CI 抓到的）：
          #
          #   事故现场（run 41868374546，SHA 827eef7）：
          #     安装模拟全程「成功」——install.sh 跑完、口令长度 32/32/48/16、
          #     INSTALL_CREDENTIALS.txt 600、app health=healthy——
          #     但最后一步 psql 报：
          #       FATAL: database "v2ex" does not exist
          #
          #   根因：Docker Compose 的变量插值优先级是
          #       **shell 环境变量 > --env-file / .env 文件**
          #   本工作流 job 级 env（第 56-72 行，为根 compose 栈准备）含有
          #   POSTGRES_DB=v2ex_dv 等一整套变量。install.sh 第 347 行执行的是
          #   裸 `docker compose up -d`（无 --env-file，靠当前目录 .env 插值），
          #   于是安装栈实际拿到的是**工作流的占位凭据**：
          #     · postgres 容器 POSTGRES_DB=v2ex_dv → initdb 建出 v2ex_dv
          #       （pg_isready 不校验库是否存在，healthcheck 照样 Healthy）
          #     · app 容器 DATABASE_URL=.../v2ex_dv（第 93 行同一插值来源）
          #       → 与 postgres 内部自洽，迁移/seed/首页全部正常 → healthy
          #     · 但本 step 末尾硬编码的 `psql -d v2ex` 必然 FATAL
          #   比红灯更危险的是：整个「安装模拟」被悄悄降级——
          #   验的不再是 install.sh 生成的随机口令，而是工作流的占位口令，
          #   INSTALL_CREDENTIALS.txt 里的口令与库里 seed 的实际口令并不一致。
          #   install-verify.yml 没有这组 job 级 env，所以它一直是真绿的。
          #
          #   处置：跑 install.sh 前把这些变量从 shell 里 unset，
          #   让 compose 插值完全回落到 /tmp/inst/.env（真实首装产物）。
          #   作用域说明：每个 run: step 都是独立 shell，job 级 env 会被
          #   重新注入，unset 只影响本 step；本 step 末尾恢复根 compose 用
          #   `--env-file .env.dv`，其中已含全部 11 个所需键，不依赖 shell env。
          unset POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB \
                REDIS_PASSWORD SESSION_SECRET \
                SEED_ADMIN_USERNAME SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD \
                APP_PORT APP_URL NEXT_PUBLIC_APP_URL \
                APP_RUNTIME_ENV TEST_ENV_ISOLATED

          echo "===== 用本地构建镜像跑 install.sh（真实 Docker）====="
          # V2EX_IMAGE=v2ex-clone:dv → 指向**本工作流本地构建**的镜像。
          # install.sh 会先尝试 `docker compose pull`；该 tag 只存在于本地，
          # pull 必然失败，随后脚本走「本机已存在镜像 → 继续使用本地镜像」的分支。
          # ⚠️ 因此**绝不会**从 GHCR 拉取、**绝不会** push 任何镜像。
          V2EX_IMAGE=v2ex-clone:dv bash ./install.sh 2>&1 | tee /tmp/install.log | tail -40

          echo "===== 校验安装产物 ====="
          test -f .env || { echo "  ✗ .env 未生成"; exit 1; }
          PERM=$(stat -c '%a' .env)
          echo "  .env 权限 = ${PERM}"
          [ "$PERM" = "600" ] || { echo "  ✗ .env 权限应为 600"; exit 1; }
          if [ -f INSTALL_CREDENTIALS.txt ]; then
            CPERM=$(stat -c '%a' INSTALL_CREDENTIALS.txt)
            echo "  INSTALL_CREDENTIALS.txt 权限 = ${CPERM}"
            [ "$CPERM" = "600" ] || { echo "  ✗ 凭据文件权限应为 600"; exit 1; }
          else
            echo "  ✗ 凭据文件缺失"; exit 1
          fi
          for k in POSTGRES_PASSWORD REDIS_PASSWORD SESSION_SECRET SEED_ADMIN_PASSWORD; do
            V=$(grep -E "^$k=" .env | cut -d= -f2-)
            echo "  ${k} 长度 = ${#V}"
            [ "${#V}" -ge 16 ] || { echo "  ✗ $k 太短"; exit 1; }
          done
          echo "===== 确认未使用外部镜像（不得是 ghcr.io）====="
          IMG=$(grep -E '^V2EX_IMAGE=' .env | cut -d= -f2-)
          echo "  V2EX_IMAGE = ${IMG}"
          case "${IMG}" in
            ghcr.io/*|docker.io/*|quay.io/*|registry.*)
              echo "  ✗ 安装包指向了外部镜像仓库 —— 本工作流必须只用本地构建镜像"; exit 1 ;;
          esac
          [ "${IMG}" = "v2ex-clone:dv" ] || { echo "  ✗ V2EX_IMAGE 应为 v2ex-clone:dv，实际为 ${IMG}"; exit 1; }
          echo "  ✓ 仅使用本地构建镜像，未触碰任何外部 registry"

          echo "===== 安装后的容器必须 healthy 且管理员存在 ====="
          # 这里用发行版 compose（deploy/docker-compose.yml），app **有** healthcheck
          for i in $(seq 1 60); do
            H=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' v2ex-app 2>/dev/null || echo none)
            [ "$H" = "healthy" ] && break
            sleep 3
          done
          echo "  app health = ${H}"
          [ "$H" = "healthy" ] || { docker compose --env-file .env logs --tail 100; exit 1; }
          # 库名 / 用户 / 管理员名从 install.sh 生成的 .env 里读取，**不再硬编码** ——
          # 硬编码 v2ex 正是上一轮红灯的直接原因（插值被 shell env 覆盖成
          # v2ex_dv，见上面的 unset 注释块）。改为读安装产物本身，
          # 检查口径与真实安装结果自动保持一致。
          PG_USER=$(grep -E '^POSTGRES_USER=' .env | cut -d= -f2-)
          PG_DB=$(grep -E '^POSTGRES_DB=' .env | cut -d= -f2-)
          ADMIN_USER=$(grep -E '^SEED_ADMIN_USERNAME=' .env | cut -d= -f2-)
          echo "  安装产物口径：POSTGRES_USER=${PG_USER} POSTGRES_DB=${PG_DB} SEED_ADMIN_USERNAME=${ADMIN_USER}"
          CNT=$(docker compose --env-file .env exec -T postgres psql -U "$PG_USER" -d "$PG_DB" -t -A -c \
            "select count(*) from users where username='${ADMIN_USER}' and role='admin';")
          echo "  管理员账号数 = ${CNT}"
          [ "$CNT" = "1" ] || { echo "  ✗ 管理员未创建"; exit 1; }

          echo "===== 安装后的容器资源占用（安装包路径的容器）====="
          docker stats --no-stream --format '  {{.Name}}  CPU={{.CPUPerc}}  MEM={{.MemUsage}}  MEM%={{.MemPerc}}' v2ex-app v2ex-postgres v2ex-redis

          echo "===== 停掉安装包的容器（释放 v2ex-* 容器名与 3000 端口）====="
          docker compose --env-file .env down || true
          # 注：down（不带 -v）保留安装包的卷，但容器名已释放。

          echo "===== 恢复根 compose 容器（供 [8/9] 与 R-17 步骤使用）====="
          cd "$GITHUB_WORKSPACE"
          docker compose --env-file .env.dv up -d
          APP_CODE='000'
          for i in $(seq 1 60); do
            APP_STATE=$(docker inspect --format '{{.State.Status}}' v2ex-app 2>/dev/null || echo none)
            APP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/ 2>/dev/null || echo 000)
            [ "$APP_STATE" = "running" ] && [ "$APP_CODE" = "200" ] && break
            sleep 3
          done
          echo "  根 compose 恢复：app_state=${APP_STATE} http=${APP_CODE}"
          [ "${APP_STATE}" = "running" ] || { docker compose --env-file .env.dv logs --tail 100; exit 1; }
          [ "${APP_CODE}" = "200" ] || { docker compose --env-file .env.dv logs --tail 100; exit 1; }

      # ---------------------------------------------------------------------
      # 校验项 8/9 —— 容器资源观察（CPU / 内存）
      # ---------------------------------------------------------------------
      - name: '[8/9] 容器资源观察（CPU / 内存）'
        run: |
          set -euo pipefail
          echo "===== 静态资源占用 ====="
          docker stats --no-stream --format '  {{.Name}}\tCPU={{.CPUPerc}}\tMEM={{.MemUsage}}\tMEM%={{.MemPerc}}\tNET={{.NetIO}}\tBLOCK={{.BlockIO}}'
          echo "===== 连续采样 5 次（观察波动）====="
          for i in $(seq 1 5); do
            echo "--- sample ${i} ---"
            docker stats --no-stream --format '  {{.Name}}\tCPU={{.CPUPerc}}\tMEM={{.MemUsage}}\tMEM%={{.MemPerc}}'
            sleep 2
          done
          echo "===== 镜像体积 vs 运行时内存 ====="
          docker images v2ex-clone:dv --format '  image {{.Repository}}:{{.Tag}}  {{.Size}}'
          echo "===== 容器可写层大小 ====="
          for c in v2ex-app v2ex-postgres v2ex-redis; do
            printf '  %-16s ' "$c"
            docker inspect --format '{{.SizeRw}}' "$c" 2>/dev/null || echo 'n/a'
          done
          echo "===== 应用进程内存（容器内）====="
          docker exec v2ex-app sh -c 'ps -o pid,rss,comm 2>/dev/null || cat /proc/1/status | grep -E "VmRSS|VmHWM"' || true

      # ---------------------------------------------------------------------
      # R-17 a —— Redis 中断与恢复
      # ---------------------------------------------------------------------
      - name: '[R-17a] Redis 中断与恢复'
        run: |
          set -euo pipefail
          echo "===== 停止 Redis ====="
          docker compose --env-file .env.dv stop redis
          docker compose --env-file .env.dv ps

          echo "===== Redis 停止期间：应用不得 5xx（应降级而非崩溃）====="
          for path in / /nodes /api/nodes; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${path}")
            echo "  GET ${path} → ${CODE}"
            if [ "${CODE}" -ge 500 ]; then
              echo "  ✗ Redis 停止期间 ${path} 返回 5xx（${CODE}）—— 应用未做降级"; exit 1
            fi
          done

          echo "===== 恢复 Redis ====="
          docker compose --env-file .env.dv start redis
          for i in $(seq 1 30); do
            R=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' v2ex-redis 2>/dev/null || echo none)
            [ "$R" = "healthy" ] && break
            sleep 2
          done
          echo "  redis health = ${R}"
          [ "${R}" = "healthy" ] || { echo "  ✗ Redis 未恢复"; docker compose --env-file .env.dv logs --tail 100; exit 1; }

          echo "===== 恢复后应用必须回到正常 ====="
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "  GET / → ${CODE}"
          [ "${CODE}" = "200" ] || { echo "  ✗ Redis 恢复后应用仍未正常"; exit 1; }
          PONG=$(docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping)
          echo "  redis ping = ${PONG}"
          [ "${PONG}" = "PONG" ] || exit 1
          echo "  ✓ Redis 中断/恢复通过"

      # ---------------------------------------------------------------------
      # R-17 b —— PostgreSQL 中断与恢复
      # ---------------------------------------------------------------------
      - name: '[R-17b] PostgreSQL 中断与恢复'
        run: |
          set -euo pipefail
          echo "===== 停止 PostgreSQL ====="
          docker compose --env-file .env.dv stop postgres
          docker compose --env-file .env.dv ps

          echo "===== PG 停止期间：应用不得返回 5xx 到首页以外的关键页 ====="
          # 首页是 force-dynamic 的 Server Component，DB 挂了必然 5xx —— 这是预期。
          # 这里记录实际行为，不做通过/失败断言，但要明确记录下来供人工判断。
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://localhost:3000/)
          echo "  PG 停止期间 GET / → ${CODE}（预期为 5xx：首页强依赖 DB）"

          echo "===== 恢复 PostgreSQL ====="
          docker compose --env-file .env.dv start postgres
          for i in $(seq 1 40); do
            P=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' v2ex-postgres 2>/dev/null || echo none)
            [ "$P" = "healthy" ] && break
            sleep 2
          done
          echo "  postgres health = ${P}"
          [ "${P}" = "healthy" ] || { echo "  ✗ PostgreSQL 未恢复"; docker compose --env-file .env.dv logs --tail 100; exit 1; }

          echo "===== 恢复后应用必须回到 200 ====="
          RECOVERED=0
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://localhost:3000/)
            echo "  [${i}] GET / → ${CODE}"
            if [ "$CODE" = "200" ]; then RECOVERED=1; break; fi
            sleep 3
          done
          [ "${RECOVERED}" = "1" ] || { echo "  ✗ PostgreSQL 恢复后应用仍未回到 200"; docker compose --env-file .env.dv logs --tail 100; exit 1; }
          echo "  ✓ PostgreSQL 中断/恢复通过（应用自动恢复，无需重启容器）"

      # ---------------------------------------------------------------------
      # R-17 c —— 缓存失效观测（Redis 内存 / keyspace）
      # ---------------------------------------------------------------------
      - name: '[R-17c] 缓存失效与 Redis 内存观测'
        run: |
          set -euo pipefail
          echo "===== 清库前 Redis 内存与 keyspace ====="
          docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning info memory | grep -E 'used_memory_human|used_memory_peak_human|maxmemory_human'
          docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning info keyspace

          echo "===== 触发缓存写入（连续请求若干次）====="
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://localhost:3000/nodes
            curl -s -o /dev/null http://localhost:3000/
          done
          echo "===== 写入后 Redis 内存与 keyspace ====="
          docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning info memory | grep -E 'used_memory_human|used_memory_peak_human'
          docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning info keyspace
          docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning dbsize

          echo "===== 缓存失效：FLUSHDB 后 keyspace 必须清空 ====="
          docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning FLUSHDB
          SIZE=$(docker compose --env-file .env.dv exec -T redis \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning dbsize)
          echo "  FLUSHDB 后 dbsize = ${SIZE}"
          [ "${SIZE}" = "0" ] || { echo "  ✗ FLUSHDB 后仍有 ${SIZE} 个键"; exit 1; }

          echo "===== 缓存失效后应用必须仍可用（不得因缓存清空而 5xx）====="
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)
          echo "  GET / → ${CODE}"
          [ "$CODE" = "200" ] || { echo "  ✗ 缓存清空后首页异常"; exit 1; }
          echo "  ✓ 缓存失效观测通过"

      # ---------------------------------------------------------------------
      # 证据汇总 —— 把逐项结论写成一份可归档的 markdown
      #
      # ⚠️ 表达式写法约束（v0.0.4 实测踩坑）：
      #   GitHub Actions 的 `${{ }}` 上下文**不支持** `&&` / `||` 三元式。
      #   本文件初版把 `job.status == 'success' && echo PASS || echo '见日志'`
      #   写进了 `${{ }}`，导致工作流**在定义阶段**直接失败 ——
      #   run 0 秒结束、total_count=0、无任何 job 被创建，
      #   报错只有一句「This run likely failed because of a workflow file issue」。
      #   正确做法：三元判断放在 `run:` 块的 **shell 层**里，
      #   `${{ }}` 只用于传值（见下一行 steps.build.outcome 的写法）。
      # ---------------------------------------------------------------------
      - name: 生成验证汇总
        if: always()
        run: |
          {
            echo "# Docker/Redis 隔离验证汇总"
            echo ""
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- 时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## 校验项"
            echo ""
            echo "| # | 校验项 | 结果 |"
            echo "|---|--------|------|"
            echo "| 1 | 镜像真实构建 | $([ '${{ steps.build.outcome }}' = 'success' ] && echo PASS || echo FAIL) |"
            echo "| 2 | Compose 启动 | $([ "${{ job.status }}" = 'success' ] && echo PASS || echo FAIL) |"
            echo "| 3 | PG / Redis 健康检查 | 同上 |"
            echo "| 4 | 数据卷持久化 | 同上 |"
            echo "| 5 | 容器重启不丢数据 | 同上 |"
            echo "| 6 | Redis / PG 中断恢复 | 同上 |"
            echo "| 7 | 安装包实际部署 | 同上 |"
            echo "| 8 | 容器资源观察 | 同上 |"
            echo "| 9 | 镜像内容与权限检查 | 同上 |"
          } > /tmp/summary.md
          cat /tmp/summary.md

      - name: 上传验证证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-verify-evidence
          path: |
            /tmp/summary.md
            /tmp/install.log
            /tmp/compose-rendered.yml
          retention-days: 14

      - name: compose 日志
        if: always()
        run: docker compose --env-file .env.dv logs --tail 200 || true

      - name: 停止并清理
        if: always()
        run: docker compose --env-file .env.dv down -v || true
