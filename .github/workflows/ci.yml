name: CI

# ---------------------------------------------------------------------------
# 持续集成（P0-5）
#
# 目标：
#  1. 在**干净克隆**的环境里验证类型检查 / 构建 / 迁移 / 单元测试 / E2E
#  2. **真实构建并启动** Docker 镜像（不只做配置检查）
#  3. 使用**隔离的** PostgreSQL 与 Redis 服务容器 —— 绝不连接开发库或生产库
#
# 隔离保证：
#  - PostgreSQL 是 GitHub Actions 的 service container，跑在 runner 的
#    独立网络里，与任何外部数据库无连接。
#  - 测试库名统一为 v2ex_ci；单元测试的专用库为 v2ex_seedtest。
#  - CI 中不注入任何真实凭据 —— 全部是临时生成的随机值。
#
# Action 版本说明（重要，2026-11-04 实测修正）：
#
# GitHub 已于 2026-09-23 从 Actions runner 移除 Node 20 运行时，
# 且 ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION 退避开关**同时失效**。
# 仍声明 runs.using: node20 的 Action 会在**启动阶段**直接失败 ——
# 也就是说 CI 会「什么都没跑」就红灯，而不是跑完了才失败。
#
# 本文件此前用的是 @v4（node20），已全部升级到 node24 版本：
#   actions/checkout@v4        -> node20  ✗   改用 @v7  (node24)
#   actions/setup-node@v4      -> node20  ✗   改用 @v7  (node24)
#   actions/upload-artifact@v4 -> node20  ✗   改用 @v7  (node24)
#
# 注意：setup-node 的 node-version（应用运行时）与 Action 自身的运行时是两回事，
# 前者由 node-version 字段决定，后者由 runner 决定。
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master, 'fix/**', 'feat/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支的新推送取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.4'
  # ---- 隔离测试环境 ----
  APP_RUNTIME_ENV: test
  TEST_ENV_ISOLATED: '1'
  DISABLE_CAPTCHA: '1'
  ENABLE_DEBUG_ENDPOINTS: '1'
  DEBUG_ENDPOINT_TOKEN: ci-debug-token-not-for-production
  # ---- 应用地址（v0.0.4 实测补齐）----
  #
  # 此前 workflow 级 env 里**没有** APP_URL / NEXT_PUBLIC_APP_URL：
  #   · 服务端只能退回「请求自身的 origin」（src/lib/feed-builder.ts
  #     resolveBaseUrl、forgot-password 路由）—— 本身是安全回退；
  #   · 但反代场景下 origin 可能是内网地址，feed / 找回密码邮件里的
  #     绝对链接会变成内网地址。
  # 显式注入后，feed 的绝对链接与 E2E 的 LOCAL_BASE 保持一致。
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # ---- 临时凭据（每次运行随机，无任何真实价值）----
  POSTGRES_USER: v2ex
  POSTGRES_PASSWORD: ci-postgres-password-not-real
  POSTGRES_DB: v2ex_ci
  REDIS_PASSWORD: ci-redis-password-not-real
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_EMAIL: admin@ci.local
  SEED_ADMIN_PASSWORD: ci-admin-password-12345
  SEED_DEMO_USERS: '1'
  SEED_DEMO_PASSWORD: ci-demo-password-12345
  # ---- SMTP（v0.0.5 起：fake SMTP server；v0.0.8 改为独立进程）----
  #
  # 「忘记密码」全链路测试需要邮件**真的投递出去**，才能验证
  # 「邮件进箱 → 链接有效 → 改密 → 旧会话失效」这条链路。
  #
  # ⚠️ **CI 不需要（也不能）自己起 fake SMTP server** ——
  #     它由 `e2e/v005-password-reset-flow.spec.ts` 的 `beforeAll`
  #     以**独立进程**启动（v0.0.8：tests/helpers/fake-smtp-standalone.ts，
  #     经 e2e/smtp-fixture.ts 管理，stdout JSON-lines 事件驱动）。
  #     之所以是独立进程：v0.0.7 曾把它跑在 Playwright worker 进程内，
  #     与浏览器协议处理共用事件循环 ⇒ SMTP socket 事件被延迟 ⇒
  #     Linux 矩阵里「密码重置全链路」偶发超时（同一提交重跑即过）。
  #
  #     CI 侧只保留**服务端**要用的 SMTP 配置（发信目标 = fake server）。
  #
  # ⚠️ `SMTP_ALLOW_REAL_IN_TEST=1` 让 `sendMail()` 绕过内存 outbox，
  #    直达**生产** SMTP 实现（src/lib/mailer.ts 的 deliverViaSmtp）——
  #    只有隔离测试环境（APP_RUNTIME_ENV=test + TEST_ENV_ISOLATED=1）
  #    才允许这个开关生效，生产环境误配也无效。
  SMTP_ALLOW_REAL_IN_TEST: '1'
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: '3025'
  SMTP_FROM: noreply@v2ex-clone.local
  SMTP_SECURE: '0'
  # ---- 限流参数 ----
  #
  # 这里**必须用与生产一致的默认值**，不能为了「让测试快点跑完」而调高。
  # 有两条 E2E 用例专门验证限流生效：
  #   - e2e/auth.spec.ts「登录限流生效」：连续 15 次错误登录必须出现 429
  #   - e2e/topic.spec.ts「回复限流生效」：连续 30 次回复必须出现 429
  # 把阈值调高会让这两条用例永远等不到 429 而失败。
  # 测试之间的配额干扰由 clearRateLimits（调试端点）在每个用例前清理。
  RATE_LIMIT_LOGIN_MAX: '10'
  RATE_LIMIT_POST_MAX: '5'
  RATE_LIMIT_REPLY_MAX: '20'
  RATE_LIMIT_WINDOW_SECONDS: '60'
  RATE_LIMIT_REPLY_WINDOW_SECONDS: '120'
  RATE_LIMIT_CREATE_NODE_MAX: '10'
  RATE_LIMIT_CREATE_NODE_WINDOW_SECONDS: '60'
  # 注册限流：账号维度阈值保持默认（用于验证双维度限流），
  # IP 维度也用默认值 —— e2e/security-regression.spec.ts 的
  # 「同一 IP 换用户名批量注册会被 IP 维度限流拦截」用例
  # 最多尝试 40 次，IP 阈值必须 ≤ 40 才能观察到 429。
  # 用例之间由 clearRateLimits 清理配额，不会互相干扰。
  RATE_LIMIT_REGISTER_MAX: '5'
  RATE_LIMIT_REGISTER_IP_MAX: '20'
  RATE_LIMIT_REGISTER_WINDOW_SECONDS: '300'

jobs:
  # -------------------------------------------------------------------------
  # 1. 静态检查 + 单元测试
  # -------------------------------------------------------------------------
  unit:
    name: 类型检查 / 单元测试
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ci-postgres-password-not-real
          POSTGRES_DB: v2ex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2ex -d v2ex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ci-redis-password-not-real
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci-redis-password-not-real ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 前后端 API 契约校验
        # 扫描前端写死的 API 路径，与后端实际挂载的路由比对，
        # 防止「前端调了但后端没这个端点」的偏差静默存在。
        run: node scripts/ui-verify.cjs

      - name: 单元测试
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
          REDIS_URL: redis://:ci-redis-password-not-real@localhost:6379
        run: npx vitest run

      - name: 静态测试（不依赖数据库）
        # 语法护栏 + 观测能力单测（纯静态 / 纯内存）
        run: npx vitest run --config vitest.static.config.ts

      - name: 原地升级验证（v0.0.7 → v0.0.8）
        # ⚠️ v0.0.8 新增（任务书 §七「完成数据库升级、备份、恢复和回滚验证」）：
        #   · 用**旧迁移集**建库 → 灌探针数据 → 跑新迁移
        #   · 断言数据指纹**逐字节不变** + 迁移**幂等**（连跑 3 次）
        #   · 备份 → 恢复到临时库 → 断言指纹一致（回滚路径）
        #
        # 只操作脚本自建的库（v2ex_upgrade_v008_* 前缀），不碰任何其它库。
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: v2ex
          PGPASSWORD: ci-postgres-password-not-real
        run: |
          set -o pipefail
          bash scripts/release/verify-upgrade-v008.sh 2>&1 | tee /tmp/v008-upgrade.log

      - name: 上传升级验证日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-verification-${{ github.run_id }}
          path: |
            /tmp/v008-upgrade.log
            /tmp/v008-migrate*.log
          retention-days: 7
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # 2. E2E（真实启动应用 + Playwright）
  # -------------------------------------------------------------------------
  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ci-postgres-password-not-real
          POSTGRES_DB: v2ex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2ex -d v2ex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ci-redis-password-not-real
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci-redis-password-not-real ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 数据库迁移
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
        run: npx drizzle-kit migrate

      - name: 种子数据
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
        run: npx tsx scripts/seed.ts

      - name: 构建
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
        run: npx next build

      # ⚠️ v0.0.5 删除：此处原有「启动 fake SMTP server」步骤 —— **纯冗余，且有害**。
      #
      # 远端 CI 实测失败（run 42142762352，E2E job）：
      #   Error: listen EADDRINUSE: address already in use 127.0.0.1:3025
      #
      # 根因：当时 `e2e/v005-password-reset-flow.spec.ts` 的 `beforeAll`
      # 会自己起一个 fake SMTP server（默认端口 3025）。
      #
      # v0.0.8 起 beforeAll 改为起**独立进程**（经 e2e/smtp-fixture.ts），
      # 端口契约（SMTP_PORT === E2E_SMTP_PORT）在 beforeAll 里显式校验。
      # 本步骤保持删除状态；CI 只配服务端 SMTP 环境变量。

      - name: 启动应用
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
          REDIS_URL: redis://:ci-redis-password-not-real@localhost:6379
          # APP_URL / NEXT_PUBLIC_APP_URL 显式注入（v0.0.4 实测补齐）：
          # 此前 workflow 级 env 里没有这两个变量，服务端只能退回「请求自身的 origin」
          # （src/lib/feed-builder.ts resolveBaseUrl / forgot-password 路由）。
          # 退回逻辑本身是安全的，但显式注入可消除「反代后 origin 是内网地址」的歧义，
          # 并让 feed / 找回密码邮件里的绝对链接与 LOCAL_BASE 保持一致。
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          npx next start -p 3000 > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          # ⚠️ 就绪判定必须**校验 HTTP 状态码**，不能只看 curl 的退出码。
          #
          # 实测（v0.0.4）：`curl -sS -o /dev/null` 对 HTTP 500 / 502 同样返回**退出码 0**
          # （curl 默认不因状态码失败，只有 --fail 才会）。而 `/` 是 force-dynamic
          # （src/app/page.tsx 的 `export const dynamic = 'force-dynamic'`），
          # 会真的查数据库 —— 于是「应用已启动但数据库连不上」会返回 500，
          # 旧写法会把它当成「server ready」直接放行，E2E 随后大面积失败且**根因被掩盖**
          # （看起来像用例问题，实际是启动时序/连接问题）。
          #
          # 正确做法：要求状态码恰为 200。
          for i in $(seq 1 60); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000/ 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "server ready after ${i}s (HTTP ${CODE})"; break
            fi
            echo "  [${i}s] waiting... (HTTP ${CODE})"
            sleep 1
          done
          # 收尾再确认一次：这次用状态码判定，失败时打印服务端日志便于定位
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/ 2>/dev/null || echo 000)
          if [ "$CODE" != "200" ]; then
            echo "server failed to become ready (HTTP ${CODE})"
            echo "--- server log ---"
            tail -50 /tmp/server.log 2>/dev/null || true
            exit 1
          fi

      - name: E2E 测试
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_ci
          REDIS_URL: redis://:ci-redis-password-not-real@localhost:6379
          LOCAL_BASE: http://localhost:3000
          BROWSER_CHANNEL: chromium
          # 忘记密码全链路 E2E 需要连到本地 fake SMTP server
          E2E_SMTP_PORT: '3025'
        run: npx playwright test --reporter=list

      - name: 停止应用
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # -------------------------------------------------------------------------
  # 3. Docker 镜像真实构建 + 启动验证（P0-2 / P0-3 / P0-4）
  # -------------------------------------------------------------------------
  docker:
    name: Docker 构建与启动验证
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 构建镜像
        run: docker build -t v2ex-clone:ci .

      - name: 验证镜像内 public/ 存在（P0-4）
        run: |
          set -e
          docker run --rm --entrypoint sh v2ex-clone:ci -c \
            'test -d /app/public && echo "OK: /app/public exists"'
          # 干净克隆必须有 public/ —— 若缺失，COPY 会在构建阶段就失败
          docker run --rm --entrypoint sh v2ex-clone:ci -c \
            'ls -la /app/public'

      - name: 验证构建阶段不需要数据库（惰性初始化）
        run: |
          set -e
          # 构建期没有数据库。若 src/db/index.ts 在模块加载时就建连接池，
          # 这里会失败并报 DATABASE_URL is not set。
          docker build \
            --build-arg NODE_ENV=production \
            --target builder \
            -t v2ex-clone:builder-ci .
          echo "OK: builder 阶段在无数据库环境下构建成功"

      - name: 验证 compose 配置不暴露数据库端口（P0-3）
        run: |
          set -e
          # 用 docker compose config 渲染最终配置（不启动容器）
          cat > .env.ci <<'EOF'
          POSTGRES_USER=v2ex
          POSTGRES_PASSWORD=ci-postgres-password-not-real
          POSTGRES_DB=v2ex_ci
          REDIS_PASSWORD=ci-redis-password-not-real
          SESSION_SECRET=ci-only-session-secret-0123456789abcdef0123456789abcdef
          SEED_ADMIN_PASSWORD=ci-admin-password-12345
          EOF
          docker compose --env-file .env.ci config > /tmp/compose-rendered.yml
          echo "--- postgres/redis 是否暴露端口 ---"
          # postgres 与 redis 服务段内不应出现 "published"
          if grep -A 20 '^  postgres:' /tmp/compose-rendered.yml | grep -q 'published:'; then
            echo "✗ postgres 不应向宿主机暴露端口"; exit 1
          fi
          if grep -A 20 '^  redis:' /tmp/compose-rendered.yml | grep -q 'published:'; then
            echo "✗ redis 不应向宿主机暴露端口"; exit 1
          fi
          echo "OK: 默认配置未暴露数据库端口"

      - name: compose 真实启动 + 健康检查 + 重启不污染数据（P0-2）
        run: |
          set -e
          cat > .env.ci <<'EOF'
          POSTGRES_USER=v2ex
          POSTGRES_PASSWORD=ci-postgres-password-not-real
          POSTGRES_DB=v2ex_ci
          REDIS_PASSWORD=ci-redis-password-not-real
          SESSION_SECRET=ci-only-session-secret-0123456789abcdef0123456789abcdef
          SEED_ADMIN_PASSWORD=ci-admin-password-12345
          APP_PORT=3000
          APP_URL=http://localhost:3000
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          EOF
          docker compose --env-file .env.ci up -d --build

          echo "--- 等待应用就绪 ---"
          for i in $(seq 1 90); do
            if curl -sS -o /dev/null --max-time 5 http://localhost:3000/ 2>/dev/null; then
              echo "app ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -sS -o /dev/null --max-time 10 http://localhost:3000/ || {
            echo "--- compose logs ---"; docker compose --env-file .env.ci logs --tail 80; exit 1; }

          echo "--- 记录首次初始化后的数据状态 ---"
          ADMIN_HASH=$(docker compose --env-file .env.ci exec -T postgres \
            psql -U v2ex -d v2ex_ci -t -A -c \
            "select password_hash from users where username='admin'")
          TOPIC_COUNT=$(docker compose --env-file .env.ci exec -T postgres \
            psql -U v2ex -d v2ex_ci -t -A -c "select count(*) from topics")
          echo "topic_count=${TOPIC_COUNT}"

          echo "--- 重启容器（模拟重新部署）---"
          docker compose --env-file .env.ci restart app
          for i in $(seq 1 90); do
            if curl -sS -o /dev/null --max-time 5 http://localhost:3000/ 2>/dev/null; then
              echo "app ready after restart"; break
            fi
            sleep 1
          done
          curl -sS -o /dev/null --max-time 10 http://localhost:3000/ || {
            echo "--- compose logs ---"; docker compose --env-file .env.ci logs --tail 80; exit 1; }

          echo "--- 验证重新部署后数据未被污染 ---"
          ADMIN_HASH_AFTER=$(docker compose --env-file .env.ci exec -T postgres \
            psql -U v2ex -d v2ex_ci -t -A -c \
            "select password_hash from users where username='admin'")
          TOPIC_COUNT_AFTER=$(docker compose --env-file .env.ci exec -T postgres \
            psql -U v2ex -d v2ex_ci -t -A -c "select count(*) from topics")

          if [ "$ADMIN_HASH" != "$ADMIN_HASH_AFTER" ]; then
            echo "✗ 管理员口令在重新部署后被重置了 —— seed 仍在覆盖已有账号"; exit 1
          fi
          if [ "$TOPIC_COUNT" != "$TOPIC_COUNT_AFTER" ]; then
            echo "✗ 主题数在重新部署后发生变化 ($TOPIC_COUNT -> $TOPIC_COUNT_AFTER)"; exit 1
          fi
          echo "OK: 重新部署未重置管理员口令，未污染用户数据"

      - name: compose 日志
        if: always()
        run: docker compose --env-file .env.ci logs --tail 100 || true

      - name: 停止并清理
        if: always()
        run: docker compose --env-file .env.ci down -v || true
