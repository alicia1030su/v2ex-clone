name: Release

# ---------------------------------------------------------------------------
# v0.0.1 发布流水线
#
# 目标：把「代码检查 → 安全扫描 → 测试 → 镜像构建 → 部署验证 → 安装包
#       → 校验 → 发布 GHCR → Release → 远端核验」串成一条**失败即中止**的链。
#
# 三条硬规则：
#  1. 任一 job 失败，后续 job 一律不执行（靠 needs 的依赖图保证）
#  2. tag / Release 已存在时**立即失败**，绝不覆盖已发布版本的资产
#  3. 所有口令用随机值生成，并 `::add-mask::` 屏蔽，绝不进日志
#
# 触发：推送 v0.0.1 tag，或手动触发（手动触发时必须指定 version）
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，例如 v0.0.1'
        required: true
        type: string
      dry_run:
        description: '仅验证（不推送镜像、不创建 Release、不发布）'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 默认最小权限；各 job 按需提升
permissions:
  contents: read

env:
  NODE_VERSION: '22.23.4'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 隔离测试环境 —— 与 ci.yml 保持一致，绝不连接开发库或生产库
  APP_RUNTIME_ENV: test
  TEST_ENV_ISOLATED: '1'
  DISABLE_CAPTCHA: '1'
  ENABLE_DEBUG_ENDPOINTS: '1'

jobs:
  # ===========================================================================
  # 0. 前置检查 —— tag / Release 冲突检测
  # ===========================================================================
  preflight:
    name: 前置检查（版本冲突检测）
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号格式非法：$VERSION（应形如 v0.0.1）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "待发布版本：$VERSION"

      - name: 记录 dry-run 标志
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查远端 Tag 是否已存在
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION 已存在于远端。已发布版本的 tag 不可移动或覆盖，请手动处理。"
            exit 1
          fi
          echo "Tag $VERSION 未被占用 ✓"

      - name: 检查远端 Release 是否已存在
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $VERSION 已存在。禁止覆盖已发布版本的资产。"
            exit 1
          fi
          echo "Release $VERSION 未被占用 ✓"

      - name: 输出发布信息
        run: |
          echo "仓库    : ${{ github.repository }}"
          echo "版本    : ${{ steps.v.outputs.version }}"
          echo "提交 SHA: ${{ github.sha }}"
          echo "镜像    : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.version }}"

  # ===========================================================================
  # 1. 代码检查
  # ===========================================================================
  code-checks:
    name: 代码检查（类型 + 构建）
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: Next.js 生产构建
        run: npm run build

  # ===========================================================================
  # 2. 安全扫描
  # ===========================================================================
  security-scan:
    name: 安全扫描（依赖 + 秘密）
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 依赖漏洞扫描
        run: |
          set -euo pipefail
          # 高危以上视为阻塞；moderate 记录但不阻断（避免噪声导致发布被无意义卡住）
          if npm audit --audit-level=high; then
            echo "依赖扫描通过（无 high/critical 漏洞）"
          else
            echo "::error::存在 high/critical 级别依赖漏洞，发布中止"
            exit 1
          fi
          npm audit --json > npm-audit.json || true

      - name: 秘密扫描（gitleaks）
        uses: gitleaks/gitleaks-action@v2
        with:
          # 固定版本，不使用 latest
          version: v8.18.4
          args: '--detect-leaks=true --redact --no-banner --exit-code=1'

      - name: 发布包内容安全检查
        run: |
          set -euo pipefail
          fail=0
          # 1) 发布包不得包含生成的 .env
          if [ -f deploy/.env ]; then
            echo "::error::deploy/.env 存在 —— 生成的配置绝不能入库"
            fail=1
          fi
          # 2) 不得包含原站证据素材
          for pat in 'docs/evidence/html/' 'docs/evidence/assets/' 'ref-*.png' 'diff-*.png'; do
            if git ls-files | grep -qE "$pat"; then
              echo "::error::版本控制中存在原站素材：$pat"
              fail=1
            fi
          done
          # 3) deploy/ 内不得有明文口令
          #    键名允许驼峰/下划线（dbPassword、POSTGRES_PASSWORD、my_secret_key 都要覆盖），
          #    但凡整行出现 $ 变量引用（${VAR} / $VAR / $(cmd)）或为空值/占位符，均视为安全。
          #    判定逻辑经本地双向验证：能捕获 dbPassword="SuperSecret123!" 这类字面量，
          #    同时不误报 --requirepass ${REDIS_PASSWORD:?} 这类变量引用。
          KEY_RE='([A-Za-z_][A-Za-z0-9_]*)?(pass(word|wd)?|pwd|secret|token|api[_-]?key|credential)([A-Za-z0-9_]*)[[:space:]]*[:=][[:space:]]*(.*)$'
          hits="$(grep -rniE "$KEY_RE" deploy/ \
                   --include='*.sh' --include='*.ps1' --include='*.yml' --include='*.yaml' 2>/dev/null \
                 | grep -vE '\$[A-Za-z_{(]' \
                 | grep -vE 'Get-RandomHex|CHANGE_ME|PLACEHOLDER|example|EXAMPLE|Get-AdminPassword|random|Random' \
                 | grep -vE '[:=][[:space:]]*(""|'"''"'|)$' \
                 | grep . || true)"
          if [ -n "$hits" ]; then
            echo "::error::deploy/ 中存在疑似硬编码口令"
            echo "$hits"
            fail=1
          fi
          # 4) .env 系列文件不得入库（.env.example 除外）
          if git ls-files | grep -E '^\.env' | grep -v '\.env\.example$'; then
            echo "::error::存在被跟踪的环境文件"
            fail=1
          fi
          exit $fail

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: npm-audit.json
          retention-days: 7

  # ===========================================================================
  # 3. 单元测试
  # ===========================================================================
  unit-tests:
    name: 单元测试
    needs: [preflight, code-checks]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ${{ github.run_id }}-unit-test-password
          POSTGRES_DB: v2ex_release_unit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 数据库迁移
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-unit-test-password@localhost:5432/v2ex_release_unit
        run: npx drizzle-kit migrate

      - name: 运行单元测试
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-unit-test-password@localhost:5432/v2ex_release_unit
          SESSION_SECRET: ${{ github.run_id }}-release-unit-test-session-secret-32chars
          DEBUG_ENDPOINT_TOKEN: ${{ github.run_id }}-release-debug-token
        run: npx vitest run --reporter=junit --outputFile=unit-test-results.xml

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml
          retention-days: 7

  # ===========================================================================
  # 4. E2E 测试
  # ===========================================================================
  e2e-tests:
    name: E2E 测试
    needs: [preflight, code-checks]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ${{ github.run_id }}-e2e-test-password
          POSTGRES_DB: v2ex_release_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 数据库迁移
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
        run: npx drizzle-kit migrate

      - name: 初始化演示数据
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
          SESSION_SECRET: ${{ github.run_id }}-release-e2e-session-secret-32chars
          SEED_ADMIN_USERNAME: admin
          SEED_ADMIN_EMAIL: admin@example.com
          SEED_ADMIN_PASSWORD: ${{ github.run_id }}-Release-Test-Admin-2026
          SEED_DEMO_PASSWORD: ${{ github.run_id }}-Release-Test-Demo-2026
          SEED_DEMO_USERS: '1'
        run: npx tsx scripts/seed.ts

      - name: 启动应用
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
          SESSION_SECRET: ${{ github.run_id }}-release-e2e-session-secret-32chars
          DEBUG_ENDPOINT_TOKEN: ${{ github.run_id }}-release-debug-token
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
          DISABLE_CAPTCHA: '1'
          ENABLE_DEBUG_ENDPOINTS: '1'
          LOCAL_BASE: http://localhost:3000
          CI: 'true'
        run: |
          npx next start -p 3000 &
          echo "PID=$!"
          for i in $(seq 1 40); do
            sleep 3
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              echo "应用就绪"
              exit 0
            fi
          done
          echo "::error::应用在 120 秒内未就绪"
          exit 1

      - name: 运行 E2E
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
          SESSION_SECRET: ${{ github.run_id }}-release-e2e-session-secret-32chars
          DEBUG_ENDPOINT_TOKEN: ${{ github.run_id }}-release-debug-token
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
          DISABLE_CAPTCHA: '1'
          ENABLE_DEBUG_ENDPOINTS: '1'
          SEED_ADMIN_USERNAME: admin
          SEED_ADMIN_EMAIL: admin@example.com
          SEED_ADMIN_PASSWORD: ${{ github.run_id }}-Release-Test-Admin-2026
          SEED_DEMO_PASSWORD: ${{ github.run_id }}-Release-Test-Demo-2026
          LOCAL_BASE: http://localhost:3000
          CI: 'true'
        run: npx playwright test --reporter=line

      - name: 上传 E2E 失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ===========================================================================
  # 5. Docker 构建与推送 GHCR
  # ===========================================================================
  build-image:
    name: 构建并推送镜像
    needs: [preflight, code-checks, security-scan, unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.meta.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=sha-${{ github.sha }}
          # 刻意不生成 latest —— v0.0.1 是预览版，latest 会误导用户

      - uses: docker/setup-buildx-action@v3

      - name: 构建并推送
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=V2EX Clone
            org.opencontainers.image.description=独立的 V2EX 界面还原研究项目（非官方）
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 记录 digest
        run: |
          echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "镜像 digest: ${{ steps.push.outputs.digest }}"
          echo "标签: ${{ steps.meta.outputs.tags }}"

      - name: 核验镜像不含敏感文件
        run: |
          set -euo pipefail
          # 从镜像里抽查：不应有 .env 文件，也不应有原站证据目录
          if docker run --rm --entrypoint sh \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}" \
              -c 'ls -A /app | grep -qE "^\.env$" && echo FOUND_ENV && exit 1 || true'; then
            :
          fi
          if docker run --rm --entrypoint sh \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}" \
              -c 'test -d /app/docs/evidence/html && echo FOUND_EVIDENCE && exit 1 || true'; then
            :
          fi
          echo "镜像内容检查通过 ✓"

  # ===========================================================================
  # 6. 部署验证（真实启动 + 持久化）
  # ===========================================================================
  deploy-verify:
    name: 部署验证（启动 + 重启持久化）
    needs: [preflight, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成随机凭据（不打印明文）
        id: creds
        run: |
          set -euo pipefail
          PG_PASS="$(openssl rand -base64 24 | tr -d '\n/+= ' | cut -c1-28)"
          REDIS_PASS="$(openssl rand -base64 24 | tr -d '\n/+= ' | cut -c1-28)"
          SESSION="$(openssl rand -base64 32 | tr -d '\n/+= ' | cut -c1-48)"
          ADMIN_PASS="$(openssl rand -base64 18 | tr -d '\n/+= ' | cut -c1-20)Aa1"
          {
            echo "::add-mask::$PG_PASS"
            echo "::add-mask::$REDIS_PASS"
            echo "::add-mask::$SESSION"
            echo "::add-mask::$ADMIN_PASS"
          } >> "$GITHUB_ENV"
          echo "PG_PASS=$PG_PASS"      >> "$GITHUB_ENV"
          echo "REDIS_PASS=$REDIS_PASS" >> "$GITHUB_ENV"
          echo "SESSION=$SESSION"      >> "$GITHUB_ENV"
          echo "ADMIN_PASS=$ADMIN_PASS" >> "$GITHUB_ENV"
          echo "随机凭据已生成并屏蔽 ✓"

      - name: 准备发布版 compose 配置
        run: |
          set -euo pipefail
          cp deploy/docker-compose.yml ./docker-compose.release.yml
          cat > .env.release <<EOF
          V2EX_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}
          APP_PORT=3000
          APP_URL=http://localhost:3000
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          APP_RUNTIME_ENV=production
          POSTGRES_USER=v2ex
          POSTGRES_DB=v2ex
          POSTGRES_PASSWORD=${PG_PASS}
          REDIS_PASSWORD=${REDIS_PASS}
          SESSION_SECRET=${SESSION}
          SEED_ADMIN_USERNAME=admin
          SEED_ADMIN_EMAIL=admin@example.com
          SEED_ADMIN_PASSWORD=${ADMIN_PASS}
          SEED_DEMO_USERS=0
          EOF
          chmod 600 .env.release

      - name: 首次启动
        run: |
          set -euo pipefail
          docker compose -f docker-compose.release.yml --env-file .env.release up -d
          for i in $(seq 1 40); do
            sleep 3
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              echo "应用就绪"
              exit 0
            fi
          done
          echo "::error::容器启动超时"
          docker compose -f docker-compose.release.yml --env-file .env.release logs --tail=100
          exit 1

      - name: 验证数据持久化（写入 → 重启 → 校验）
        run: |
          set -euo pipefail
          # 用 API 写一条可校验的数据（注册用户）
          curl -sf -X POST http://localhost:3000/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"username":"persist-check","email":"persist@example.com","password":"Persist-Check-2026"}' \
            -o /tmp/signup.json -w '%{http_code}' > /tmp/code.txt || true
          echo "注册接口返回：$(cat /tmp/code.txt)"
          docker compose -f docker-compose.release.yml --env-file .env.release restart app
          for i in $(seq 1 40); do
            sleep 3
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then break; fi
          done
          # 重启后该用户应仍存在
          if docker compose -f docker-compose.release.yml --env-file .env.release exec -T postgres \
               psql -U v2ex -d v2ex -t -c "select count(*) from users where username='persist-check';" \
             | grep -qE '^\s*1\s*$'; then
            echo "✓ 重启后数据保留验证通过"
          else
            echo "::error::重启后数据丢失"
            docker compose -f docker-compose.release.yml --env-file .env.release logs --tail=100
            exit 1
          fi

      - name: 验证数据库与 Redis 端口未暴露
        run: |
          set -euo pipefail
          # compose 内 postgres/redis 未声明 ports，宿主机不应能直连
          if docker compose -f docker-compose.release.yml --env-file .env.release port postgres 5432 2>/dev/null | grep -q .; then
            echo "::error::PostgreSQL 端口暴露到宿主机"
            exit 1
          fi
          if docker compose -f docker-compose.release.yml --env-file .env.release port redis 6379 2>/dev/null | grep -q .; then
            echo "::error::Redis 端口暴露到宿主机"
            exit 1
          fi
          echo "✓ 数据库与 Redis 未暴露端口"

      - name: 收集容器日志
        if: always()
        run: docker compose -f docker-compose.release.yml --env-file .env.release logs --tail=200 > deploy-logs.txt || true

      - name: 上传部署验证日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-verify-logs
          path: deploy-logs.txt
          retention-days: 7

      - name: 清理
        if: always()
        run: docker compose -f docker-compose.release.yml --env-file .env.release down || true

  # ===========================================================================
  # 7. 生成安装包
  # ===========================================================================
  package:
    name: 生成安装包
    needs: [preflight, build-image, deploy-verify]
    runs-on: ubuntu-latest
    outputs:
      zip_name: ${{ steps.pkg.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 打包 deploy/ 目录
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          ZIP="v2ex-clone-${VERSION}-deploy.zip"
          # 明确排除生成的配置与备份目录（.gitignore 已排除，这里显式再挡一次）
          zip -r "$ZIP" deploy/ \
            -x 'deploy/.env' \
               'deploy/INSTALL_CREDENTIALS.txt' \
               'deploy/backups/*' \
               'deploy/*.log'
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum "$ZIP_NAME" > SHA256SUMS
          cat SHA256SUMS

      - name: 校验安装包内容完整性
        run: |
          set -euo pipefail
          REQUIRED="docker-compose.yml .env.example install.sh install.ps1 start.sh stop.sh update.sh backup.sh README.md INSTALL.md VERSION LICENSE"
          rm -rf /tmp/verify-zip && mkdir -p /tmp/verify-zip
          unzip -q "$ZIP_NAME" -d /tmp/verify-zip
          missing=0
          for f in $REQUIRED; do
            if [ ! -f "/tmp/verify-zip/deploy/$f" ]; then
              echo "::error::安装包缺少必需文件：$f"
              missing=1
            fi
          done
          # 不得包含生成的 .env
          if [ -f /tmp/verify-zip/deploy/.env ]; then
            echo "::error::安装包内含 deploy/.env"
            missing=1
          fi
          # 不得包含原站素材
          if find /tmp/verify-zip -name 'ref-*.png' -o -name 'diff-*.png' | grep -q .; then
            echo "::error::安装包内含原站素材"
            missing=1
          fi
          exit $missing

      - name: 上传安装包与校验和
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS
          retention-days: 30

  # ===========================================================================
  # 8. 发布 Release
  # ===========================================================================
  publish-release:
    name: 创建并发布 Release
    needs: [preflight, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: release-package

      - name: 再次检查冲突（防止竞态）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $VERSION 已存在（竞态），中止发布"
            exit 1
          fi

      - name: 生成中文 Release Notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## v0.0.1 — 开发预览版（Pre-release）

          > ⚠️ **这是早期开发预览版，不是稳定版。**
          > 功能尚未完备，**不保证与 V2EX 完全一致**，**不建议直接用于生产环境**。

          ### 关于本项目

          本项目是对 `https://www.v2ex.com/` 的**技术研究与高保真界面还原实验**，
          与 V2EX 官方**无任何关联**、**未获官方授权**、**不是** V2EX 官方产品。
          MIT 许可证**不授予** V2EX 商标使用许可。

          ### 本版本已实现

          - **账号**：注册、登录、退出、会话保持、修改密码
          - **用户**：个人主页
          - **节点**：列表、详情、子节点树、创建（管理员直生效 / 版主待审）
          - **主题**：发布、列表、详情、浏览计数、Markdown 渲染
          - **回复**：发布、楼层号分配、感谢数、分页
          - **收藏 / 通知 / 搜索**
          - **后台管理**：概览、待审、日志
          - **权限**：user / moderator / admin 三级角色
          - **安全**：CSRF 防护、XSS 清洗、限流、开放重定向防护、安全响应头、
            服务端 SVG 验证码（哈希存储、一次性）
          - **存储**：PostgreSQL 17 持久化（Drizzle 迁移），Redis 可选（缺失自动降级）
          - **部署**：Docker 多阶段镜像 + Compose 三阶段启动（迁移 → 首次初始化 → 启动）

          ### 本版本未实现

          以下功能**本版本没有实现**，界面中不会出现对应入口：

          - 主题编辑与删除
          - 感谢（thank）功能
          - 关注用户
          - 积分排行榜
          - RSS 输出
          - 邮件找回密码
          - 主题标签 / 附件上传 / 私信 / 头像上传

          ### 安装

          **Linux / macOS**
          ```bash
          unzip v2ex-clone-v0.0.1-deploy.zip
          cd v2ex-clone-v0.0.1-deploy/deploy
          chmod +x install.sh
          ./install.sh
          ```

          **Windows（PowerShell）**
          ```powershell
          Expand-Archive -Path v2ex-clone-v0.0.1-deploy.zip -DestinationPath .
          cd v2ex-clone-v0.0.1-deploy\deploy
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          ```

          安装完成后访问 <http://localhost:3000>。
          安装脚本会生成随机的数据库口令、Redis 口令与会话密钥，
          并把管理员凭据写入 `INSTALL_CREDENTIALS.txt`（权限 600）。

          ### 系统要求

          - Docker 20.10 或更高
          - Docker Compose v2
          - 至少 2 GB 可用磁盘
          - 端口 3000 未被占用

          ### 镜像

          ```
          ghcr.io/alicia1030su/v2ex-clone:v0.0.1
          ```

          ### 安全提示

          - **安装后请立即登录并修改管理员密码。**
          - 不要在公网环境使用默认端口 3000，建议通过反向代理并启用 HTTPS。
          - `docker compose stop` 与 `update.sh` **不会**删除数据卷；
            `docker compose down -v` 会**永久删除**数据，请务必先备份。

          ### 许可证

          MIT（附商标声明与第三方内容声明），详见安装包内的 `LICENSE`。
          NOTES

      - name: 创建 Release（先 draft）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION — 开发预览版" \
            --notes-file release-notes.md \
            --prerelease \
            --draft \
            --target "${{ github.sha }}" \
            "${{ needs.package.outputs.zip_name }}" \
            SHA256SUMS
          echo "Draft Release 已创建"

      - name: 核验 draft 资产后正式发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          ASSETS="$(gh release view "$VERSION" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          echo "已上传资产："
          echo "$ASSETS"
          echo "$ASSETS" | grep -q "v2ex-clone-${VERSION}-deploy.zip" || { echo "::error::缺少安装包"; exit 1; }
          echo "$ASSETS" | grep -q "SHA256SUMS" || { echo "::error::缺少 SHA256SUMS"; exit 1; }
          # 资产齐全 → 从 draft 转为正式发布
          gh release edit "$VERSION" --repo "${{ github.repository }}" --draft=false
          echo "Release 已正式发布"

  # ===========================================================================
  # 9. 远端只读核验
  # ===========================================================================
  verify-release:
    name: 远端核验（匿名视角）
    needs: [preflight, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: 下载安装包用于核验
        uses: actions/download-artifact@v4
        with:
          name: release-package

      - name: 匿名核验 Release 与资产
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          REPO="${{ github.repository }}"
          # 匿名请求（不带 Authorization 头）—— 模拟普通用户
          CODE=$(curl -s -o /tmp/rel.json -w '%{http_code}' \
            -H 'Authorization:' "https://api.github.com/repos/$REPO/releases/tags/$VERSION")
          if [ "$CODE" != "200" ]; then
            echo "::error::匿名访问 Release API 返回 $CODE（普通用户打不开）"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/rel.json', encoding='utf-8'))
          if d.get('draft'):
              print('::error::Release 仍是 draft'); sys.exit(1)
          if not d.get('prerelease'):
              print('::error::Release 未标记 prerelease'); sys.exit(1)
          names = [a['name'] for a in d.get('assets', [])]
          print('资产清单:', names)
          if not any('deploy.zip' in n for n in names):
              print('::error::缺少安装包'); sys.exit(1)
          if 'SHA256SUMS' not in names:
              print('::error::缺少 SHA256SUMS'); sys.exit(1)
          print('Release 状态核验通过 ✓')
          PY

      - name: 实际下载安装包并校验 SHA256
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          REPO="${{ github.repository }}"
          URL="https://github.com/$REPO/releases/download/$VERSION/v2ex-clone-${VERSION}-deploy.zip"
          curl -sL -o /tmp/downloaded.zip "$URL"
          SIZE=$(stat -c%s /tmp/downloaded.zip)
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::下载到的安装包过小（$SIZE 字节）"
            exit 1
          fi
          echo "下载大小：$SIZE 字节"
          # 用远端 SHA256SUMS 校验
          curl -sL -o /tmp/SHA256SUMS \
            "https://github.com/$REPO/releases/download/$VERSION/SHA256SUMS"
          cd /tmp
          # SHA256SUMS 里记录的是原始文件名
          mv downloaded.zip "v2ex-clone-${VERSION}-deploy.zip"
          sha256sum -c SHA256SUMS
          echo "✓ 安装包 SHA256 校验通过"
          # 解压确认结构完整
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          unzip -q "v2ex-clone-${VERSION}-deploy.zip" -d /tmp/verify
          ls /tmp/verify/deploy/
          test -f /tmp/verify/deploy/install.sh
          test -f /tmp/verify/deploy/install.ps1
          echo "✓ 安装包结构完整"

      - name: 匿名核验 GHCR 镜像可拉取
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"
          docker logout "${{ env.REGISTRY }}" 2>/dev/null || true
          if docker pull "$IMAGE"; then
            echo "✓ 匿名拉取成功：$IMAGE"
            docker image inspect "$IMAGE" --format 'Digest: {{index .RepoDigests 0}}'
          else
            echo "::error::GHCR 镜像无法匿名拉取 —— 需要把包设为 Public 后才能供普通用户使用"
            exit 1
          fi

      - name: 核验 Release 网页可打开
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          CODE=$(curl -sL -o /dev/null -w '%{http_code}' \
            "https://github.com/${{ github.repository }}/releases/tag/$VERSION")
          echo "Release 页面 HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::Release 页面不可访问"; exit 1; }
