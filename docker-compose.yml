# ---------------------------------------------------------------------------
# V2EX Clone — Docker Compose 部署配置
#
# 安全说明：
#  1. 所有凭据均无默认值。未在 .env 中设置的必需变量会让容器直接启动失败，
#     避免以弱口令运行生产实例。
#  2. **默认不向宿主机暴露 PostgreSQL 与 Redis 端口**（P0-3）。
#     数据库与缓存只在 compose 内部网络（v2ex-net）可达，
#     宿主机上的任何进程都无法直连它们。
#     需要本地直连数据库做调试时，用 override 文件显式开启：
#       docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:17-alpine
    container_name: v2ex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    # 默认不对宿主机暴露端口（见文件头说明）。
    # 需要本地调试时用 docker-compose.debug.yml 显式开启。
    networks:
      - v2ex-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: v2ex-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
    # 默认不对宿主机暴露端口（见文件头说明）。
    networks:
      - v2ex-net
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:?}',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v2ex-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_RUNTIME_ENV: ${APP_RUNTIME_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-0}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_POST_MAX: ${RATE_LIMIT_POST_MAX:-5}
      RATE_LIMIT_REPLY_MAX: ${RATE_LIMIT_REPLY_MAX:-20}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_REPLY_WINDOW_SECONDS: ${RATE_LIMIT_REPLY_WINDOW_SECONDS:-120}
      RATE_LIMIT_CREATE_NODE_MAX: ${RATE_LIMIT_CREATE_NODE_MAX:-10}
      RATE_LIMIT_CREATE_NODE_WINDOW_SECONDS: ${RATE_LIMIT_CREATE_NODE_WINDOW_SECONDS:-60}
      RATE_LIMIT_REGISTER_MAX: ${RATE_LIMIT_REGISTER_MAX:-5}
      RATE_LIMIT_REGISTER_IP_MAX: ${RATE_LIMIT_REGISTER_IP_MAX:-20}
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:-300}
      # 生产环境强制关闭调试端点与验证码绕过
      ENABLE_DEBUG_ENDPOINTS: '0'
      DEBUG_ENDPOINT_TOKEN: ''
      DISABLE_CAPTCHA: '0'
      TEST_ENV_ISOLATED: '0'
    ports:
      - '${APP_PORT:-3000}:3000'
    networks:
      - v2ex-net

volumes:
  postgres-data:
  redis-data:

# 内部网络：数据库与缓存只在这张网内可达，不对宿主机暴露。
networks:
  v2ex-net:
    driver: bridge
