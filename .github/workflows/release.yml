name: Release

# ---------------------------------------------------------------------------
# v0.0.1 发布流水线
#
# 目标：把「冲突检查 → 代码检查 → 安全扫描 → 单元测试 → E2E → 构建镜像
#       → 部署验证 → 打包 → 发布 Release → 远端核验」串成一条**失败即中止**的链。
#
# 三条硬规则：
#  1. 任一 job 失败，后续 job 一律不执行（靠 needs 依赖图保证，无 continue-on-error）
#  2. tag / Release 已存在时**立即失败**，绝不覆盖已发布版本的资产
#  3. 所有口令随机生成并 `::add-mask::` 屏蔽，绝不进日志
#
# 触发：
#  - push tag v0.0.1（正式发布路径）
#  - workflow_dispatch（手动重跑；dry_run=true 时只验证不发布）
#
# ## v0.0.9：发布形态的**三态**（由 preflight 的 meta step 统一判定，
#    下游一律读 needs.preflight.outputs，不再各自去读 inputs）
#
#   | dry_run | publish | 结果 |
#   |---|---|---|
#   | true    | （任意） | 干跑：不推镜像、不建 Release、不发布 |
#   | false   | false   | 只建 Draft（资产齐全，但匿名不可下载） |
#   | false   | true    | 公开 Pre-release（强制 prerelease=true、--latest=false） |
#
# - **tag push ⇒ publish=true**：Tag 白名单（on.push.tags）是「人工确认
#   该版本允许公开发布」的摩擦点 —— 每次发版都必须有人把版本号手动加进
#   白名单，tag 一旦推上来就表示公开发布已获确认，不应再停在 Draft。
#   修复前 publish-release 读 `inputs.publish`，而 tag push 没有 dispatch
#   inputs ⇒ 恒为 false ⇒ **永远只建 Draft，没有可靠的公开发布入口**；
#   而「先建 Draft、再 dispatch publish=true」又会被 preflight 的
#   「Release 已存在（含 Draft）⇒ 中止」挡死，两条路都不通。
# - workflow_dispatch ⇒ publish 取输入值；publish=false 时停在 Draft。
#
# ## B2：幂等「转公开」补救路径（任务书 §八「不移动 Tag 的合法修复流程」）
#
# 场景：Tag 已创建且不可移动，但发布流水线在「已建 Draft + 资产齐全、
# 尚未转公开」时失败。此时既不能删/移动 Tag，也不能删 Release 重建。
# 修法：用 **workflow_dispatch + publish=true** 重跑（不新增 input）——
#   preflight 查到同版本 Release 仍是 Draft ⇒ 放行并打印 notice；
#   publish-release 跳过「创建 Release / 上传资产」（避免同名资产冲突），
#   只做资产清单核验 → 重新读状态确认仍是 Draft → 转公开。
# 边界：
#   · 不移动 Tag、不删 Release、不覆盖任何已公开资产；
#   · Release 已公开 ⇒ fail-closed 中止；Release 查询失败 ⇒ fail-closed 中止；
#   · 转公开前再次读状态，若已被别的 run 转成「已公开 + Pre-release」
#     且资产齐全 ⇒ 直接「无需变更」成功结束（幂等，不重复 edit）。
#
# ---------------------------------------------------------------------------
# Action 版本说明（重要，2026-11-03 实测）
#
# GitHub 已于 2026-09-23 移除 runner 上的 Node 20 运行时，且
# ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION 退避开关**同时失效**。
# 仍声明 runs.using: node20 的 Action 会在启动阶段直接失败。
# 逐个核验 action.yml 的 runs.using 后，本文件一律使用已迁移到 node24 的版本：
#
#   actions/checkout@v4            -> node20  ✗   改用 @v7   (node24)
#   actions/setup-node@v4          -> node20  ✗   改用 @v7   (node24)
#   actions/upload-artifact@v4     -> node20  ✗   改用 @v7   (node24)
#   actions/download-artifact@v4   -> node20  ✗   改用 @v8   (node24)
#   docker/setup-buildx-action@v3  -> node20  ✗   改用 @v4   (node24)
#   docker/login-action@v3         -> node20  ✗   改用 @v4   (node24)
#   docker/metadata-action@v5      -> node20  ✗   改用 @v6   (node24)
#   docker/build-push-action@v6    -> node20  ✗   改用 @v7   (node24)
#   gitleaks/gitleaks-action@v2    -> node20  ✗   改用 @v3   (node24)
#
# 注意 gitleaks 的版本号体系有两层：
#   - Action 版本：v2 / v3（随 Node 运行时迁移）
#   - CLI 版本：8.18.4（通过环境变量 GITLEAKS_VERSION 指定，**不带 v 前缀**）
#   - v2 的 `with: version:` 输入在 v3 已移除，必须改用环境变量。
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      # 发布 tag 是**唯一**的正式发布触发入口。
      #
      # 为什么用白名单而不是 'v*'：
      #   'v*' 会把任意形如 vX.Y.Z 的 tag 都变成发布触发器。只要有人
      #   （含外部贡献者）能推 tag，就能触发整条发布流水线 —— 而流水线
      #   里带着 packages:write 与 contents:write。
      #   改成显式白名单后，未列入的 tag 根本不会触发任何 job。
      #
      # ⚠️ 每次发版都必须手动把新版本号加到这里 —— 这是**刻意的摩擦**，
      #    让「新增 tag = 新发布」这件事必须经过人的确认。
      - 'v0.0.2'
      - 'v0.0.3'
      - 'v0.0.4'
      # ⚠️ v0.0.9：授权公开发布 Pre-release（一次性风险接受，R-01 维持 DEFERRED）
      - 'v0.0.9'
      # ⚠️ v0.0.10：白名单里**有**这一行 ≠ 已发布。
      #    真正触发发布的是「有人把 v0.0.10 tag 推上来」这个动作本身。
      #    本行由版本载体同步时加入，保证「Tag → 流水线」这条链在最终 SHA 上就绪，
      #    而不是等到发布当天再改一次代码（那会改变已固定的发行 SHA）。
      #    R-01 仍需本版本的单独裁决 —— 见 docs/RISK_DECISION_v0.0.10.md。
      - 'v0.0.10'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，例如 v0.0.3'
        required: true
        type: string
      dry_run:
        description: '仅验证（不推送镜像、不创建 Release、不发布）'
        required: false
        # ⚠️ N1：必须声明 boolean。之前没有 type ⇒ 输入按字符串处理，
        #    只要填了 "True" / "TRUE" 之类，下游 == 'true' 就判成 false
        #    ⇒ **fail-open 到正式发布**（干跑承诺失效）。
        type: boolean
        default: true
      publish:
        description: '是否将 Release 从 Draft 转为公开状态。默认 false（保持 Draft，待风险决策）'
        required: false
        type: boolean
        default: false
      prerelease:
        description: |
          公开后的 Release 类型。
          · true  = Pre-release（公开可下载，但标记为「非稳定版」）—— v0.0.9 用这个
          · false = 稳定版（**本项目 0.0.x 全部是早期开发预览版，不应发稳定版**）
          仅在 publish=true 时生效。
        required: false
        type: boolean
        default: true

concurrency:
  # ⚠️ v0.0.9：**版本号必须进 group**。
  #   原写法 release-${{ github.ref }} 下，所有 workflow_dispatch 都落在
  #   master 这同一个 ref 上 ⇒ 不同版本的发布互相排队（v0.0.3 的重跑会
  #   占用 v0.0.9 发布的并发槽），而 tag push 又各自成组 ⇒ 语义不一致。
  #   纳入 version 后：同版本串行、不同版本互不阻塞。
  #   group 只按版本号（不再拼 github.ref）：tag push 的 ref 是
  #   refs/tags/<version>，dispatch 的 ref 是 master；若两者都进 group，
  #   同一版本的正式发布与补救重跑会落进不同组 ⇒ 并发覆盖无法阻止。
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  # 不允许取消进行中的发布：中途取消会留下「镜像已推、Release 未建」的半成品状态
  cancel-in-progress: false

# 默认最小权限；各 job 按需提升
permissions:
  contents: read

env:
  NODE_VERSION: '22.23.4'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 隔离测试环境 —— 与 ci.yml 保持一致，绝不连接开发库或生产库
  APP_RUNTIME_ENV: test
  TEST_ENV_ISOLATED: '1'
  DISABLE_CAPTCHA: '1'
  ENABLE_DEBUG_ENDPOINTS: '1'
  # ---- 应用地址（v0.0.9 补齐）----
  #
  # 此前 release.yml 缺这两个变量 ⇒ 找回密码邮件**fail-closed**
  # （未配置 PUBLIC_BASE_URL / APP_URL 就拒绝发送）⇒ 邮件根本不发
  # ⇒ `v005-password-reset-flow.spec.ts` 必然失败
  # （实测 run 42378085346：「20000ms 内未收到邮件（已收到 0 封）」）。
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # ---- 测试用假 SMTP（v0.0.9 补齐）----
  #
  # 应用与测试进程**必须**指向同一个端口（契约由 spec 的 beforeAll 显式校验）。
  # 目标端口是 spec 自己起的**本地 fake SMTP server**（真实 TCP + 真实 SMTP 协议），
  # 绝不会投递到任何真实收件人。
  SMTP_ALLOW_REAL_IN_TEST: '1'
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: '3025'
  E2E_SMTP_PORT: '3025'
  SMTP_FROM: noreply@v2ex-clone.local
  SMTP_SECURE: '0'

jobs:
  # ===========================================================================
  # 0b. resolve-tag —— 解析远端 tag 指向的 commit（**单一事实来源**）
  # ===========================================================================
  #
  # ## 为什么单独抽一个 job
  #
  # 解析「远端 tag 指向哪个 commit」这件事，流水线上有多处要用：
  #   - preflight：校验 tag 指向没变（push 路径）/ 补救路径判定（dispatch 路径）
  #   - publish-release：竞态检查 + Release 的 --target
  #   - deploy-verify：确认 tag 存在
  #
  # 若每处都自己查，会重复代码；而**用 git 查是不可靠的** ——
  # `publish-release` 与 `deploy-verify` 未必有 checkout（没有 `.git`、
  # 没有 `origin` remote），`git ls-remote origin` 会直接报
  # `fatal: 'origin' does not appear to be a git repository`（exit 128）。
  # 实测踩到：run `41962239958` 的「创建并发布 Release」job 就死在这里。
  #
  # 本 job 用 `gh api`（只依赖 `GH_TOKEN` 与仓库名）解析，
  # 结果通过 output 传给下游 —— **单一事实来源，且不依赖任何 job 的 checkout**。
  #
  # annotated tag 需要**两级解引用**：
  #   refs/tags/v0.0.4 → tag object (aed641d…) → commit (c0e7396…)
  # 轻量 tag 则第一级就直接是 commit。
  resolve-tag:
    name: 解析版本锚点（tag → commit）
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      exists: ${{ steps.r.outputs.exists }}
    steps:
      - name: 解析
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          REF_JSON="$(gh api "repos/${{ github.repository }}/git/ref/tags/$VERSION" 2>/dev/null || true)"
          SHA=""
          if [ -n "$REF_JSON" ]; then
            SHA="$(printf '%s' "$REF_JSON" | python3 -c "
          import json,sys
          try:
              print(json.load(sys.stdin).get('object', {}).get('sha',''))
          except Exception:
              print('')
          " 2>/dev/null)"
            TYPE="$(printf '%s' "$REF_JSON" | python3 -c "
          import json,sys
          try:
              print(json.load(sys.stdin).get('object', {}).get('type',''))
          except Exception:
              print('')
          " 2>/dev/null)"
            # annotated tag ⇒ 再解引用一层拿 commit
            if [ "$TYPE" = "tag" ] && [ -n "$SHA" ]; then
              SHA="$(gh api "repos/${{ github.repository }}/git/tags/$SHA" 2>/dev/null | python3 -c "
          import json,sys
          try:
              print(json.load(sys.stdin).get('object', {}).get('sha',''))
          except Exception:
              print('')
          " 2>/dev/null)"
            fi
          fi
          if [ -n "$SHA" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # ⚠️ v0.0.4：两条分支**都必须**写 `sha` output。
            #   此前只有「tag 不存在」分支写了 `sha=`，
            #   导致 tag 存在时 `steps.r.outputs.sha` 求值为**空字符串** ——
            #   而下游（preflight 的 push 路径校验、tag_sha output、
            #   publish-release 的竞态检查）全靠它 ⇒ 全部拿到空值 ⇒ 红灯。
            #   （该缺陷由静态审查发现：`resolve-tag` 从未真实跑过。）
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION 指向 $SHA"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION 不存在"
          fi

  # ===========================================================================
  # 1. preflight —— 版本冲突检测（幂等性闸门）
  # ===========================================================================
  preflight:
    name: 前置检查（版本冲突检测）
    needs: [resolve-tag]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      # ⚠️ v0.0.9：publish / prerelease 的**单一事实来源**。
      #   修复前 publish-release 与 verify-release 各自直接读
      #   `inputs.publish`：tag push 没有 dispatch inputs ⇒ 恒为空/false，
      #   导致「只建 Draft + 跳过匿名核验」，且没有可用的公开发布入口。
      #   现在由 meta step 按事件类型统一算好，下游只读这两个 output。
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      # v0.0.4：Release 的 target commit。
      # tag 触发时 = tag 指向的 commit（= github.sha）；
      # 手动「补救路径」时 = 远端 tag 指向的 commit（github.sha 是触发分支的 commit，不对）。
      tag_sha: ${{ needs.resolve-tag.outputs.sha }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # ⚠️ v0.0.4：从 **master** 检出，而不是 tag 指向的 commit。
          #
          # ## 为什么
          #
          # 规约要求「同一版本号不得反复删除、重建或移动 Tag」，
          # 而「删除或移动既有 Tag」属需主人**单独授权**的高风险操作。
          # 于是当发布流水线自身有缺陷（需要修 `release.yml` 或测试代码）时，
          # 就陷入死锁：
          #   - Tag 已存在且指向旧 commit → 流水线拿不到修复后的代码 → 继续红；
          #   - 移动 Tag → 违反规约、需额外授权。
          #
          # 本项把「**构建用的代码**」与「**版本锚点**」解耦：
          #   - 版本锚点（Tag）保持不动 → 满足「Tag 不可移动」的规约；
          #   - 构建用的代码取 master（已含修复）→ 流水线能跑通。
          #
          # ## 安全性论证（重要 —— 请勿省略）
          #
          # 1. **发布包内容不受影响**：本项只改「代码从哪检出」，
          #    不改「打包哪些文件」。若 master 与 tag 指向的 commit 在
          #    `deploy/` / `src/` / `package.json` 上有差异，
          #    打包产物就会不同 —— 所以必须保证两者在这三处**零差异**。
          #    v0.0.4 实测：`git diff v0.0.4 origin/master -- deploy/ src/ package.json`
          #    **输出为空** ⇒ 发布包逐字节一致。
          # 2. **Tag 指向校验仍然有效**：`github.sha` 在 tag 触发时是
          #    tag 指向的 commit，与 checkout 的 `ref` 无关 ⇒
          #    「tag 指向 == 构建 commit」这道校验**照常生效**，
          #    依然能挡住「Tag 被移动到别处」的情况。
          # 3. **Release 的 target 是「版本锚点指向的 commit」** ⇒ 由 preflight 的
          #    `tag_sha` output 提供（tag 触发时它 == `github.sha`；
          #    手动补救路径时它是远端 tag 指向的 commit）。
          #    Release 始终指向 Tag 指向的 commit，语义不变。
          #
          # ⚠️ 若将来某次 master 与 tag 的 `deploy/` / `src/` 出现差异，
          #    本项会产出与 Tag 不一致的包 —— 那时应当**停下并请主人裁决**
          #    （移动 Tag 需要授权；不移动则应改走 workflow_dispatch）。
          #
          # ## v0.0.9 修正：**tag push 不再取 master**
          #
          # 上面的 v0.0.4 论证只对「补救路径 / 干跑」成立：那时流水线自身
          # 需要 master 上的修复，而 Tag 又不能移动，才必须解耦。
          # 但**正式 tag push** 时 Tag 指向的就是本次构建 commit，
          # 取 master 反而会在 master 前进时产出与 Tag 不符的 ZIP / 镜像
          # （任务书要求发布资产精确对应 Tag）。
          #
          # ⇒ tag push 固定到 `github.sha`；workflow_dispatch 仍取 master
          #   （保留补救 / 干跑路径的能力）。全部 8 个 job 必须用同一个表达式，
          #   否则各 job 拿到的代码不一致。preflight 另加
          #   「origin/master == github.sha」硬闸门，master 前进即中止。
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}

      - name: 确定版本号
        id: v
        env:
          # ⚠️ N1：inputs 一律经 env 传递，绝不直接插值进 shell 源码。
          #    `version` 是 workflow_dispatch 的自由文本输入，直插会造成命令注入。
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号格式非法：$VERSION（应形如 v0.0.1）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "待发布版本：$VERSION"

      - name: 记录三态标志（dry-run / publish / prerelease）
        id: meta
        env:
          # ⚠️ N1：boolean inputs 也走 env，避免字符串插值与大小写歧义。
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # ⚠️ v0.0.9：本 step 是 publish / prerelease / dry_run 的
          #    **单一事实来源**；publish-release 与 verify-release 一律通过
          #    `needs.preflight.outputs.*` 读取，禁止再各自引用 inputs.publish。
          #
          #    tag push ⇒ publish=true：Tag 白名单是人工确认「该版本允许
          #    公开发布」的摩擦点，tag 推上来即代表确认；若这里给 false，
          #    正式发布路径将永远停在 Draft。
          #    workflow_dispatch ⇒ 完全按输入执行，publish=false 时保持 Draft；
          #    publish=true 时还承担 B2 的「幂等转公开」补救路径（见文件头）。
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "dry_run=${INPUT_DRY_RUN}" >> "$GITHUB_OUTPUT"
            echo "publish=${INPUT_PUBLISH}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${INPUT_PRERELEASE}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 读取远端 Release 状态（B3 fail-closed）
        id: relstate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh --version
          # ⚠️ B3：旧写法 `if gh release view ...; then exit 1; fi` 把
          #    「查询失败」（网络 / 限流 / 权限 / gh 版本差异）当成「不存在」
          #    放行 ⇒ **fail-open**，可能覆盖已发布 Release 的资产。
          #    现在统一用列表接口 + 按 tag_name 精确匹配 + 区分 draft：
          #    查询失败 / 解析失败 / 已公开 一律 exit 1。
          #    列表接口还能读到 draft（按 tag 查询端点读不到）。
          if ! gh api "repos/$REPO/releases?per_page=100" > /tmp/release-state.json; then
            echo "::error::查询 Release 列表失败 —— 无法判定冲突，中止发布"
            exit 1
          fi
          python3 - "$VERSION" "$PUBLISH" "$EVENT_NAME" <<'PY'
          import json, os, sys
          version, publish, event = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              lst = json.load(open('/tmp/release-state.json', encoding='utf-8'))
          except Exception as e:
              print('::error::Release 列表解析失败：', e); sys.exit(1)
          if not isinstance(lst, list):
              print('::error::Release 列表不是数组：', lst.get('message', '未知错误')); sys.exit(1)
          hit = [r for r in lst if r.get('tag_name') == version]
          if not hit:
              print('Release 不存在 —— 允许继续')
              state, rid = 'none', ''
          else:
              d = hit[0]
              if not bool(d.get('draft')):
                  print('::error::Release', version, '已公开发布 —— 资产不可覆盖，中止'); sys.exit(1)
              if not (event == 'workflow_dispatch' and publish == 'true'):
                  print('::error::Release', version, '已存在（Draft），本轮不是 publish=true 的转公开补救路径'); sys.exit(1)
              rid = str(d.get('id', ''))
              if not rid:
                  print('::error::Draft Release 缺少 id'); sys.exit(1)
              state = 'draft_resume'
              print('::notice::检测到已有 Draft Release —— 进入「幂等转公开」补救路径（不移动 Tag / 不删 Release / 不重复上传资产）')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('release_state=%s\n' % state)
              f.write('release_id=%s\n' % rid)
          PY

      - name: 校验远端 Tag 状态
        env:
          # ⚠️ v0.0.4：必须显式提供 GH_TOKEN。
          #   GitHub 官方要求「每个使用 GitHub CLI 的 step 都要设置 GH_TOKEN」——
          #   runner 只预装 gh 二进制，**不做** `gh auth login`。
          #   没有 token 时 `gh release view` 退出码非 0 ⇒
          #   「Release 已存在」这道闸门被**静默跳过** ⇒ 可能覆盖已发布 Release 的资产。
          #   （同文件内「检查远端 Release 是否已存在」步骤本来就正确写了 env:，
          #   只有这里漏了。）
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_EXISTS: ${{ needs.resolve-tag.outputs.exists }}
          TAG_SHA: ${{ needs.resolve-tag.outputs.sha }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh --version
          if [ "$EVENT_NAME" = "push" ]; then
            # tag 触发：tag 必然已存在于远端（它就是触发器）。
            # 此时要校验的是 —— **tag 指向的 commit 必须就是当前这次构建的 commit**，
            # 防止 tag 被移动到别处、或 Release 已发布后 tag 又被改动。
            # 由 resolve-tag job 用 `gh api` 解析（不依赖本 job 是否有 checkout）
            REMOTE_SHA="${{ needs.resolve-tag.outputs.sha }}"
            if [ -z "$REMOTE_SHA" ]; then
              echo "::error::无法读取远端 tag $VERSION 的目标 commit"
              exit 1
            fi
            if [ "$REMOTE_SHA" != "${{ github.sha }}" ]; then
              echo "::error::tag $VERSION 指向 $REMOTE_SHA，但当前构建 commit 是 ${{ github.sha }}。"
              echo "::error::已发布版本的 tag 不可移动，请手动处理。"
              exit 1
            fi
            echo "✓ tag $VERSION 指向当前 commit ${{ github.sha }}"

            # ── v0.0.9：构建上下文与 Tag 一致的**硬闸门** ──
            #
            # 修复前 8 个 job 的 checkout 一律 `ref: master`：tag push 时
            # 若 master 在发布期间又前进了，打出的 ZIP / 镜像就不是 Tag
            # 指向的那份代码，而「补救路径」与人工复核还拿 master 当参照。
            # 现在 tag push 全部固定到 github.sha（见下面的 checkout 注释），
            # 这里再确认远端 master 仍等于本次构建 commit；不等就当场中止，
            # 避免「Tag 已被 master 甩在后面」时继续发布一个含糊的版本。
            #
            # ⚠️ 绝不吞掉 git 失败：本 step 是 `set -euo pipefail`，
            #    fetch / rev-parse 失败会直接中止（不能 `|| true`）。
            # ⚠️ 显式写 refspec 更新 origin/master：只 `git fetch origin master`
            #    通常只写 FETCH_HEAD，`git rev-parse origin/master` 可能仍是
            #    旧值 ⇒ 闸门假通过。
            git fetch origin master:refs/remotes/origin/master
            MASTER_SHA="$(git rev-parse origin/master)"
            if [ "$MASTER_SHA" != "${{ github.sha }}" ]; then
              echo "::error::发布期间 master 已前进：origin/master=$MASTER_SHA，本次构建=${{ github.sha }}。"
              echo "::error::为避免发布产物与 Tag / 远端 master 的关系含糊不清，中止发布；请在新 commit 上重新打 Tag。"
              exit 1
            fi
            echo "✓ origin/master 仍等于本次构建 commit $MASTER_SHA"
          else
            # 手动触发：分两种情况。
            #
            # ## 情况 A：Tag 不存在 —— 正常的手动发版路径
            #
            # ## 情况 B：Tag 已存在，但 **Release 尚未创建** —— 补救路径
            #
            # 为什么需要情况 B（v0.0.4 实测踩到）：
            #
            #   首次触发 tag 流水线时，流水线**自身**有缺陷（护栏 3 未含
            #   release 库名 + 安全检查两处误判/失效）⇒ 红灯 ⇒ Release 没建成。
            #   修好并合入 master 后，若不提供补救路径，就只能靠
            #   「删 Tag 重推」或「移动 Tag」—— 两者都违反
            #   「同一版本号不得反复删除、重建或移动 Tag」的规约，
            #   且移动 Tag 属需主人**单独授权**的高风险操作。
            #
            #   情况 B 让「Tag 不动、Release 补建」成为可能：
            #     - Tag 保持不动 ⇒ 不需要任何额外授权；
            #     - 代码从 master 检出（见「检出代码」步骤）⇒ 含流水线修复。
            #
            # ⚠️ **安全前提**：Tag 指向的 commit 与 master 在**发布内容**上
            #   必须零差异（`deploy/` / `src/` / `package.json` / `drizzle/`），
            #   否则打出来的包与 Tag 不一致 —— 那就不是同一个版本了。
            #   这条校验在下面执行，**不通过就中止**。
            #
            # 「Release 是否已存在」由**上一个步骤**统一读取（B3 fail-closed）
            # —— 已公开 / 查询失败一律在那一步就中止，绝不允许被覆盖。
            #
            # ## B1 纠正：为什么两条路径用**不同**的判据
            #
            # · 正式 tag push：Tag 就是本次构建的 commit，产物必须逐字节等于
            #   Tag 指向的树 ⇒ 上面的「REMOTE_SHA == github.sha」+
            #   「origin/master == github.sha」双硬闸门，8 个 checkout 固定
            #   到 github.sha。这条路径最严格。
            # · dispatch 补救路径：Tag 已存在且不可移动，而流水线自身的修复
            #   合入 master 后，master 与 Tag 在 `.github/` / `docs/` 上
            #   **必然有差异**（那正是修复内容）。若用「全路径零差异」会把
            #   这条唯一合法的修复路径直接拦死 ⇒ 改为**构建相关路径显式
            #   白名单零差异**：`.github/`、`docs/` 允许不同，但凡影响镜像 /
            #   安装包的路径一律不许差一个字节（镜像构建 `context: .`）。
            if [ "$TAG_EXISTS" = "true" ]; then
              echo "Tag $VERSION 已存在于远端 —— 进入「补救路径」判定。"

              # ① Release 状态已由「读取远端 Release 状态」step 判定完毕：
              #    none          ⇒ 正常补救建 Release；
              #    draft_resume  ⇒ B2 幂等转公开，下面只复用已有资产。
              if [ "${release_state:-none}" = "draft_resume" ]; then
                echo "::notice::幂等转公开路径：复用已有 Draft 的资产，跳过创建与上传"
              fi

              # ② 显式取回 Tag 对象，保证 $TAG_SHA 在本地对象库中。
              #    否则 `git diff` 会 fatal: bad revision ⇒ 必须 exit 1，
              #    绝不 `|| true` 吞掉（历史踩坑见下方注释）。
              if [ -z "$TAG_SHA" ]; then
                echo "::error::无法读取远端 tag $VERSION 的目标 commit"
                exit 1
              fi
              echo "Tag $VERSION 指向 $TAG_SHA"
              git fetch origin "+refs/tags/$VERSION:refs/tags/$VERSION"

              # ③ 构建相关路径必须零差异（B1 显式白名单）
              #
              # ⚠️ 白名单按**仓库实际存在**的文件列全；不存在的路径不写进
              #    pathspec（避免 git 报错）。原版只覆盖
              #    deploy/ src/ package.json drizzle/，漏了 lockfile、
              #    Dockerfile、.dockerignore、next.config.*、public/、
              #    tsconfig.json —— 而镜像构建 `context: .`，漏一个都会让
              #    「包与 Tag 一致」的结论失真。
              #
              # ⚠️ v0.0.4 的两道加固继续有效：不要用 `--depth=1`（shallow
              #    对象不可靠）；不要吞掉 `git diff` 的失败（原 `|| true`
              #    会把「无法比较」误判成「零差异」）—— 现在失败即中止。
              git fetch origin master:refs/remotes/origin/master
              BUILD_PATHS=(deploy/ src/ package.json package-lock.json drizzle/ \
                           Dockerfile .dockerignore next.config.mjs public/ tsconfig.json)
              if ! CONTENT_DIFF="$(git diff --name-only "$TAG_SHA" origin/master -- "${BUILD_PATHS[@]}")"; then
                echo "::error::无法比较 Tag $VERSION 的构建内容与 master（对象缺失或 git 失败）。"
                echo "::error::**不能据此认定零差异** —— 中止发布。"
                exit 1
              fi
              if [ -n "$CONTENT_DIFF" ]; then
                echo "::error::Tag $VERSION 的构建相关路径与 master 不一致，禁止产出与 Tag 不匹配的包："
                echo "$CONTENT_DIFF"
                echo "::error::请先请主人裁决（移动 Tag 需单独授权；或改走其他发布路径）。"
                exit 1
              fi
              echo "✓ 构建相关路径（${BUILD_PATHS[*]}）与 master 零差异"
              echo "✓ 补救路径校验通过（.github/ 与 docs/ 的差异是流水线修复，允许）"
            else
              echo "✓ Tag $VERSION 未被占用"
            fi
          fi

      - name: 复核远端 Release 状态（B3 fail-closed）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh --version
          # 第二次独立查询（列表接口）：查询失败 / 解析失败 / 已公开
          # 一律 exit 1，绝不把「查询失败」当成「不存在」放行。
          # 与上一 step 分开查，是为了让「Release 已存在」这道闸门
          # 不依赖任何一次查询的缓存结果。
          if ! gh api "repos/$REPO/releases?per_page=100" > /tmp/release-state-2.json; then
            echo "::error::复核 Release 列表失败 —— 中止发布"
            exit 1
          fi
          python3 -c "import json,sys; v=sys.argv[1]; d=json.load(open('/tmp/release-state-2.json',encoding='utf-8')); assert isinstance(d,list), '列表接口未返回数组'; hit=[r for r in d if r.get('tag_name')==v]; print('复核：Release', v, '=', ('draft' if hit and hit[0].get('draft') else '已发布') if hit else '不存在'); sys.exit(1 if hit and not hit[0].get('draft') else 0)" "$VERSION"
          echo "✓ Release 状态复核通过（已公开 / 查询失败均在上面中止）"

      - name: 确定 Release 的 target commit
        id: tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          # Release 的 target 必须是**版本锚点**（tag）指向的 commit，
          # 而不是「这次构建用的代码来自哪个分支」。
          #
          # - tag 触发：tag 指向的 commit 就是 github.sha；
          # - 手动「补救路径」：tag 已存在，github.sha 是触发分支的 commit，
          #   必须用远端 tag 指向的 commit，否则 Release 会指向错误的版本。
          # 由 resolve-tag job 用 `gh api` 解析（单一事实来源，不依赖 checkout）
          TAG_SHA="${{ needs.resolve-tag.outputs.sha }}"
          DRY_RUN="${{ steps.meta.outputs.dry_run }}"
          if [ -z "$TAG_SHA" ]; then
            # ⚠️ v0.0.9：**干跑路径**允许 tag 尚不存在。
            #
            # 缺陷（实测，run 42372977190）：原实现无条件要求
            # 「能读到远端 tag 指向的 commit」⇒ tag 不存在就报错中止
            # ⇒ **干跑必须先有 tag 才能跑** ⇒ 与「正式发布前先干跑验证
            #    流水线」的要求直接矛盾（而且会诱导「先建 tag 再试错」）。
            #
            # 修法：干跑时以**触发分支的 HEAD** 作为锚点
            #       （正式发布路径仍严格要求 tag 已存在）。
            if [ "$DRY_RUN" = "true" ]; then
              HEAD_SHA="$(git rev-parse HEAD)"
              echo "::notice::干跑模式：远端 tag $VERSION 尚不存在，以触发分支 HEAD 作为构建锚点"
              echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
              echo "干跑锚点 commit = $HEAD_SHA"
              exit 0
            fi
            echo "::error::无法读取远端 tag $VERSION 的目标 commit（正式发布要求 tag 已存在）"
            exit 1
          fi
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION 的 target commit = $TAG_SHA"

      - name: 输出发布信息
        run: |
          echo "仓库    : ${{ github.repository }}"
          echo "版本    : ${{ steps.v.outputs.version }}"
          echo "版本锚点 SHA: ${{ steps.tag.outputs.sha }}"
          echo "镜像    : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.version }}"
          echo "dry_run : ${{ steps.meta.outputs.dry_run }}"
          echo "publish : ${{ steps.meta.outputs.publish }}"
          echo "prerelease: ${{ steps.meta.outputs.prerelease }}"
          echo "三态    : dry_run=true → 干跑 / publish=false → Draft / publish=true → 公开 Pre-release"

  # ===========================================================================
  # 2. code-checks —— 类型检查 + 生产构建
  # ===========================================================================
  code-checks:
    name: 代码检查（类型 + 构建）
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ⚠️ v0.0.9：构建上下文必须与版本锚点一致（全部 8 个 job 统一）。
          #   tag push ⇒ 固定到 github.sha（Tag 指向的准确提交），
          #     保证打出的 ZIP / 镜像就是该 Tag 的代码；
          #   workflow_dispatch ⇒ 仍取 master（干跑 / 补救路径需要 master 上的修复）。
          #   历史论证（Tag 不可移动、构建代码与版本锚点解耦）见 preflight 的说明。
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: Next.js 生产构建
        run: npm run build

  # ===========================================================================
  # 3. security-scan —— 依赖漏洞 + 秘密扫描 + 发布包内容检查
  # ===========================================================================
  security-scan:
    name: 安全扫描（依赖 + 秘密）
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（含完整历史，供 gitleaks 扫描）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # ⚠️ v0.0.9：构建上下文必须与版本锚点一致（全部 8 个 job 统一）。
          #   tag push ⇒ 固定到 github.sha（Tag 指向的准确提交），
          #     保证打出的 ZIP / 镜像就是该 Tag 的代码；
          #   workflow_dispatch ⇒ 仍取 master（干跑 / 补救路径需要 master 上的修复）。
          #   历史论证（Tag 不可移动、构建代码与版本锚点解耦）见 preflight 的说明。
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 依赖漏洞扫描
        run: |
          set -euo pipefail
          # 门禁策略：**high / critical 一律阻断**。
          #
          # 现状（2026-11-03 实测 `npm audit`）：
          #   critical=0, high=0, moderate=4, low=0
          #   残留的 4 个 moderate 全部来自 drizzle-kit → @esbuild-kit → esbuild
          #   （GHSA-67mh-4wv8-2f99，esbuild 开发服务器跨域读取）。
          #   esbuild 只在 drizzle-kit 的**本地迁移工具链**里用到，不进入生产镜像的
          #   运行时依赖树，因此 moderate 不阻断 —— 但结果**不被静默吞掉**，
          #   完整 JSON 与摘要都会作为 artifact 上传供人工复核。
          #
          # 若将来 high/critical 出现新条目，这里会立刻中止发布。
          npm audit --json > npm-audit.json || true
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const v = (a.metadata && a.metadata.vulnerabilities) || {};
            const critical = v.critical || 0;
            const high = v.high || 0;
            console.log("::group::npm audit 汇总");
            console.log(JSON.stringify(v, null, 2));
            console.log("::endgroup::");
            fs.writeFileSync(
              "npm-audit-summary.txt",
              `critical=${critical}\nhigh=${high}\nmoderate=${v.moderate || 0}\nlow=${v.low || 0}\n`
            );
            if (critical > 0) {
              console.log("::error::存在 critical 级别漏洞，发布中止");
              process.exit(1);
            }
            if (high > 0) {
              console.log(`::error::存在 ${high} 个 high 级别漏洞，发布中止`);
              process.exit(1);
            }
            if ((v.moderate || 0) > 0) {
              console.log(`::warning::存在 ${v.moderate} 个 moderate 级别漏洞（drizzle-kit 工具链的 esbuild 依赖，不影响生产运行时），已记录但不阻断本次发布`);
            }
          '

      - name: 记录依赖树
        run: npm ls --depth=0 > npm-ls.txt 2>&1 || true

      - name: 秘密扫描（gitleaks，扫描 Git 跟踪的文件）
        run: |
          set -euo pipefail
          # 直接调用 CLI，而不是用 gitleaks/gitleaks-action。
          #
          # 原因一（实测 v3.0.0 的 src/gitleaks.js）：该 Action 的命令是**硬编码**的，
          # 它**不读 `args` 输入** —— 实际执行的是：
          #   gitleaks detect --redact -v --exit-code=2 --report-format=sarif ...
          #   --log-opts=--no-merges --first-parent <base>^..<head>
          # 也就是说它**必定扫描 git 历史**，无法通过 action 参数改成扫工作区。
          #
          # 原因二（实测 2026-11-03 这次真实运行的日志）：
          #   tag push 事件的 payload 里 commits 数组是**空的**，
          #   Action 走到 `if (eventJSON.commits.length === 0)` 分支，
          #   打印 "No commits to scan" 后 **process.exit(0)** ——
          #   扫描**一步都没跑**，却返回成功。
          #   这是最危险的一种失败：秘密扫描看起来通过了，实际上什么都没检查。
          #
          # 为什么必须避开 git 历史（实测结论）：
          #   仓库历史里曾提交过原站 HTML 素材副本（docs/evidence/html/），
          #   其中含 Google AdSense 账号 ca-pub-5060390720525238、
          #   Solana 代币地址 9raUVuzeWUk53co63M4WXLWPWE4Xc6Lpn7RS9dnkpump 等
          #   **第三方公开标识符**。用 gitleaks v8.18.4 官方配置
          #   （generic-api-key 规则 + 1474 条 stopwords + 熵阈值 3.5）
          #   模拟全历史扫描，实测命中 **274 条** —— 必然让流水线失败，
          #   而它们既不是本项目的凭据，也不是真实泄露。
          #
          #   这些素材在当前 commit 中已不再被 Git 跟踪。
          #
          #   若将来要恢复全历史扫描，正确做法是先用 gitleaks 生成 baseline
          #   （gitleaks detect --generate-config）并把 baseline 提交入库，
          #   而不是放宽规则或加忽略。
          GITLEAKS_VERSION=8.18.4
          # 资产名是 linux_x64（不是 linux_amd64 —— 官方用 Go 的 GOARCH 命名）。
          # 写错会得到 404，curl -f 会直接以退出码 22 中止流水线。
          curl -sSfL --retry 3 --max-time 120 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # 校验官方 checksum，防止下载到被篡改的二进制
          curl -sSfL --retry 3 --max-time 120 \
            -o /tmp/gitleaks-checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd /tmp
          # 只校验 linux_x64 那一条（checksums 文件里的路径名与 tar.gz 内一致）
          EXPECTED="$(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks-checksums.txt | awk '{print $1}')"
          if [ -z "$EXPECTED" ]; then
            echo "::error::checksums 文件里找不到 linux_x64 的条目"
            exit 1
          fi
          ACTUAL="$(sha256sum gitleaks.tar.gz | awk '{print $1}')"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::gitleaks 二进制校验和不匹配（期望 $EXPECTED，实际 $ACTUAL）"
            exit 1
          fi
          echo "✓ gitleaks 二进制 checksum 校验通过"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
          cd "$GITHUB_WORKSPACE"

          # 只把**Git 跟踪的文件**复制到独立目录再扫描。
          #
          # 为什么不直接 `--no-git --source .`：
          #   --no-git 模式会 walk 整个目录树（只跳过 .git/），**不认 .gitignore**，
          #   会把 .next/（112MB 构建产物）、test-results/（48MB 截图）一起扫进去 ——
          #   又慢又会引入构建产物里的噪声。
          #
          # 为什么不用 `git ls-files -z | xargs -0 gitleaks ...`：
          #   gitleaks 一次只能接一个 --source 目录。
          #   复制到独立目录后用 --no-git 扫，语义就精确等于「扫描 Git 跟踪的文件」。
          rm -rf /tmp/gitleaks-scan && mkdir -p /tmp/gitleaks-scan
          # -z 处理含空格/换行的路径；--others 排除未跟踪文件；
          # -z 让 xargs 能正确分隔 NUL 分隔的路径
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C /tmp/gitleaks-scan
          FILE_COUNT="$(find /tmp/gitleaks-scan -type f | wc -l | tr -d ' ')"
          echo "待扫描的 Git 跟踪文件数：$FILE_COUNT"
          if [ "$FILE_COUNT" -lt 1 ]; then
            echo "::error::没有取到任何 Git 跟踪文件，扫描无法进行（中止，避免假通过）"
            exit 1
          fi

          # --no-git：把上一步的目录当普通目录扫描
          # --exit-code=1：发现泄露即失败
          # --redact：报告里不打印明文
          #
          # ⚠️ v0.0.9：**刻意不加 `--config`**。
          #
          # 本地实测（gitleaks 8.18.4）证明：**只要传了 --config，
          # 而配置文件里没有完整的 [rules] 定义，默认规则集就不会被加载**
          # ⇒ 扫描会「零泄漏通过」——这是最危险的一种假绿。
          #
          #   实测对照：
          #     --config（有 [extend] useDefault）  → 规则不生效（8.18.4 不认 extend）
          #     --config（有 [rules] 但不完整）    → 规则不生效
          #     --config（只有 allowlists）        → 规则不生效
          #     不传 --config                        → 规则完整生效 ✅
          #
          # ⇒ 因此**从源头消除误报**（把 E2E 测试固件的变量名从以
          #    "Password" 结尾改成含 "ForTest" 的形式），
          #    而不是用 allowlist 换掉规则集 —— 检测能力一点没削弱。
          #
          # 干跑实测证据（run 42373086097 / 42373509878 / 42373768954）：
          #   误报来源是 `generic-api-key` 规则对「赋值目标名含 Password +
          #   高熵字面量」的匹配，与该值是否是真密钥无关。
          set +e
          /tmp/gitleaks detect \
            --no-git \
            --redact \
            --no-banner \
            --exit-code=1 \
            --report-format=json \
            --report-path=gitleaks-report.json \
            --source /tmp/gitleaks-scan 2>&1 | tee gitleaks-output.txt
          GL_EXIT=${PIPESTATUS[0]}
          set -e
          echo "gitleaks 退出码：$GL_EXIT"
          if [ "$GL_EXIT" -ne 0 ]; then
            echo "::error::gitleaks 发现疑似泄露的凭据，发布中止（详见 gitleaks-report.json）"
            exit 1
          fi
          echo "✓ gitleaks 未发现泄露"

      - name: 发布包内容安全检查
        run: |
          set -euo pipefail
          fail=0
          # 1) 发布包不得包含生成的 .env
          if [ -f deploy/.env ]; then
            echo "::error::deploy/.env 存在 —— 生成的配置绝不能入库"
            fail=1
          fi
          # 2) 不得包含原站受保护素材（HTML / CSS / JS 副本与参考截图）
          #    注意：用固定前缀匹配，不要用 'ref-*.png' 这种 glob ——
          #    glob 里的 * 会被 grep 当作正则量词，语义完全不同。
          for pat in 'docs/evidence/html/' 'docs/evidence/assets/' 'docs/evidence/screenshots/.*/ref-' 'docs/evidence/visual/diff-'; do
            if git ls-files | grep -qE "$pat"; then
              echo "::error::版本控制中存在原站素材：$pat"
              fail=1
            fi
          done
          # 3) deploy/ 内不得有明文口令
          #
          #    判定逻辑（经本地双向验证：能捕获 dbPassword="SuperSecret123!"，
          #    同时不误报 --requirepass ${REDIS_PASSWORD:?} 这类变量引用）：
          #    - 键名允许驼峰/下划线前后缀
          #    - 值含 $ 变量引用、随机数生成器、PowerShell cmdlet、
          #      管道/重定向片段时一律视为安全
          #    - 值为空（'' / "" / 无值）视为安全
          #
          # ⚠️ v0.0.4 修正：原先排除「空值」的这条 grep 写成了
          #      grep -vE '[:=][[:space:]]*(""|'"''"'|)$'
          #    那段引号**没有闭合**（`''"'` 之后缺一个单引号），
          #    在 bash 里会直接抛 `syntax error near unexpected token ')'`。
          #    结果：整个 `hits="$( ... )"` 赋值失败 ⇒ 检查静默失效。
          #    修法：把正则放进**双引号**里（`''` 在双引号内是安全的），
          #    单引号成对写作 `''`。已本地双向验证：
          #      空单引号 / 空双引号 / 无值 → 正确排除
          #      dbPassword="SuperSecret123!" → 正确捕获
          KEY_RE='([A-Za-z_][A-Za-z0-9_]*)?(pass(word|wd)?|pwd|secret|token|api[_-]?key|credential)([A-Za-z0-9_]*)[[:space:]]*[:=][[:space:]]*(.*)$'
          EMPTY_VALUE_RE="[:=][[:space:]]*(\"\"|''|)\$"
          hits="$(grep -rniE "$KEY_RE" deploy/ \
                   --include='*.sh' --include='*.ps1' --include='*.yml' --include='*.yaml' 2>/dev/null \
                 | grep -vE '\$[A-Za-z_{(]' \
                 | grep -vE 'Get-RandomHex|CHANGE_ME|PLACEHOLDER|Get-AdminPassword|random|Random|openssl' \
                 | grep -vE "$EMPTY_VALUE_RE" \
                 | grep -vE '[|><`]' \
                 | grep . || true)"
          if [ -n "$hits" ]; then
            echo "::error::deploy/ 中存在疑似硬编码口令"
            echo "$hits"
            fail=1
          fi
          # 4) .env 系列文件不得入库（**仅允许 *.example 模板**）
          #
          # ⚠️ 豁免规则必须覆盖 `*.example` 与 `*.example.*` 两种形态：
          #   - `.env.example`                （根目录模板）
          #   - `deploy/.env.example`         （部署模板）
          #   - `tests/env/.env.test.example` （v0.0.4 新增的**测试环境模板**）
          #
          # 上一轮只豁免了 `\.env\.example$`，于是 `tests/env/.env.test.example`
          # 被误判为「被跟踪的环境文件」而让**整个发布流水线在安全扫描阶段红灯**。
          # 而它**恰恰应该入库**：全部用 `__占位符__` 形式，不含任何真实口令
          # （与 `.env.example` 的基线一致），且 `tests/helpers/test-env.ts`
          # 在 `.env.test` 缺失时正是从它生成本机副本。
          #
          # 与 `scripts/release/preflight.sh` 的同款豁免保持一致。
          if git ls-files | grep -E '(^|/)\.env' | grep -vE '\.example($|\.)'; then
            echo "::error::存在被跟踪的环境文件"
            fail=1
          fi
          exit $fail

      - name: 上传扫描报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-report
          path: |
            npm-audit.json
            npm-audit-summary.txt
            npm-ls.txt
            gitleaks-report.json
            gitleaks-output.txt
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # 4. unit-tests —— 单元测试（隔离数据库）
  # ===========================================================================
  unit-tests:
    name: 单元测试
    needs: [preflight, code-checks]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ${{ github.run_id }}-unit-test-password
          POSTGRES_DB: v2ex_release_unit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ${{ github.run_id }}-redis-test-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ${{ github.run_id }}-redis-test-password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          # ⚠️ v0.0.9：构建上下文必须与版本锚点一致（全部 8 个 job 统一）。
          #   tag push ⇒ 固定到 github.sha（Tag 指向的准确提交），
          #     保证打出的 ZIP / 镜像就是该 Tag 的代码；
          #   workflow_dispatch ⇒ 仍取 master（干跑 / 补救路径需要 master 上的修复）。
          #   历史论证（Tag 不可移动、构建代码与版本锚点解耦）见 preflight 的说明。
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 数据库迁移
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-unit-test-password@localhost:5432/v2ex_release_unit
        run: npx drizzle-kit migrate

      - name: 运行单元测试
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-unit-test-password@localhost:5432/v2ex_release_unit
          REDIS_URL: redis://:${{ github.run_id }}-redis-test-password@localhost:6379
          SESSION_SECRET: ${{ github.run_id }}-release-unit-test-session-secret-32chars
          DEBUG_ENDPOINT_TOKEN: ${{ github.run_id }}-release-debug-token
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
        run: npx vitest run --reporter=junit --outputFile=unit-test-results.xml

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: unit-test-results.xml
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # 5. e2e-tests —— Playwright E2E（隔离数据库 + 真实启动应用）
  # ===========================================================================
  e2e-tests:
    name: E2E 测试
    needs: [preflight, code-checks]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ${{ github.run_id }}-e2e-test-password
          POSTGRES_DB: v2ex_release_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ${{ github.run_id }}-redis-test-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ${{ github.run_id }}-redis-test-password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          # ⚠️ v0.0.9：构建上下文必须与版本锚点一致（全部 8 个 job 统一）。
          #   tag push ⇒ 固定到 github.sha（Tag 指向的准确提交），
          #     保证打出的 ZIP / 镜像就是该 Tag 的代码；
          #   workflow_dispatch ⇒ 仍取 master（干跑 / 补救路径需要 master 上的修复）。
          #   历史论证（Tag 不可移动、构建代码与版本锚点解耦）见 preflight 的说明。
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 数据库迁移
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
        run: npx drizzle-kit migrate

      - name: 初始化演示数据
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
          REDIS_URL: redis://:${{ github.run_id }}-redis-test-password@localhost:6379
          SESSION_SECRET: ${{ github.run_id }}-release-e2e-session-secret-32chars
          SEED_ADMIN_USERNAME: admin
          SEED_ADMIN_EMAIL: admin@example.com
          SEED_ADMIN_PASSWORD: ${{ github.run_id }}-Release-Test-Admin-2026
          SEED_DEMO_PASSWORD: ${{ github.run_id }}-Release-Test-Demo-2026
          SEED_DEMO_USERS: '1'
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
        run: npx tsx scripts/seed.ts

      # 必须在本 job 内构建：.next/ 被 .gitignore 忽略，干净检出的工作区没有构建产物，
      # 直接 `next start` 会因缺少 BUILD_ID 而失败。
      # 构建期不需要数据库（src/db 是惰性初始化，见 src/db/index.ts）。
      - name: 构建应用
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
        run: npm run build

      - name: 启动应用
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
          REDIS_URL: redis://:${{ github.run_id }}-redis-test-password@localhost:6379
          SESSION_SECRET: ${{ github.run_id }}-release-e2e-session-secret-32chars
          DEBUG_ENDPOINT_TOKEN: ${{ github.run_id }}-release-debug-token
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
          DISABLE_CAPTCHA: '1'
          ENABLE_DEBUG_ENDPOINTS: '1'
          LOCAL_BASE: http://localhost:3000
          CI: 'true'
          # APP_URL / NEXT_PUBLIC_APP_URL / SMTP_* 在 **workflow 级 env** 里
          # 统一配置（见文件顶部）—— 应用进程与测试进程都要继承它们，
          # 放在 step 级只对应用生效，测试进程会拿不到。
        run: |
          set -euo pipefail
          npx next start -p 3000 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            sleep 2
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              echo "应用就绪（${i} 次轮询后）"
              exit 0
            fi
          done
          echo "::error::应用在 120 秒内未就绪"
          exit 1

      - name: 运行 E2E
        env:
          DATABASE_URL: postgres://v2ex:${{ github.run_id }}-e2e-test-password@localhost:5432/v2ex_release_e2e
          REDIS_URL: redis://:${{ github.run_id }}-redis-test-password@localhost:6379
          SESSION_SECRET: ${{ github.run_id }}-release-e2e-session-secret-32chars
          DEBUG_ENDPOINT_TOKEN: ${{ github.run_id }}-release-debug-token
          APP_RUNTIME_ENV: test
          TEST_ENV_ISOLATED: '1'
          DISABLE_CAPTCHA: '1'
          ENABLE_DEBUG_ENDPOINTS: '1'
          SEED_ADMIN_USERNAME: admin
          SEED_ADMIN_EMAIL: admin@example.com
          SEED_ADMIN_PASSWORD: ${{ github.run_id }}-Release-Test-Admin-2026
          SEED_DEMO_PASSWORD: ${{ github.run_id }}-Release-Test-Demo-2026
          LOCAL_BASE: http://localhost:3000
          BROWSER_CHANNEL: chromium
          CI: 'true'
        run: npx playwright test --reporter=list

      - name: 停止应用
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true

      - name: 上传 E2E 失败证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # 6. build-image —— 构建并推送镜像到 GHCR
  # ===========================================================================
  build-image:
    name: 构建并推送镜像
    needs: [preflight, code-checks, security-scan, unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # ⚠️ N3：digest 有了真实消费点（verify-release 交叉核对）。
      #    B4 幂等重跑时推送被跳过 ⇒ steps.push 没有 digest，
      #    改用幂等检查 step 从已存在镜像读到的 RepoDigest。
      digest: ${{ steps.imgtag.outputs.digest || steps.push.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # ⚠️ v0.0.9：构建上下文必须与版本锚点一致（全部 8 个 job 统一）。
          #   tag push ⇒ 固定到 github.sha（Tag 指向的准确提交），
          #     保证打出的 ZIP / 镜像就是该 Tag 的代码；
          #   workflow_dispatch ⇒ 仍取 master（干跑 / 补救路径需要 master 上的修复）。
          #   历史论证（Tag 不可移动、构建代码与版本锚点解耦）见 preflight 的说明。
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}

      # ------------------------------------------------------------------
      # dry_run 闸门（2026-11-04 补）
      #
      # 修复前的真实缺陷：dry_run 这个 input 被声明、被输出、被打印，
      # 但**从来没有被任何 `if:` 消费过** —— 它是死代码。
      # 结果是：手动触发时勾选「仅验证（dry_run=true）」，
      # 流水线照样会：
      #   1) 用 packages:write 登录 GHCR 并**推送镜像**
      #   2) 用 contents:write **创建并发布 Release**
      # 也就是说「仅验证」这个承诺从来没有生效。
      #
      # 现在的行为：dry_run=true 时，本 job 仍然**构建**镜像（用本地
      # load，不推送），让后续的部署验证能真正跑起来 —— 但**不推送**。
      # push 步骤的 push 值改由 dry_run 决定。
      # ------------------------------------------------------------------
      - name: 读取 dry_run 标志
        id: dr
        run: |
          set -euo pipefail
          DRY_RUN="${{ needs.preflight.outputs.dry_run }}"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry_run=true —— 本次只构建与验证，**不推送镜像、不创建 Release**"
          else
            echo "::notice::dry_run=false —— 本次将推送镜像并发布 Release"
          fi

      - name: 记录实际构建 commit（B1 溯源不失真）
        id: buildsha
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 镜像的 sha-* 标签与 org.opencontainers.image.revision 必须写
          # **真正被检出 / 构建**的 commit，而不是一律写 tag_sha：
          #   tag push ⇒ 检出 github.sha（就是 Tag 指向的 commit）；
          #   dispatch 补救 / 干跑 ⇒ 检出 master，必须如实写 master HEAD。
          # 否则「实际从 master 构建」却声称来自 Tag，是溯源失真。
          if [ "$EVENT_NAME" = "push" ]; then
            SHA="$BUILD_SHA"
          else
            SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "实际构建 commit = $SHA（事件：$EVENT_NAME）"

      - name: 登录 GHCR
        # ⚠️ B5：Draft / 干跑模式不推送镜像 ⇒ 也不登录 registry。
        #    旧逻辑 `dry_run=false + publish=false` 仍会把镜像推到 GHCR，
        #    而 Release 还停在 Draft 待风险决策 —— 已对外分发且不可回收。
        if: ${{ needs.preflight.outputs.dry_run != 'true' && needs.preflight.outputs.publish == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 目标镜像标签幂等检查（B4）
        id: imgtag
        if: ${{ needs.preflight.outputs.dry_run != 'true' && needs.preflight.outputs.publish == 'true' }}
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG_SHA: ${{ needs.preflight.outputs.tag_sha }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          SKIP=false
          DIGEST=""
          if PULL_OUT="$(docker pull "$IMAGE" 2>&1)"; then
            printf '%s\n' "$PULL_OUT"
            REV="$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null || echo '')"
            DIGEST="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' 2>/dev/null | sed 's/.*@//' || echo '')"
            if [ -z "$REV" ] || [ "$REV" = "<no value>" ]; then
              echo "::error::目标标签 $IMAGE 已存在但读不到 image.revision —— 拒绝覆盖"
              exit 1
            fi
            if [ "$REV" != "$TAG_SHA" ]; then
              echo "::error::目标标签 revision=$REV 与版本锚点 $TAG_SHA 不一致 —— 拒绝用不同源码覆盖同一标签"
              exit 1
            fi
            if [ -z "$DIGEST" ]; then
              echo "::error::目标标签已存在但读不到 RepoDigest —— 拒绝继续"
              exit 1
            fi
            echo "::notice::目标标签已存在且 revision 与版本锚点一致 ⇒ 幂等重跑，跳过推送（不覆盖先 run 的镜像）"
            SKIP=true
          else
            printf '%s\n' "$PULL_OUT"
            # 只有明确的「标签不存在」才允许继续推送；其它失败一律中止，
            # 避免把网络 / 权限问题误判成「标签没人用过」。
            if printf '%s' "$PULL_OUT" | grep -qiE 'manifest unknown|not found|name unknown'; then
              echo "目标标签尚不存在 ⇒ 正常推送"
            else
              echo "::error::无法判定目标标签 $IMAGE 状态（docker pull 失败且不是「不存在」）—— 中止"
              exit 1
            fi
          fi
          echo "skip_push=$SKIP" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            # ⚠️ B1：sha-* 标签必须指向**实际构建**的 commit（不是 tag_sha 的快照）
            type=raw,value=sha-${{ steps.buildsha.outputs.sha }}
          # 刻意不生成 latest —— 预览版的 latest 会误导用户。
          # flavor 设为 latest=false，避免 metadata-action 自动补 latest 标签。

      - uses: docker/setup-buildx-action@v4

      - name: 构建并推送
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # ⚠️ B5：**只有「非干跑 + publish=true」才允许推送**。
          #    dry_run=false & publish=false（Draft 待决策）时镜像只构建到
          #    本地并走 artifact 传给 deploy-verify，绝不对外分发。
          #    修复前 push 只看 dry_run ⇒ Draft 阶段镜像已公开且不可回收。
          # ⚠️ B4：目标标签已存在且 revision 与版本锚点一致 ⇒ 幂等重跑，
          #    跳过推送，防止后 run 覆盖先 run 的镜像。
          push: ${{ needs.preflight.outputs.dry_run != 'true' && needs.preflight.outputs.publish == 'true' && steps.imgtag.outputs.skip_push != 'true' }}
          load: ${{ needs.preflight.outputs.dry_run == 'true' || needs.preflight.outputs.publish != 'true' || steps.imgtag.outputs.skip_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=V2EX Clone
            org.opencontainers.image.description=独立的 V2EX 界面还原研究项目（非官方）
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            # ⚠️ B1：revision 写**实际构建**的 commit（见 buildsha step），
            #    B4 的幂等判定会读取这个 label 与版本锚点比对。
            org.opencontainers.image.revision=${{ steps.buildsha.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 供应链溯源：provenance 记录构建来源，sbom 记录依赖清单。
          # 二者都是 BuildKit 层的 attestation，随镜像一起推到 registry，
          # **不需要** id-token / attestations 权限
          # （那两个权限是 GitHub 原生 Artifact Attestations 才需要的）。
          #
          # dry_run / Draft / 幂等跳过推送时镜像走 docker load（本地归档），
          # docker exporter 不承载 attestation，故此时关闭 —— 否则会出现导出告警。
          provenance: ${{ needs.preflight.outputs.dry_run != 'true' && needs.preflight.outputs.publish == 'true' && steps.imgtag.outputs.skip_push != 'true' }}
          sbom: ${{ needs.preflight.outputs.dry_run != 'true' && needs.preflight.outputs.publish == 'true' && steps.imgtag.outputs.skip_push != 'true' }}

      # ------------------------------------------------------------------
      # dry_run：把镜像存成归档上传，供下游 deploy-verify 在**同一个
      # job 的 runner 之外**继续用真实镜像验证。
      #
      # 为什么需要这一步：build-image 与 deploy-verify 是两个 job、
      # 两台 runner。dry_run 时镜像不推 registry，deploy-verify 就
      # 拉不到它 —— 只能靠 artifact 把镜像搬过去。
      # ------------------------------------------------------------------
      - name: 导出镜像归档（干跑 / Draft）
        # ⚠️ B5：Draft 模式（publish=false）同样不推 registry，
        #    必须复用干跑的 artifact 传递方案，deploy-verify 才能真实安装。
        if: ${{ needs.preflight.outputs.dry_run == 'true' || needs.preflight.outputs.publish != 'true' }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}"
          docker save "$IMAGE" -o /tmp/dry-run-image.tar
          ls -lh /tmp/dry-run-image.tar

      - name: 上传镜像归档（干跑 / Draft）
        # ⚠️ B5：Draft 模式（publish=false）同样不推 registry，
        #    必须复用干跑的 artifact 传递方案，deploy-verify 才能真实安装。
        if: ${{ needs.preflight.outputs.dry_run == 'true' || needs.preflight.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-image
          path: /tmp/dry-run-image.tar
          if-no-files-found: error
          retention-days: 1

      - name: 记录 digest
        run: |
          echo "镜像 digest: ${{ steps.push.outputs.digest }}"
          echo "标签: ${{ steps.meta.outputs.tags }}"

      - name: 核验镜像不含敏感文件
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}"
          # 镜像内不得有 .env
          if docker run --rm --entrypoint sh "$IMAGE" -c 'ls -A /app | grep -qE "^\.env"'; then
            echo "::error::镜像内存在 .env 文件"
            exit 1
          fi
          # 镜像内不得有原站素材目录
          if docker run --rm --entrypoint sh "$IMAGE" -c 'test -d /app/docs/evidence'; then
            echo "::error::镜像内存在 docs/evidence 目录"
            exit 1
          fi
          echo "镜像内容检查通过 ✓"

  # ===========================================================================
  # 7. deploy-verify —— 用真实镜像跑发布版 compose + 重启持久化验证
  # ===========================================================================
  deploy-verify:
    name: 部署验证（启动 + 重启持久化）
    needs: [preflight, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ⚠️ v0.0.9：构建上下文必须与版本锚点一致（全部 8 个 job 统一）。
          #   tag push ⇒ 固定到 github.sha（Tag 指向的准确提交），
          #     保证打出的 ZIP / 镜像就是该 Tag 的代码；
          #   workflow_dispatch ⇒ 仍取 master（干跑 / 补救路径需要 master 上的修复）。
          #   历史论证（Tag 不可移动、构建代码与版本锚点解耦）见 preflight 的说明。
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}

      # dry_run 时镜像没有推到 GHCR，需要从 build-image 的 artifact 取回。
      - name: 取回镜像归档（干跑 / Draft）
        # ⚠️ B5：Draft 模式（publish=false）同样不推 registry，
        #    必须复用干跑的 artifact 传递方案，deploy-verify 才能真实安装。
        if: ${{ needs.preflight.outputs.dry_run == 'true' || needs.preflight.outputs.publish != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: dry-run-image
          path: /tmp

      - name: 载入镜像（干跑 / Draft）
        # ⚠️ B5：Draft 模式（publish=false）同样不推 registry，
        #    必须复用干跑的 artifact 传递方案，deploy-verify 才能真实安装。
        if: ${{ needs.preflight.outputs.dry_run == 'true' || needs.preflight.outputs.publish != 'true' }}
        run: |
          set -euo pipefail
          docker load -i /tmp/dry-run-image.tar
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}"
          docker image inspect "$IMAGE" >/dev/null
          echo "✓ 镜像已从归档载入：$IMAGE"

      - name: 生成随机凭据（不打印明文）
        id: creds
        run: |
          set -euo pipefail
          # 全部用十六进制随机串：不含 / + = 等字符，
          # 可直接嵌入 DATABASE_URL / REDIS_URL 而无需 URL 编码。
          # 必须是**单行**纯十六进制 —— GitHub 的 ::add-mask:: 不接受换行，
          # 用 base64 会因含 \n 导致 "Invalid format" 而失败。
          PG_PASS="$(openssl rand -hex 24 | tr -d '\n')"
          REDIS_PASS="$(openssl rand -hex 24 | tr -d '\n')"
          SESSION="$(openssl rand -hex 32 | tr -d '\n')"
          ADMIN_PASS="$(openssl rand -hex 12 | tr -d '\n')Aa1"

          # ::add-mask:: 是 **workflow command**，必须写到 stdout，
          # 写到 $GITHUB_ENV 会被当成环境变量而报 "Invalid format"。
          printf '::add-mask::%s\n' "$PG_PASS"
          printf '::add-mask::%s\n' "$REDIS_PASS"
          printf '::add-mask::%s\n' "$SESSION"
          printf '::add-mask::%s\n' "$ADMIN_PASS"

          # 实际值写入 $GITHUB_ENV 供后续步骤使用（同样保证单行）
          {
            printf 'PG_PASS=%s\n' "$PG_PASS"
            printf 'REDIS_PASS=%s\n' "$REDIS_PASS"
            printf 'SESSION=%s\n' "$SESSION"
            printf 'ADMIN_PASS=%s\n' "$ADMIN_PASS"
          } >> "$GITHUB_ENV"
          echo "随机凭据已生成并屏蔽 ✓"

      - name: 准备发布版 compose 配置
        run: |
          set -euo pipefail
          # deploy/docker-compose.yml 里写死了 `env_file: - .env`，
          # 而 compose 的 env_file 路径相对**compose 文件所在目录**解析。
          # 若把 compose 复制到仓库根目录，就必须在仓库根放一个 .env；
          # 这里直接用 deploy/ 目录里的 compose 文件，并在 deploy/ 下生成 .env，
          # 与 install.sh 的真实行为保持一致（install.sh 也把 .env 放在 deploy/ 下）。
          cd deploy
          cat > .env <<EOF
          V2EX_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.preflight.outputs.version }}
          COMPOSE_PROJECT_NAME=v2ex
          APP_PORT=3000
          APP_URL=http://localhost:3000
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          APP_RUNTIME_ENV=production
          POSTGRES_USER=v2ex
          POSTGRES_DB=v2ex
          POSTGRES_PASSWORD=${PG_PASS}
          REDIS_PASSWORD=${REDIS_PASS}
          SESSION_SECRET=${SESSION}
          SEED_ADMIN_USERNAME=admin
          SEED_ADMIN_EMAIL=admin@example.com
          SEED_ADMIN_PASSWORD=${ADMIN_PASS}
          SEED_DEMO_USERS=0
          EOF
          chmod 600 .env
          # compose 变量插值必须能读到同一个 .env
          docker compose --env-file .env config >/dev/null
          echo "发布版 compose 配置就绪 ✓"

      - name: 首次启动
        run: |
          set -euo pipefail
          cd deploy
          docker compose --env-file .env up -d
          for i in $(seq 1 60); do
            sleep 3
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              echo "应用就绪（${i} 次轮询后）"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::容器启动超时"
              docker compose --env-file .env logs --tail=100
              exit 1
            fi
          done

      - name: 验证容器健康与管理员创建
        run: |
          set -euo pipefail
          cd deploy
          docker compose --env-file .env ps
          # app 应通过 healthcheck（deploy/docker-compose.yml 已定义）。
          #
          # 注意：**必须轮询等待**，不能只查一次。
          # 上一版一次性读取 health 状态时，容器还处于 'starting'
          #（healthcheck 的 start_period 尚未结束），于是误判失败 ——
          # 而此时应用其实已经 Ready（日志里有 Ready in xxxms）。
          APP_HEALTH=""
          for i in $(seq 1 40); do
            APP_HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' v2ex-app 2>/dev/null || echo none)"
            if [ "$APP_HEALTH" = "healthy" ]; then
              break
            fi
            if [ "$APP_HEALTH" = "unhealthy" ] || [ "$APP_HEALTH" = "exited" ] || [ "$APP_HEALTH" = "none" ]; then
              echo "::error::app 容器状态异常（$APP_HEALTH），第 $i 次探测即失败"
              docker compose --env-file .env logs --tail=100
              exit 1
            fi
            sleep 3
          done
          echo "app healthcheck = $APP_HEALTH"
          if [ "$APP_HEALTH" != "healthy" ]; then
            echo "::error::app 容器在 120 秒内未变为 healthy（当前 $APP_HEALTH）"
            docker compose --env-file .env logs --tail=100
            exit 1
          fi
          # 管理员账号必须已创建
          ADMIN_COUNT="$(docker compose --env-file .env exec -T postgres \
            psql -U v2ex -d v2ex -t -A -c \
            "select count(*) from users where username='admin' and role='admin';")"
          echo "管理员账号数 = $ADMIN_COUNT"
          if [ "$ADMIN_COUNT" != "1" ]; then
            echo "::error::管理员账号未正确创建（$ADMIN_COUNT）"
            exit 1
          fi
          echo "✓ 容器健康、管理员创建成功"

      - name: 验证数据持久化（写入 → 重启 → 校验）
        run: |
          set -euo pipefail
          cd deploy
          # 注册一个测试用户，作为持久化探针。
          #
          # 必须带 CSRF token：本项目对所有写接口启用**双提交 Cookie** 防护，
          # verifyCsrf() 在缺少 CSRF Cookie 时直接判定失败并返回 403。
          # 因此先 GET 一次首页拿 v2_csrf Cookie，再用同一个值作为请求头。
          #
          # 注意：APP_RUNTIME_ENV=production 时验证码是强制项，
          # 但**注册**接口不校验验证码（只有登录接口校验），所以这里无需带 captcha。
          curl -s -c /tmp/cookies.txt -o /dev/null http://localhost:3000/
          CSRF_TOKEN="$(awk '$6 == "v2_csrf" {print $7}' /tmp/cookies.txt | tail -1)"
          if [ -z "$CSRF_TOKEN" ]; then
            echo "::error::未能从首页获取 CSRF Cookie（v2_csrf）"
            curl -s -i http://localhost:3000/ | head -20
            exit 1
          fi
          echo "已获取 CSRF token（长度 ${#CSRF_TOKEN}）"
          HTTP_CODE="$(curl -s -b /tmp/cookies.txt -X POST http://localhost:3000/api/auth/signup \
            -H 'Content-Type: application/json' \
            -H "x-csrf-token: $CSRF_TOKEN" \
            -H 'x-forwarded-for: 10.99.0.1' \
            -d '{"username":"persist_check","email":"persist@example.com","password":"Persist-Check-2026"}' \
            -o /tmp/signup.json -w '%{http_code}' || true)"
          echo "注册接口返回：$HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::注册接口未返回 201（实际 $HTTP_CODE）"
            cat /tmp/signup.json || true
            echo
            docker compose --env-file .env logs --tail=100
            exit 1
          fi

          echo "--- 重启全部容器（模拟重新部署）---"
          docker compose --env-file .env restart
          for i in $(seq 1 60); do
            sleep 3
            if curl -sf http://localhost:3000/ >/dev/null 2>&1; then
              echo "应用重启后恢复（${i} 次轮询后）"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::重启后应用未恢复"
              docker compose --env-file .env logs --tail=100
              exit 1
            fi
          done

          # 重启后测试用户必须还在
          CNT="$(docker compose --env-file .env exec -T postgres \
            psql -U v2ex -d v2ex -t -A -c \
            "select count(*) from users where username='persist_check';")"
          echo "重启后 persist_check 用户数 = $CNT"
          if [ "$CNT" != "1" ]; then
            echo "::error::重启后数据丢失（persist_check 不存在）"
            docker compose --env-file .env logs --tail=100
            exit 1
          fi
          echo "✓ 重启持久化验证通过"

      - name: 验证数据库与 Redis 端口未暴露
        run: |
          set -euo pipefail
          cd deploy
          # postgres / redis **不应**声明 ports。
          #
          # 注意：不能用 `docker compose port <svc> <port>` 来判断 ——
          # 该命令在容器内部 EXPOSE 了端口时**仍会输出**，
          # 即使 compose 并未把它发布到宿主机（实测误报）。
          #
          # 改用三重检测：
          #   ① compose 文件里确实没有 ports 声明
          #   ② 宿主机上真的连不上该端口（实际 TCP 连接测试）
          #   ③ 宿主机没有对应的监听套接字
          fail=0

          # ① compose 声明检查
          for svc in postgres redis; do
            if docker compose --env-file .env config 2>/dev/null \
                 | grep -A20 "^  ${svc}:" | grep -qE '^\s+published:'; then
              echo "::error::compose 配置里 $svc 声明了 published 端口"
              fail=1
            fi
          done

          # ② 实际 TCP 连接测试（从宿主机直连）
          for target in "5432 PostgreSQL" "6379 Redis"; do
            port="${target%% *}"
            name="${target##* }"
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "::error::$name 端口 $port 可从宿主机直连 —— 已被暴露"
              fail=1
            else
              echo "✓ $name 端口 $port 无法从宿主机直连"
            fi
          done

          # ③ 宿主机监听套接字检查
          if command -v ss >/dev/null 2>&1; then
            for port in 5432 6379; do
              if ss -ltn 2>/dev/null | grep -qE "[:.]${port}\s"; then
                echo "::error::宿主机有进程监听 $port"
                fail=1
              fi
            done
          fi

          if [ "$fail" -ne 0 ]; then
            docker compose --env-file .env ps
            exit 1
          fi
          echo "✓ 数据库与 Redis 未暴露端口"

      - name: 收集容器日志
        if: always()
        run: cd deploy && docker compose --env-file .env logs --tail=200 > ../deploy-logs.txt 2>&1 || true

      - name: 上传部署验证日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-verify-logs
          path: deploy-logs.txt
          if-no-files-found: warn
          retention-days: 7

      - name: 清理
        if: always()
        run: cd deploy && docker compose --env-file .env down -v || true

  # ===========================================================================
  # 8. package —— 生成安装包 + 校验和
  # ===========================================================================
  package:
    name: 生成安装包
    needs: [preflight, build-image, deploy-verify]
    runs-on: ubuntu-latest
    outputs:
      zip_name: ${{ steps.pkg.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # ⚠️ v0.0.9：构建上下文必须与版本锚点一致（全部 8 个 job 统一）。
          #   tag push ⇒ 固定到 github.sha（Tag 指向的准确提交），
          #     保证打出的 ZIP / 镜像就是该 Tag 的代码；
          #   workflow_dispatch ⇒ 仍取 master（干跑 / 补救路径需要 master 上的修复）。
          #   历史论证（Tag 不可移动、构建代码与版本锚点解耦）见 preflight 的说明。
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}

      - name: 打包 deploy/ 目录
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          ZIP="v2ex-clone-${VERSION}-deploy.zip"
          # 明确排除生成的配置与备份目录（.gitignore 已排除，这里显式再挡一次）
          #
          # ⚠️ N5：补上 .env.* 变体、私钥 / 证书 / 测试凭据文件。
          #    ⚠️ 刻意**不用** 'deploy/.env.*' 通配 —— 那会误伤必须随包
          #    分发的 .env.example 模板（下面的完整性校验要求它在包内）。
          #    因此逐项列出危险的变体名，把模板保留下来。
          zip -r "$ZIP" deploy/ \
            -x 'deploy/.env' \
               'deploy/.env.local' 'deploy/.env.test' 'deploy/.env.production' \
               'deploy/.env.development' 'deploy/.env.*.local' 'deploy/.env.backup*' \
               'deploy/INSTALL_CREDENTIALS.txt' \
               'deploy/*credentials*' 'deploy/*password*.txt' \
               'deploy/*.pem' 'deploy/*.key' 'deploy/*.p12' 'deploy/*.pfx' \
               'deploy/backups/*' \
               'deploy/*.log'
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum "$ZIP_NAME" > SHA256SUMS
          cat SHA256SUMS

      - name: 校验安装包内容完整性
        run: |
          set -euo pipefail
          REQUIRED="docker-compose.yml .env.example install.sh install.ps1 start.sh stop.sh update.sh backup.sh README.md INSTALL.md VERSION LICENSE"
          rm -rf /tmp/verify-zip && mkdir -p /tmp/verify-zip
          unzip -q "$ZIP_NAME" -d /tmp/verify-zip
          # ── D-01：安装包顶层目录必须是 `deploy/` ──
          # Release Notes 里的安装命令（`cd <解压目录>/deploy`）依赖这个
          # 结构。此处断言产物结构，与 publish-release 里针对 Notes 的
          # 断言互为两侧 —— 任一侧改动而另一侧没跟上，流水线当场判红。
          ZIP_ROOT="$(unzip -Z1 "$ZIP_NAME" | head -1 | cut -d/ -f1)"
          if [ "$ZIP_ROOT" != "deploy" ]; then
            echo "::error::安装包顶层目录应为 deploy，实际为 '${ZIP_ROOT}'"
            exit 1
          fi
          echo "✓ 安装包顶层目录：${ZIP_ROOT}/"
          # ── V9-09：包内脚本必须带可执行位 ──
          # `zip` 会把 Git 的 100644 原样写进 ZIP 的外部属性，解压后就是
          # 0644 ⇒ `./install.sh` 直接 Permission denied。
          # v0.0.1~v0.0.9 的**全部**发布包都有这个问题（已用 v0.0.4 官方包
          # 实测：6 个 .sh 全是 0o100644）；文档只写了 `chmod +x install.sh`，
          # 于是主流程能跑，`./start.sh` / `./backup.sh` 仍然报错。
          # 源码权限位已在 v0.0.9 之后修正为 100755，此处断言防止回退。
          for f in /tmp/verify-zip/deploy/*.sh; do
            if [ ! -x "$f" ]; then
              echo "::error::包内脚本缺少可执行位：$(basename "$f")（Git 应为 100755）"
              ls -l "$f"
              exit 1
            fi
          done
          echo "✓ 包内脚本均带可执行位（$(ls /tmp/verify-zip/deploy/*.sh | wc -l | tr -d ' ') 个）"
          missing=0
          for f in $REQUIRED; do
            if [ ! -f "/tmp/verify-zip/deploy/$f" ]; then
              echo "::error::安装包缺少必需文件：$f"
              missing=1
            fi
          done
          # 不得包含生成的 .env
          if [ -f /tmp/verify-zip/deploy/.env ]; then
            echo "::error::安装包内含 deploy/.env"
            missing=1
          fi
          # 不得包含凭据文件
          if [ -f /tmp/verify-zip/deploy/INSTALL_CREDENTIALS.txt ]; then
            echo "::error::安装包内含 INSTALL_CREDENTIALS.txt"
            missing=1
          fi
          # 不得包含原站素材（用固定前缀匹配，不用 glob）
          if find /tmp/verify-zip \( -name 'ref-*.png' -o -name 'diff-*.png' \) | grep -q .; then
            echo "::error::安装包内含原站素材"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "--- 安装包实际内容 ---"
            find /tmp/verify-zip -type f | sort
          fi
          exit $missing

      - name: 包内版本一致性校验（N2）
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          D=/tmp/verify-zip/deploy
          [ -d "$D" ] || { echo "::error::未找到解压后的 deploy/（上一步应已解压）"; exit 1; }
          EXPECTED_VERSION="${VERSION#v}"
          EXPECTED_IMAGE="ghcr.io/alicia1030su/v2ex-clone:${VERSION}"

          PKG_VERSION="$(tr -d '\r\n ' < "$D/VERSION")"
          [ "$PKG_VERSION" = "$EXPECTED_VERSION" ] || {
            echo "::error::deploy/VERSION = $PKG_VERSION（应为 $EXPECTED_VERSION）"; exit 1; }

          ENV_IMAGE="$(sed -n 's/^V2EX_IMAGE=//p' "$D/.env.example" | tail -1 | tr -d '\r\n ')"
          [ "$ENV_IMAGE" = "$EXPECTED_IMAGE" ] || {
            echo "::error::deploy/.env.example 的 V2EX_IMAGE = $ENV_IMAGE（应为 $EXPECTED_IMAGE）"; exit 1; }

          COMPOSE_IMAGE="$(sed -n 's/.*image: ${V2EX_IMAGE:-\([^}]*\)}.*/\1/p' "$D/docker-compose.yml" | head -1 | tr -d '\r\n ')"
          [ "$COMPOSE_IMAGE" = "$EXPECTED_IMAGE" ] || {
            echo "::error::deploy/docker-compose.yml 默认镜像 = $COMPOSE_IMAGE（应为 $EXPECTED_IMAGE）"; exit 1; }

          # ⚠️ N2 提醒：**只检查标题首行**。INSTALL.md 正文里有 3 处历史
          #    语境的 v0.0.4（R-18 修复说明：「已知限制，v0.0.4 标注」等），
          #    全文匹配会把它们误判成版本不一致；标题首行才表示「本包版本」。
          for doc in README.md INSTALL.md; do
            FIRST="$(head -1 "$D/$doc")"
            case "$FIRST" in
              *"$VERSION"*) ;;
              *) echo "::error::$doc 标题首行版本标注不是 $VERSION：'$FIRST'"; exit 1 ;;
            esac
          done
          echo "✓ 包内版本一致：VERSION=$PKG_VERSION / V2EX_IMAGE=$ENV_IMAGE / compose=$COMPOSE_IMAGE / 文档标题=$VERSION"

      - name: 上传安装包与校验和
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            ${{ steps.pkg.outputs.zip_name }}
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # 9. publish-release —— 创建并发布 Release
  # ===========================================================================
  publish-release:
    name: 创建并发布 Release
    # ⚠️ v0.0.9（N3）：显式依赖 build-image，Release Notes 才能写入
    #    **真实**镜像 digest（GitHub 只允许读直接依赖 job 的 outputs）。
    needs: [resolve-tag, preflight, build-image, package]
    runs-on: ubuntu-latest
    # dry_run=true 时**完全跳过**本 job ——
    # 修复前本 job 没有任何条件判断，勾选「仅验证」也会真的发 Release。
    # 判定写在 job 级 if 上，而不是每个 step 上 ——
    # 这样 dry_run 时连 job 都不会被调度，contents:write 根本不会生效。
    if: needs.preflight.outputs.dry_run != 'true'
    permissions:
      contents: write
      # ⚠️ v0.0.4（保留但**未证实**）：原假设「创建 Draft Release 需要
      #   `pull-requests: write`」—— 加上后 run `41983127742` **仍然 403**，
      #   且 v0.0.3 仅用 `contents: write` 就成功创建过 Draft。
      #   ⇒ 该假设**不成立**，权限项不是根因。
      #   此项暂予保留（无害，且 Draft 语义上确属 PR-like 资源）；
      #   真实根因由紧随其后的「诊断 token 权限与 API 错误详情」步骤查明。
      pull-requests: write
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@v8
        with:
          name: release-package
          path: release-assets

      # ── 权限记录步骤（v0.0.4）──────────────────────────────────────
      # 本步骤原本是「诊断」—— 用于定位 `gh release create` 连续 403 的根因。
      # **根因已定位**（见下方「创建 Release」步骤的注释）：不是权限问题，
      # 而是 `gh release create` 这个 CLI 封装自身的行为。
      #   实测证据（run `41985412431`）：
      #     - `gh api --method POST /releases` → **成功**（id 434887371）
      #     - `gh release create`               → 403（同一个 token、同一个 job）
      # 诊断阶段曾采集到的 `.permissions` 全为 false —— 但那**不是**根因，
      # 因为同一个 token 下 `gh api` 的 POST 成功了。
      # （`.permissions` 字段反映的是 GitHub App installation 的权限，
      #   与 GITHUB_TOKEN 在当前 job 的实际可用权限不是同一回事。）
      #
      # 因此本步骤降级为**只读记录**：把当前 token 的权限映射打进日志，
      # 便于将来排查，**不再创建任何 Release / tag**。
      - name: 记录 token 权限映射（只读）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "=== 当前 token 对本仓库的权限映射 ==="
          gh api "repos/${{ github.repository }}" --jq '.permissions' \
            || echo "(查询失败 —— 不影响后续步骤)"

      - name: 再次检查冲突（防止竞态）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          REPO: ${{ github.repository }}
          PUBLISH: ${{ needs.preflight.outputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh --version
          # ⚠️ B3：竞态检查也必须 fail-closed —— 查询失败 / 已公开一律
          #    exit 1，不能把「查不到」当成「不存在」。
          #    B2：Draft + publish=true + dispatch ⇒ 允许继续，并把
          #    resume_draft / release_id 写入 GITHUB_ENV 供后续步骤复用。
          if ! gh api "repos/$REPO/releases?per_page=100" > /tmp/release-race.json; then
            echo "::error::竞态检查查询 Release 列表失败 —— 中止发布"
            exit 1
          fi
          python3 - "$VERSION" "$PUBLISH" "$EVENT_NAME" <<'PY'
          import json, os, sys
          version, publish, event = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              lst = json.load(open('/tmp/release-race.json', encoding='utf-8'))
          except Exception as e:
              print('::error::竞态检查解析 Release 列表失败：', e); sys.exit(1)
          if not isinstance(lst, list):
              print('::error::Release 列表不是数组：', lst.get('message', '未知错误')); sys.exit(1)
          hit = [r for r in lst if r.get('tag_name') == version]
          if not hit:
              print('竞态检查：Release 仍不存在 —— 正常创建路径'); sys.exit(0)
          d = hit[0]
          if not bool(d.get('draft')):
              print('::error::Release', version, '在竞态窗口内已公开发布 —— 中止'); sys.exit(1)
          if not (event == 'workflow_dispatch' and publish == 'true'):
              print('::error::Release', version, '已存在（Draft），本轮不是 publish=true 的转公开补救路径'); sys.exit(1)
          rid = str(d.get('id', ''))
          if not rid:
              print('::error::Draft Release 缺少 id'); sys.exit(1)
          names = [a.get('name', '') for a in d.get('assets', [])]
          print('已有 Draft 资产清单：', names)
          if not any('deploy.zip' in n for n in names) or 'SHA256SUMS' not in names:
              print('::error::已有 Draft 资产不齐全 —— 不进入转公开路径'); sys.exit(1)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('resume_draft=true\n')
              f.write('release_id=%s\n' % rid)
          print('::notice::幂等转公开：复用已有 Draft（id=%s），跳过创建与上传资产' % rid)
          PY
          # tag 也不能在竞态窗口内被别人**移动**。
          #
          # ⚠️ v0.0.4：不能简单地「tag 存在就中止」——
          #   「补救路径」（Tag 已存在、Release 未创建）正是靠 tag 存在才成立，
          #   一律拦死会让补救路径永远走不到这一步。
          #
          # 改为**校验 tag 指向没变**：竞态窗口内若有人移动了 tag，
          # 产出的包就与版本锚点脱钩 ⇒ 必须中止。
          # 与 preflight 的「补救路径」判定用同一套判据：
          #   tag 指向的 commit 必须与 preflight 判定过的那一个一致。
          # ⚠️ 本 job **没有 checkout** ⇒ 没有 `.git` / `origin` ⇒
          #   `git ls-remote origin` 会报 exit 128。
          #
          # ⚠️ 而且**必须当场重新解析**，不能直接用 `needs.resolve-tag.outputs.sha`：
          #   那个 output 是**几分钟前的快照**（resolve-tag job 早就跑完了），
          #   而 `needs.preflight.outputs.tag_sha` **也是**同一个 output
          #   ⇒ 两者比较**恒为相等** ⇒ 竞态窗口内 tag 被移动**永远检测不到**。
          #   竞态检查的价值就在于「现在」vs「开始时」，必须重新拉一次远端状态。
          TAG_SHA_NOW="$(gh api "repos/${{ github.repository }}/git/ref/tags/$VERSION" 2>/dev/null | python3 -c "
          import json,sys
          try:
              print(json.load(sys.stdin).get('object', {}).get('sha',''))
          except Exception:
              print('')
          " 2>/dev/null)"
          TAG_TYPE_NOW="$(gh api "repos/${{ github.repository }}/git/ref/tags/$VERSION" 2>/dev/null | python3 -c "
          import json,sys
          try:
              print(json.load(sys.stdin).get('object', {}).get('type',''))
          except Exception:
              print('')
          " 2>/dev/null)"
          if [ "$TAG_TYPE_NOW" = "tag" ] && [ -n "$TAG_SHA_NOW" ]; then
            TAG_SHA_NOW="$(gh api "repos/${{ github.repository }}/git/tags/$TAG_SHA_NOW" 2>/dev/null | python3 -c "
          import json,sys
          try:
              print(json.load(sys.stdin).get('object', {}).get('sha',''))
          except Exception:
              print('')
          " 2>/dev/null)"
          fi
          if [ -z "$TAG_SHA_NOW" ]; then
            echo "::error::无法读取远端 tag $VERSION 的目标 commit（竞态检查）"
            exit 1
          fi
          if [ "$TAG_SHA_NOW" != "${{ needs.preflight.outputs.tag_sha }}" ]; then
            echo "::error::Tag $VERSION 在竞态窗口内被移动（现在指向 $TAG_SHA_NOW，"
            echo "::error::发布开始时指向 ${{ needs.preflight.outputs.tag_sha }}），中止发布。"
            exit 1
          fi
          echo "✓ Tag $VERSION 指向未变（$TAG_SHA_NOW）"

      - name: 生成中文 Release Notes
        env:
          # ⚠️ N3：把 build-image 实测 digest 注入 Notes，取代原先
          #    「镜像 Digest 见本 Release 页面」这句无法兑现的声明。
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::build-image 未产出镜像 digest，拒绝写出无法核验的 Release Notes"
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## __VERSION__ — 开发预览版（Pre-release）

          > ⚠️ **这是早期开发预览版（Pre-release），不是稳定版。**
          > 功能尚未完备，**不保证与 V2EX 完全一致**，**不建议直接用于生产环境**。
          > 本项目 `0.0.x` 全部为早期开发预览版，不承诺 API 稳定性。

          ### 关于本项目

          本项目是对 `https://www.v2ex.com/` 的**技术研究与高保真界面还原实验**，
          与 V2EX 官方**无任何关联**、**未获官方授权**、**不是** V2EX 官方产品。
          MIT 许可证**不授予** V2EX 商标使用许可。

          ### v0.0.9 更新内容

          - **候选离线安装链路**：固定 SHA 构建 → 导出镜像 tar → 候选安装包 +
            SHA256SUMS → 独立环境 `docker load` 全链路验证（迁移 / Redis /
            健康检查 / 登录 / 发帖 / 回复 / 重启不丢数据 / 端口未暴露）。
            候选包内镜像引用由脚本统一改写，不再指向不存在的远端标签。
          - **可观测性修复（P0）**：修复 API 错误率统计失效——原埋点在
            middleware 独立 bundle 里拿不到真实状态码（`byStatus` 恒为
            `{200: N}`）。现由 `src/instrumentation.ts` 在 Node HTTP 层
            拦截 `writeHead` 取**真实**状态码与耗时；计数状态挂
            `globalThis`（跨 bundle 可见），键基数有界（≤2000）。
          - **全新安装验收**：`verify-fresh-install.sh` 22 项断言（显式清空
            开发机环境变量，防止误连开发库）。
          - **真实升级验证**：以**已发布的 v0.0.4 与 v0.0.9** 为双基线，
            46 项业务数据指纹逐字节一致；迁移幂等（连跑 3 次）；
            备份 → 恢复后指纹与升级后库完全一致；旧口令哈希仍可登录。
            （V9-11 勘误：旧文案写「60 项」是未经复算的手写数字，
            仓库脚本可复现的口径是 46 项业务指纹 / 指纹文件 49 行。）
          - **运维可靠性**：故障注入验证 21 项（0 跳过）。
          - **长时间运行稳定性**：分段化工作流 + 时长诚实性闸门（见下文
            「稳定性验证的真实状态」）。

          ### 功能清单

          - **账号**：注册、登录、退出、会话保持（HttpOnly / SameSite=Lax /
            Secure 条件启用）、修改密码、邮箱找回密码（链接仅取可信配置 Origin）
          - **用户**：个人主页、头像上传（magic number 校验 / 服务端生成路径 /
            2MB 上限 / sharp 像素上限）、关注、收藏
          - **节点**：列表、详情、子节点树、创建（管理员直生效 / 版主待审）、审核
          - **主题**：发布、列表、详情、浏览计数、Markdown 渲染、标签、
            投票（顶/踩）、软删除、锁定、置顶
          - **回复**：发布、楼层号分配（唯一索引保证连续）、分页
          - **互动**：感谢（thank）、收藏、通知、关注
          - **积分**：签到、积分流水账本、排行榜
          - **搜索**：主题搜索
          - **RSS**：节点 / 首页 Feed
          - **后台管理**：概览、待审、日志、节点审批、举报处理、封禁、角色变更
          - **权限**：user / moderator / admin 三级角色
          - **安全**：CSRF 防护、XSS 清洗、限流（登录 / 发帖 / 回复 / 创建节点 /
            上传）、开放重定向防护、安全响应头、Host Header 不可信
            （`fail-closed`，邮件链接只信 `PUBLIC_BASE_URL` / `APP_URL`）、
            服务端 SVG 验证码（哈希存储、一次性）
          - **可观测性**：结构化 JSON 日志（stdout，敏感字段脱敏）、
            进程内指标窗口（真实状态码分布 / 5xx、4xx 按路由聚合 / 慢请求）、
            `/api/admin/ops` 运维端点
          - **存储**：PostgreSQL 17 持久化（Drizzle 迁移），Redis 可选
            （缺失自动降级为 PgKV）
          - **部署**：Docker 多阶段镜像 + Compose 三阶段启动
            （迁移 → 首次初始化 → 启动），含备份 / 恢复 / 更新脚本

          ### 已知限制（如实标注，不阻塞预览版使用）

          - **主题编辑与删除**：未实现（作者侧）
          - **私信**：未实现
          - **真实 SMTP 邮件投递**：未在发布流程中实测（需运维配置 SMTP）
          - **多浏览器视觉回归**：CI 覆盖 Chromium；Firefox / Safari 未覆盖
          - **原站需登录页面对照**：无权访问他人账号，未拿游客态冒充登录态
          - **指标窗口为进程内聚合**：多实例部署各进程一份，需集中式日志系统
            才能跨实例聚合
          - **版主 / 管理员的部分操作为 API 层验证**，UI 点击流覆盖不完整

          ### 安装

          **Linux / macOS**
          ```bash
          unzip v2ex-clone-__VERSION__-deploy.zip -d v2ex-clone-__VERSION__-deploy
          cd v2ex-clone-__VERSION__-deploy/deploy
          chmod +x install.sh
          ./install.sh
          ```

          **Windows（PowerShell）**
          ```powershell
          Expand-Archive -Path v2ex-clone-__VERSION__-deploy.zip -DestinationPath v2ex-clone-__VERSION__-deploy
          cd v2ex-clone-__VERSION__-deploy\deploy
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          ```

          安装完成后访问 <http://localhost:3000>。
          安装脚本会生成随机的数据库口令、Redis 口令与会话密钥，
          并把管理员凭据写入 `INSTALL_CREDENTIALS.txt`（权限 600）。

          **从 v0.0.4 升级**（唯一已公开发布的可升级基线）：
          ```bash
          cd v2ex-clone-__VERSION__-deploy/deploy
          ./update.sh        # 保留数据卷，仅更新镜像与迁移
          ```
          升级路径已经**实测**（两条基线，见 `docs/UPGRADE_VERIFICATION_v0.0.10.md`）：
          - **v0.0.4 → __VERSION__**：迁移 3 → 4、索引 76 → 78
          - **v0.0.9 → __VERSION__**：结构不变（无新增迁移）

          两条路径的 **46 项业务数据指纹逐字节一致**（不是抽样），迁移连跑 3 次幂等，
          备份 → 恢复到独立库后指纹与升级后库完全一致，旧口令哈希可正常登录。

          **回滚**：
          ```bash
          ./restore.sh <备份文件>   # 先恢复数据
          ```
          回滚到更早版本需配合对应版本的部署包；数据卷不随 `stop` / `update.sh`
          删除，但 `docker compose down -v` 会**永久删除**数据，操作前必须备份。

          ### 系统要求

          - Docker 20.10 或更高
          - Docker Compose v2
          - 至少 2 GB 可用磁盘
          - 端口 3000 未被占用

