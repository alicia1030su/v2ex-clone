name: 长时间运行稳定性

# ---------------------------------------------------------------------------
# v0.0.9 —— 持续运行稳定性验证
#
# ## 平台限制（本设计的存在理由）
#
# **GitHub-hosted runner 的单个 job 最长只能运行 6 小时。**
# 因此「单 job 跑 24 小时」在架构上**不可能完成**。
# 早先版本声明默认 24 小时、却只给 `timeout-minutes: 80`
# ⇒ job 在 80 分钟被杀掉，而工作流宣称目标是 24 小时
# ⇒ **对运行时长的错误承诺**。该设计已废弃。
#
# ## 现设计：两种**如实**模式，按触发事件分流
#
#   ┌─ push / schedule ────────► **1 小时冒烟**（单段，job 级时长诚实闸门）
#   │
#   └─ workflow_dispatch ──────► **24 小时分段链**（串行 5 段）
#                                  段1(5h) → 段2(5h) → 段3(5h) → 段4(5h) → 段5(4h)
#
#   · 每段是 `soak-segment.yml` 的独立调用，**每段 ≤ 5 小时**
#     （低于平台 6 小时上限，留 40 分钟余量）；
#   · 段与段之间用 `needs:` **串行**（不是 matrix —— matrix 是并行的！）；
#   · 每段通过 artifact 传递「累计真实运行时长 + 采样证据」；
#   · 汇总 job 核对**累计时长**：累计真实时长达不到目标 ⇒ 失败。
#
# ## ⚠️ v0.0.9 修正：不再用「注释」承诺与「实际」不符的时长
#
# 上一版在触发条件注释里写「push 到 master（1 小时冒烟）」，
# 但 job 的 `segment_hours` 硬编码 5/5/5/5/4 —— **每次 push 实际都跑
# 完整 24 小时链**，且 dispatch 的 `hours` 输入是**死参数**
# （没有任何 job 读取它）。注释说 1 小时、实际跑 24 小时，
# 本身就是一类「对运行时长的错误承诺」。本版把模式与触发事件
# **在 job 级 `if` 上显式绑定**，注释与行为逐字对应。
#
# ## 时长诚实性（四重保障）
#
#   1. 每段 job 内置**本段时长闸门**：实际秒数 < 目标秒数 - 300 ⇒ job 失败；
#   2. 汇总 job 核对**累计实际秒数** vs 目标秒数，达不到 ⇒ job 失败；
#   3. 段与段之间的**空闲间隙**（排队、runner 启动）**不计入**累计时长
#      ⇒ 「24 小时」指**应用实际持续运行** 24 小时，
#      而不是「从派发到结束过了 24 小时」；
#   4. 证据文件（baseline.txt / state.env）同时记录
#      「本段配置时长 / 本段实际时长 / 累计实际时长」三个数，
#      任何声称「24 小时验证完成」的报告必须引用**累计实际时长**。
#
# ## 发布门禁中的定位（v0.0.9 发行决定，主人已授权一次性例外）
#
#   · **1 小时冒烟**：纳入 v0.0.9 发布门禁（最终 SHA 上必须真实通过）；
#   · **24 小时分段链**：**未完成** —— 明确列为后续稳定性验证项，
#     不冒充、不伪造、不等待。发布时间以流水线日志与 artifact 为准。
#
# ## 24 小时运行的真实结论（Run 42362649887，只读核查，不得改写）
#
# 旧设计的单 Job「持续运行 24 小时」在 `timeout-minutes: 80` 下：
#   · 2026-11-07T10:08:10Z 创建，11:09:14Z job 启动，12:29:31Z 被取消；
#   · 结论 **cancelled**，日志 `The operation was canceled.`；
#   · 证据 artifact 中 `health-samples.csv` 最大 `elapsed_s=4687`
#     （约 1 小时 18 分），79 次采样全 200/200，errors.log 0 行；
#   · 脚本**没有**走到「按真实秒数报告」的结束分支 ⇒ 无任何 24h 结论。
# ⇒ **24 小时验证未完成**。80 分钟不得冒充 24 小时，
#   不得把该 run 标记为 PASSED，不得修改历史测试数据。
# 本仓 self-hosted runners 数量为 0，本机 Docker daemon 不可用
# ⇒ 本轮不存在可跑满 24 小时连续测试的授权长期环境。
# 详见 `docs/SOAK_24H_FINDING_v0.0.9.md`。
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    # ⚠️ 刻意**不提供** `hours` 之类的时长输入。
    # 上一版的 `hours` 输入没有任何 job 读取（死参数），
    # 只会给人「可以指定任意时长」的错觉。dispatch 的语义
    # 现在唯一且明确：**完整 24 小时分段链**。
    # 需要其他时长 ⇒ 改 job 定义（受 PR 审查），不靠运行时可调。
  schedule:
    # 每天 03:17 UTC（避开整点，减少与其他任务争抢 runner）—— 1 小时冒烟
    - cron: '17 3 * * *'
  push:
    branches:
      - master
      - 'feat/v0.0.9-release-readiness'
      - 'release/v*'
      # v0.0.9：补上 fix/** —— 与 ci.yml / install-verify.yml 的分支集一致。
      # 缺它时，修复分支（含本次 soak 设计修复自身的验证）推上去
      # **不会触发任何冒烟** ⇒ 新设计在合入 master 前未经受一次真实运行。
      - 'fix/**'
    paths:
      - 'src/**'
      - 'scripts/release/verify-soak.sh'
      - '.github/workflows/soak-test.yml'
      # ⚠️ v0.0.9：**刻意不列** `.github/workflows/soak-segment.yml`。
      #
      # `soak-segment.yml` 是**可复用工作流**（`workflow_call`），它本身
      # 没有 `push` 触发器。若把它的路径写进本工作流的 `push.paths`，
      # 一次触及它的 push 会**同时**创建：
      #   · 本工作流的 run（正常）；
      #   · `soak-segment.yml` 的 run（**0 秒即失败**，因为它没有 push 触发器）。
      # 实测：run 42380490805 / 42380491864 均 0s failure。
      #
      # ⇒ 只由本工作流通过 `uses:` 调用它。

concurrency:
  # ⚠️ v0.0.9：按**事件类型**分租车道。
  #
  # 上一版所有事件共用一个组（`soak-${{ github.ref }}`）且
  # `cancel-in-progress: false` ⇒ dispatch 的 24 小时链会把随后
  # 每一次 push 冒烟**堵死排队**（实测：dispatch run 42382408316
  # 在 push run 后面干等 24 小时，一个 job 都没跑）。
  #
  # 现在：
  #   · push / schedule 冒烟 → `soak-smoke-<ref>`（互相之间最多排队 1 小时）
  #   · dispatch 长跑链     → `soak-long-<ref>`（与冒烟**互不阻塞**）
  #
  # `cancel-in-progress: false` 对两者都保持：长跑被取消会丢失全部证据；
  # 冒烟被取消同样丢掉一段真实运行记录 —— 排队好过假装跑过。
  group: soak-${{ github.event_name == 'workflow_dispatch' && 'long' || 'smoke' }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # ⚠️ v0.0.9：调用方**自己**也需要 artifact 权限 ——
  #   被调用方（soak-segment.yml）声明的权限**不能**覆盖调用方的限制
  #   （GitHub 取两者的交集）。
  #   `summary` job 要用 `gh run download` 取回最后一段的状态 artifact ⇒
  #   需要 `actions: read`。
  #
  # ⚠️ `actions` 只能写**一次** —— YAML 里重复的 key 会被后者覆盖（静默生效），
  #    写了两次 `actions:` 只会保留 `write`，`read` 丢失。
  #    （GitHub 权限模型里 `write` **蕴含** `read` ⇒ 写 `write` 一项即可。）
  actions: write

jobs:
  # ===========================================================================
  # 冒烟 —— push / schedule 触发，1 小时，单段
  # ===========================================================================
  #
  # 为什么 push 只跑 1 小时：
  #   · 每次 push 都挂一条 24 小时链，等于用 runner 时间给「推送频率」买单；
  #   · 冒烟的价值是**快速**发现「启动即坏 / 探针即失败」类回归，
  #     1 小时足够暴露；更长的稳定性由 dispatch 链与每日 schedule 承担；
  #   · 冒烟的**实际时长**由段内闸门核实，短跑会被判红，不会冒充。
  smoke:
    name: 持续运行冒烟 · 1 小时
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/soak-segment.yml
    with:
      segment_index: 'smoke'
      segment_hours: '1'
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # 段 1 —— 5 小时（仅 dispatch）
  # ===========================================================================
  seg1:
    name: 持续运行 · 第 1 段
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/soak-segment.yml
    with:
      segment_index: '1'
      segment_hours: '5'
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # 段 2 —— 续段 1
  # ===========================================================================
  seg2:
    name: 持续运行 · 第 2 段
    if: github.event_name == 'workflow_dispatch'
    needs: seg1
    uses: ./.github/workflows/soak-segment.yml
    with:
      segment_index: '2'
      segment_hours: '5'
      prev_state_artifact: soak-state-1
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # 段 3
  # ===========================================================================
  seg3:
    name: 持续运行 · 第 3 段
    if: github.event_name == 'workflow_dispatch'
    needs: seg2
    uses: ./.github/workflows/soak-segment.yml
    with:
      segment_index: '3'
      segment_hours: '5'
      prev_state_artifact: soak-state-2
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # 段 4
  # ===========================================================================
  seg4:
    name: 持续运行 · 第 4 段
    if: github.event_name == 'workflow_dispatch'
    needs: seg3
    uses: ./.github/workflows/soak-segment.yml
    with:
      segment_index: '4'
      segment_hours: '5'
      prev_state_artifact: soak-state-3
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # 段 5 —— 最后一段（4 小时，累计 24 小时）
  # ===========================================================================
  seg5:
    name: 持续运行 · 第 5 段
    if: github.event_name == 'workflow_dispatch'
    needs: seg4
    uses: ./.github/workflows/soak-segment.yml
    with:
      segment_index: '5'
      segment_hours: '4'
      prev_state_artifact: soak-state-4
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # 汇总 —— 核对累计真实时长（仅 dispatch）
  # ===========================================================================
  summary:
    name: 汇总与时长核对
    if: github.event_name == 'workflow_dispatch'
    needs: [seg1, seg2, seg3, seg4, seg5]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 核对累计实际时长
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 目标：5+5+5+5+4 = 24 小时（与上面 5 个 seg job 的 segment_hours 逐字对应；
          # 改动任何一段时长时必须同步改这里，否则闸门失去意义）
          TARGET_SECONDS=$(( (5 + 5 + 5 + 5 + 4) * 3600 ))

          gh run download "${{ github.run_id }}" \
            --name "soak-state-5" \
            --dir /tmp/last-state
          STATE=/tmp/last-state/state/state.env
          [ -f "$STATE" ] || { echo "::error::未找到最后一段的状态文件"; exit 1; }
          sed 's/^/  /' "$STATE"

          ACTUAL=$(grep -E '^CUMULATIVE_SECONDS=' "$STATE" | cut -d= -f2)
          SAMPLES=$(grep -E '^SAMPLES_TOTAL=' "$STATE" | cut -d= -f2)
          HFAILS=$(grep -E '^HEALTH_FAILS=' "$STATE" | cut -d= -f2)
          RFAILS=$(grep -E '^READY_FAILS=' "$STATE" | cut -d= -f2)

          echo ""
          echo "  目标时长：${TARGET_SECONDS} 秒（24 小时）"
          echo "  累计实际：${ACTUAL} 秒"
          echo "  累计采样：${SAMPLES} 次"
          echo "  健康失败：${HFAILS} 次"
          echo "  就绪失败：${RFAILS} 次"

          if [ "${ACTUAL:-0}" -lt "$((TARGET_SECONDS - 300))" ]; then
            echo "::error::累计实际运行时长 ${ACTUAL} 秒 < 目标 ${TARGET_SECONDS} 秒 —— **不得**声称达成持续运行验证"
            exit 1
          fi
          echo "  ✓ 累计实际时长达到目标"

          if [ "${HFAILS:-0}" != "0" ] || [ "${RFAILS:-0}" != "0" ]; then
            echo "::error::持续运行期间存在探针失败（health=${HFAILS} ready=${RFAILS}）"
            exit 1
          fi
          echo "  ✓ 全程探针无失败"

      - name: 汇总说明
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo " 累计时长 = 各段**真实运行秒数之和**"
          echo " 段间排队 / runner 启动间隙**不计入**"
          echo " ⇒「24 小时」指应用实际持续运行 24 小时"
          echo "════════════════════════════════════════════════════"
