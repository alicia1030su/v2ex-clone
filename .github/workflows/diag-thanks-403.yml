name: 诊断：Firefox thanks 403（v0.0.7）

# ---------------------------------------------------------------------------
# 针对性诊断工作流 —— 不复用矩阵的完整套件，只跑最小复现 + 现场取证
#
# 触发方式：workflow_dispatch（需要时手动跑，不占 PR 流程）
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      browser:
        description: '浏览器（chromium/firefox/webkit）'
        default: 'firefox'
        required: true

jobs:
  diag:
    name: Firefox thanks 403 取证
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_VERSION: '22.23.4'
      APP_RUNTIME_ENV: test
      TEST_ENV_ISOLATED: '1'
      DISABLE_CAPTCHA: '1'
      ENABLE_DEBUG_ENDPOINTS: '1'
      DEBUG_ENDPOINT_TOKEN: ci-debug-token-not-for-production
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_EMAIL: admin@ci.local
      SEED_ADMIN_PASSWORD: ci-admin-password-12345
      SEED_DEMO_USERS: '1'
      SEED_DEMO_PASSWORD: ci-demo-password-12345
      SMTP_ALLOW_REAL_IN_TEST: '1'
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '3299'
      SMTP_FROM: noreply@v2ex-clone.local
      SMTP_SECURE: '0'
      RATE_LIMIT_LOGIN_MAX: '10'
      RATE_LIMIT_POST_MAX: '5'
      RATE_LIMIT_REPLY_MAX: '20'
      RATE_LIMIT_WINDOW_SECONDS: '60'
      RATE_LIMIT_REPLY_WINDOW_SECONDS: '120'
      RATE_LIMIT_REGISTER_MAX: '5'
      RATE_LIMIT_REGISTER_IP_MAX: '20'
      RATE_LIMIT_REGISTER_WINDOW_SECONDS: '300'
      no_proxy: 'localhost,127.0.0.1,::1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2ex
          POSTGRES_PASSWORD: ci-postgres-password-not-real
          POSTGRES_DB: v2ex_diag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2ex -d v2ex_diag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ci-redis-password-not-real
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci-redis-password-not-real ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps ${{ inputs.browser }}
      - name: 建库 / 迁移 / seed
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_diag
          PGPASSWORD: ci-postgres-password-not-real
        run: |
          psql -h localhost -p 5432 -U v2ex -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS v2ex_diag" -c "CREATE DATABASE v2ex_diag"
          npx drizzle-kit migrate
          SEED_TIME_ANCHOR='2026-11-06T04:00:00.000Z' npx tsx scripts/seed.ts
      - name: 构建
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_diag
        run: npx next build
      - name: 启动应用
        env:
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_diag
          REDIS_URL: redis://:ci-redis-password-not-real@localhost:6379
          APP_URL: http://127.0.0.1:3010
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3010
          LOCAL_BASE: http://127.0.0.1:3010
        run: |
          npx next start -p 3010 > /tmp/diag-server.log 2>&1 &
          echo $! > /tmp/diag-server.pid
          for i in $(seq 1 60); do
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3010/ || echo 000)
            [ "$C" = "200" ] && exit 0
            sleep 1
          done
          echo "::error::应用未就绪"; tail -20 /tmp/diag-server.log; exit 1
      - name: 运行诊断脚本
        env:
          LOCAL_BASE: http://127.0.0.1:3010
          DIAG_BROWSER: ${{ inputs.browser }}
          DATABASE_URL: postgres://v2ex:ci-postgres-password-not-real@localhost:5432/v2ex_diag
          REDIS_URL: redis://:ci-redis-password-not-real@localhost:6379
        run: |
          node tools/diag/firefox-thanks-403.mjs 2>&1 | tee /tmp/diag-run.log
      - name: 上传诊断输出
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-thanks-403-${{ github.run_id }}
          path: |
            /tmp/diag-run.log
            /tmp/diag-server.log
          retention-days: 14
          if-no-files-found: error
      - name: 清理
        if: always()
        run: |
          [ -f /tmp/diag-server.pid ] && kill "$(cat /tmp/diag-server.pid)" 2>/dev/null || true
